let LIBDRAG=null;
const tileAt=()=>{ const el=hitEl(); return el&&el.closest&&el.closest('[data-lid]'); };
const _pd19=pinchDown, _pm19=pinchMove, _pu19=pinchUp;
pinchDown=function(){ _pd19.apply(this,arguments);
  if(!LIBEDIT||!DRAG||DRAG.kind!=='press') return; const t=DRAG.a&&DRAG.a.closest&&DRAG.a.closest('.app[data-lid]'); if(!t) return;
  LIBDRAG={id:t.dataset.lid,ctx:t.dataset.ctx,x0:S.cx,y0:S.cy,moved:false,over:null,flipT:0}; DRAG.kind='libdrag'; t.classList.add('dragSrc'); };
pinchMove=function(){ if(!(DRAG&&DRAG.kind==='libdrag'&&LIBDRAG)) return _pm19.apply(this,arguments);
  if(!LIBDRAG.moved&&Math.hypot(S.cx-LIBDRAG.x0,S.cy-LIBDRAG.y0)>18) LIBDRAG.moved=true;
  if(!LIBDRAG.moved) return;
  const t=tileAt(); const over=t&&t.dataset.lid!==LIBDRAG.id?t:null;
  document.querySelectorAll('.dropT').forEach(e=>e!==over&&e.classList.remove('dropT')); if(over) over.classList.add('dropT');
  // 矢印の上で少し待つとページをめくる
  const el=hitEl(); const arrow=el&&el.closest&&el.closest('.libPrev,.libNext');
  if(arrow){ LIBDRAG.flipT+=S.dt||.016; if(LIBDRAG.flipT>.6){ LIBDRAG.flipT=0; LIBPAGE+=arrow.classList.contains('libNext')?1:-1; renderLib(); const s=document.querySelector(`.lib [data-lid="${LIBDRAG.id}"]`); s&&s.classList.add('dragSrc'); AU.tone(880,.04,'sine',.06); } } else LIBDRAG.flipT=0;
};
pinchUp=function(){ if(!(DRAG&&DRAG.kind==='libdrag'&&LIBDRAG)) return _pu19.apply(this,arguments);
  S.pinch=false; DRAG=null; const D=LIBDRAG; LIBDRAG=null; document.querySelectorAll('.dropT,.dragSrc').forEach(e=>e.classList.remove('dropT','dragSrc'));
  if(!D.moved){ libSheet(D.id,D.ctx); return; }
  const t=tileAt(); if(!t){ renderLib(); return; }
  const tid=t.dataset.lid, tctx=t.dataset.ctx;
  if(tid==='__out'){ moveToFolder(D.id,'top'); return; }
  if(tid===D.id) return;
  if(isFold(tid)&&!isFold(D.id)){ moveToFolder(D.id,tid); toastW(L(`「${FOLDERS[tid].name}」に入れました`,`Moved into "${FOLDERS[tid].name}"`)); return; }
  // 同じ場所どうしで並び替え（ちがう場所なら、その場所へ移す）
  if(tctx!==D.ctx){ if(isFold(D.id)) return; moveToFolder(D.id,tctx); }
  const a=listOf(tctx); const i=a.indexOf(D.id); if(i>=0) a.splice(i,1); const j=a.indexOf(tid); a.splice(j<0?a.length:(i>=0&&i<=j?j+1:j),0,D.id);
  libSave(); renderLib(); drawFolder(); AU.tone(760,.05,'sine',.08);
};

// キーは端末の中だけに保存。ほかのアプリ（ぼくといっしょ・NaviX）で入れたキーも使える
const AI={hist:STORE.get('ai_hist',[]),busy:false,rec:null,listening:false,views:new Set()};
const AIDEF={model:'gemini-2.5-flash'};
const aiKey=()=>CFG.aiKey||'';
function aiOtherKey(){ for(const [k,f] of [['chara_cfg',v=>v&&v.key],['navix_ai',v=>v&&v.key]]){ try{ const v=f(JSON.parse(localStorage.getItem(k)||'null')); if(v) return v; }catch(e){} } return ''; }
const aiSaveHist=()=>{ AI.hist=AI.hist.slice(-40); STORE.set('ai_hist',AI.hist); };
const AIACTS=['open_app','open_url','search','scenery','widget','timer','weather','youtube','close_apps','fullscreen'];
function aiSystem(){
  const apps=INST.filter(i=>APPS[i]).map(i=>`${i}:${appName(i)}`).join(', ');
  return `あなたは「Home XR OS」というXRふうのウェブOSに入っているAIアシスタントです。やさしく、短めに（3〜4文以内）、${CFG.lang==='en'?'English':'日本語（ひらがな多め、わかりやすく）'}で答えます。
ユーザーがOSの操作をたのんだら actions に入れてください。たのまれていない操作はしません。
使える操作（type と value）:
- open_app: アプリを開く。value はアプリのid。使えるアプリ: ${apps}
- open_url: ブラウザでURLを開く。value はURL
- search: ブラウザで調べる。value は調べることば
- scenery: まわりの景色を変える。value は living, space, beach, forest, city, snow, aurora のどれか
- widget: ウィジェットを置く。value は clock, weather, calendar, memo, photo, timer のどれか
- timer: タイマーをかける。value は分（数字）
- weather: 天気を調べて見せる。value は都市名（なければ空）
- youtube: YouTubeを再生。value はYouTubeのURLか動画ID（検索はできないので、URLがないときは search を使う）
- close_apps: 開いているアプリをぜんぶ閉じる
- fullscreen: 全画面にする
いまの日時: ${new Date().toLocaleString('ja-JP')}。`;
}
async function aiGemini(text){
  const key=aiKey(); const c=new AbortController(); const t=setTimeout(()=>c.abort(),30000);
  const contents=AI.hist.slice(-16).filter(m=>m.t).map(m=>({role:m.r==='u'?'user':'model',parts:[{text:m.t}]}));
  contents.push({role:'user',parts:[{text}]});
  const body={systemInstruction:{parts:[{text:aiSystem()}]},contents,generationConfig:{temperature:.7,responseMimeType:'application/json',responseSchema:{type:'OBJECT',properties:{reply:{type:'STRING'},actions:{type:'ARRAY',items:{type:'OBJECT',properties:{type:{type:'STRING',enum:AIACTS},value:{type:'STRING'}},required:['type']}}},required:['reply']}}};
  try{ const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(CFG.aiModel||AIDEF.model)}:generateContent`,{method:'POST',signal:c.signal,headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify(body)});
    const j=await r.json(); if(!r.ok) throw new Error((j.error&&j.error.message)||('HTTP '+r.status));
    const raw=j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts.map(p=>p.text||'').join('');
    let o; try{ o=JSON.parse(raw); }catch(e){ o={reply:raw||'…',actions:[]}; } return o;
  } finally{ clearTimeout(t); }
}
// キーがないとき：かんたんな言葉だけわかる
function aiOffline(text){
  const t=text.replace(/\s/g,''); const acts=[];
  const app=INST.filter(i=>APPS[i]).find(i=>{ const n=appName(i); return n&&t.includes(n); });
  let m;
  if(/天気|てんき|weather/i.test(t)){ const c=(t.match(/^(.+?)の(?:今日の|きょうの|明日の)?(?:天気|てんき)/)||[])[1]; acts.push({type:'weather',value:c&&!/今日|きょう|いま|今/.test(c)?c:''}); }
  else if((m=t.match(/(\d+)分/))&&/タイマー|timer/i.test(t)) acts.push({type:'timer',value:m[1]});
  else if(/閉じて|とじて|ぜんぶ消して/.test(t)) acts.push({type:'close_apps'});
  else if(/全画面/.test(t)) acts.push({type:'fullscreen'});
  else { const env=ENVLIST.find(e=>t.includes(e[1])); if(env&&/景色|けしき|にして|にかえて|に変えて/.test(t)) acts.push({type:'scenery',value:env[0]}); else if(app) acts.push({type:'open_app',value:app}); }
  if(acts.length) return {reply:L('わかったよ！','OK!'),actions:acts};
  return {reply:L('ごめんね、いまはかんたんな操作だけわかるよ（例：「天気」「3分タイマー」「YouTubeを開いて」「景色を森にして」）。設定でGeminiのキーを入れると、なんでもお話しできるよ。','Sorry, I only understand simple commands now. Add a Gemini key in settings to chat about anything.'),actions:[]};
}
async function aiWeather(city){
  let pl=LOAD('wplace',{name:L('東京','Tokyo'),lat:35.68,lon:139.76});
  if(city){ const g=await (await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=${CFG.lang==='en'?'en':'ja'}`)).json(); if(g.results&&g.results[0]){ const x=g.results[0]; pl={name:x.name,lat:x.latitude,lon:x.longitude}; } }
  const r=await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${pl.lat}&longitude=${pl.lon}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=1`)).json();
  const wm=(typeof WMO!=='undefined'&&WMO[r.current.weather_code])||['cloud','—','—'];
  return {ico:wm[0],text:L(`${pl.name}：いま ${Math.round(r.current.temperature_2m)}°・${wm[1]}。今日は 最高 ${Math.round(r.daily.temperature_2m_max[0])}° / 最低 ${Math.round(r.daily.temperature_2m_min[0])}°、雨の確率 ${r.daily.precipitation_probability_max[0]}%`,`${pl.name}: now ${Math.round(r.current.temperature_2m)}°, ${wm[2]}. High ${Math.round(r.daily.temperature_2m_max[0])}° / low ${Math.round(r.daily.temperature_2m_min[0])}°, rain ${r.daily.precipitation_probability_max[0]}%`)};
}
async function aiDo(a){
  const v=String(a.value||'').trim();
  try{
    if(a.type==='open_app'){ const id=APPS[v]?v:INST.find(i=>APPS[i]&&appName(i)===v); if(id){ if(!INST.includes(id)){ INST.push(id); STORE.set('inst',INST); renderLib(); } openApp(id); return L(`「${appName(id)}」を開きました`,`Opened ${appName(id)}`); } return L('そのアプリが見つかりませんでした','App not found'); }
    if(a.type==='open_url'){ openSite(/^https?:/i.test(v)?v:'https://'+v); return L('ブラウザで開きました','Opened in browser'); }
    if(a.type==='search'){ const bw=openSite(''); bw&&bw.go&&bw.go(v); return L(`「${v}」を調べました`,`Searched "${v}"`); }
    if(a.type==='scenery'){ if(ENVLIST.some(e=>e[0]===v)){ setEnv(v); return L('景色を変えました','Changed scenery'); } return ''; }
    if(a.type==='widget'){ if(WTYPES.some(w=>w[0]===v)){ wgAdd(v); return L('ウィジェットを置きました','Placed a widget'); } return ''; }
    if(a.type==='timer'){ const m=Math.max(1,Math.min(180,parseFloat(v)||3)); const d={id:'w'+Date.now().toString(36),type:'timer',yaw:S.yaw+12,y:-200,d:1.18,end:Date.now()+m*60000}; WG.list.push(d); wgSave(); wgMake(d); return L(`${m}分のタイマーをかけました`,`Timer set for ${m} min`); }
    if(a.type==='weather'){ const w=await aiWeather(v); return {html:`<div class="aiW"><span class="bigIco sm">${svg(w.ico)}</span>${esc(w.text)}</div>`,text:w.text}; }
    if(a.type==='youtube'){ const id=ytParse(v); if(!id) return L('YouTubeのURLがあれば再生できるよ','Give me a YouTube URL'); const w=openApp('youtube')||WINS.find(x=>x.id==='youtube'); setTimeout(()=>{ const ww=WINS.find(x=>x.id==='youtube'); ww&&ww.play&&ww.play(id); },200); return L('YouTubeで再生しました','Playing on YouTube'); }
    if(a.type==='close_apps'){ [...WINS].forEach(w=>closeWin(w.id)); return L('アプリを閉じました','Closed apps'); }
    if(a.type==='fullscreen'){ FS.toggle(); return ''; }
  }catch(e){ return L('うまくできませんでした','Something went wrong'); }
  return '';
}
function aiSpeak(t){ if(!CFG.aiVoice||!window.speechSynthesis) return; try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t.replace(/[*#`]/g,'')); u.lang=CFG.lang==='en'?'en-US':'ja-JP'; u.rate=1.05; speechSynthesis.speak(u); }catch(e){} }
const aiRedraw=()=>AI.views.forEach(f=>{ try{ f(); }catch(e){} });
async function aiAsk(text){
  text=String(text||'').trim(); if(!text||AI.busy) return; AI.busy=true;
  AI.hist.push({r:'u',t:text}); aiSaveHist(); aiRedraw();
  let o; try{ o=aiKey()?await aiGemini(text):aiOffline(text); }catch(e){ o={reply:L('つながりませんでした：','Could not connect: ')+e.message,actions:[]}; }
  const msg={r:'a',t:o.reply||'',extra:[]}; AI.hist.push(msg); AI.busy=false; aiSaveHist(); aiRedraw(); aiSpeak(msg.t);
  for(const a of (o.actions||[]).slice(0,4)){ const res=await aiDo(a); if(res){ msg.extra.push(typeof res==='string'?{text:res}:res); aiSaveHist(); aiRedraw(); } }
}
function aiListen(onText,onState){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR){ toastW(L('この端末では音声入力が使えません。キーボードのマイクを使ってね','Voice input is not available here. Use the keyboard mic.')); return; }
  if(AI.listening&&AI.rec){ AI.rec.stop(); return; }
  const r=new SR(); r.lang=CFG.lang==='en'?'en-US':'ja-JP'; r.interimResults=true; r.continuous=false; AI.rec=r; AI.listening=true; onState(true); let fin='';
  r.onresult=e=>{ let s=''; for(const x of e.results){ s+=x[0].transcript; if(x.isFinal) fin=s; } onText(s,false); };
  r.onerror=e=>{ if(e.error==='not-allowed') toastW(L('マイクを許可してね','Please allow the microphone')); };
  r.onend=()=>{ AI.listening=false; onState(false); if(fin) onText(fin,true); };
  try{ r.start(); AU.tone(880,.06,'sine',.08); }catch(e){ AI.listening=false; onState(false); }
}

function fitKB(){ const o=KB.wo; if(!o||!o.shown) return; o.s=1; o.place();
  const r=o.el.getBoundingClientRect(); if(!r.height) return; const lim=S.H-6; if(r.bottom<=lim) return;
  const c=(r.top+r.bottom)/2, need=r.height/2; let s=(lim-c)/need;
  if(s<.72){ // 小さくしすぎるときは、少し上にずらす
    const up=(r.bottom-lim)-(r.height*(1-.72)/2); o.y-=up*(o.d*S.DB/S.P); s=.72; }
  o.s=Math.max(.6,Math.min(1,s)); o.place(); }

function w3Mesh(o){ const T=W3.T; let m; const col=new T.Color(okCol(o.c));

  else if(o.t==='text'){ m=new T.Mesh(new T.PlaneGeometry(1,.25),new T.MeshBasicMaterial({map:w3TextTex(T,o.txt||'',okCol(o.c),'rgba(0,0,0,.45)'),transparent:true,side:T.DoubleSide})); }

  else if(o.t==='light'){ m=new T.Group(); const l=new T.PointLight(col,30,18); m.add(l); const b=new T.Mesh(new T.SphereGeometry(.15,12,8),new T.MeshBasicMaterial({color:col})); b.userData.editOnly=1; m.add(b); }

  let data=opts.data; W3.mine=!!opts.mine; W3.wid=id; W3.remote=!!opts.remote;
  if(!data){ const m=MYW(); data=m[id]; if(!data){ toastW(L('ワールドが見つかりません','World not found')); return; } }
  W3.gScript=null; W3.data=JSON.parse(JSON.stringify(data)); W3.data.objs=(W3.data.objs||[]).slice(0,500);
  // 画面
  const ov=h('div','w3'); ov.id='w3'; ov.innerHTML=`<canvas class="w3c"></canvas>
   <div class="w3top"><button class="w3b w3exit" aria-label="${L('ワールドから出る','Leave world')}">${svg('x')}</button><div class="w3title"><b></b><span class="sub"></span></div><div class="sp"></div>
   <button class="w3b w3view" aria-label="${L('視点を切りかえ','Switch view')}">${svg('eye')}</button><button class="w3b w3editB" aria-label="${L('ワールドをつくる','Edit world')}">${svg('square-pen')}</button></div>
   <div class="w3log"></div><div class="w3hint"></div>
   <div class="w3stick"><div class="w3knob"></div></div>
   <div class="w3right"><button class="w3big w3jump" aria-label="${L('ジャンプ','Jump')}">${svg('chevrons-up')}</button><button class="w3big w3hi" aria-label="${L('ヤッホー','Hi!')}">${svg('hand')}</button><button class="w3big w3chat" aria-label="${L('ひとこと','Say')}">${svg('message-circle')}</button></div>
   <div class="w3sayBox"><input class="w3in" maxlength="60" placeholder="${L('ひとこと（Enterで送る）','Say something')}"><button class="w3b w3send">${svg('send')}</button></div>
   <div class="w3panel"></div>`;
  document.body.appendChild(ov); document.body.classList.add('w3on'); W3.ov=ov; W3.on=true; W3.edit=false; W3.sel=null; W3.carry=null; W3.log=[];
  const cv=ov.querySelector('.w3c'); const R=new T.WebGLRenderer({canvas:cv,antialias:true}); R.setPixelRatio(Math.min(2,devicePixelRatio||1)); R.shadowMap.enabled=true; R.shadowMap.type=T.PCFSoftShadowMap; R.outputColorSpace=T.SRGBColorSpace; W3.R=R;
  const sc=new T.Scene(); W3.scene=sc; const cam=new T.PerspectiveCamera(70,1,.05,400); W3.cam=cam;
  W3.hemi=new T.HemisphereLight(0xffffff,0x667788,1); sc.add(W3.hemi);
  const sun=new T.DirectionalLight(0xffffff,1.6); sun.position.set(20,40,15); sun.castShadow=true; sun.shadow.mapSize.set(1024,1024); Object.assign(sun.shadow.camera,{left:-40,right:40,top:40,bottom:-40,far:120}); sc.add(sun); W3.sun=sun;
  W3.groundM=new T.Mesh(new T.CircleGeometry(80,64),new T.MeshStandardMaterial({color:0x7cc47f,roughness:1})); W3.groundM.rotation.x=-Math.PI/2; W3.groundM.receiveShadow=true; sc.add(W3.groundM);
  W3.grid=new T.GridHelper(80,80,0xffffff,0xffffff); W3.grid.material.opacity=.15; W3.grid.material.transparent=true; W3.grid.position.y=.01; W3.grid.visible=false; sc.add(W3.grid);
  W3.spawnM=new T.Mesh(new T.CylinderGeometry(.5,.5,.05,24),new T.MeshBasicMaterial({color:0x34d399,transparent:true,opacity:.7})); W3.spawnM.visible=false; sc.add(W3.spawnM);
  W3.objs.clear(); for(const o of W3.data.objs) w3Add(o); w3Env(); w3Boxes();
  const sp=W3.data.spawn||[0,0,6]; W3.pos=new T.Vector3(sp[0],sp[1],sp[2]); W3.vel=new T.Vector3(); W3.yaw=0; W3.pitch=0; W3.ray=new T.Raycaster();
  // 自分のアバター（三人称で見える）
  W3.me=w3Avatar(FB.profile&&FB.profile.name||L('じぶん','Me'),FB.profile&&FB.profile.color||'#5aa8ff'); W3.me.g.visible=false; sc.add(W3.me.g);
  ov.querySelector('.w3title b').textContent=W3.data.name||L('ワールド','World');
  ov.querySelector('.w3editB').style.display=W3.mine?'':'none';
  w3Bind(); w3Resize(); addEventListener('resize',w3Resize);
  W3.last=performance.now(); W3.raf=requestAnimationFrame(w3Loop);
  w3Hint(L('左のスティックで歩く・右側をドラッグで見回す','Left stick to walk, drag right side to look'));
  w3ScriptStart(); w3NetStart();

}
function w3Close(){ if(!W3.on) return; if(W3.edit&&W3.dirty) w3Save(true); W3.on=false; cancelAnimationFrame(W3.raf); removeEventListener('resize',w3Resize); w3NetStop(); w3ScriptStop();
  try{ for(const {m} of W3.objs.values()) w3Dispose(m); W3.R.dispose(); }catch(e){} W3.objs.clear(); W3.players.clear(); W3.ov.remove(); document.body.classList.remove('w3on'); W3.ov=null; }
function w3Resize(){ if(!W3.on) return; const w=innerWidth,hh=innerHeight; W3.R.setSize(w,hh,false); W3.cam.aspect=w/hh; W3.cam.updateProjectionMatrix(); }
function w3Hint(t){ const e=W3.ov&&W3.ov.querySelector('.w3hint'); if(!e) return; e.textContent=t; e.classList.add('on'); clearTimeout(W3.ht); W3.ht=setTimeout(()=>e.classList.remove('on'),3500); }
function w3Log(name,text){ W3.log.push([name,text]); W3.log=W3.log.slice(-6); const e=W3.ov&&W3.ov.querySelector('.w3log'); if(e) e.innerHTML=W3.log.map(([n,t])=>`<div><b>${esc(n)}</b> ${esc(t)}</div>`).join(''); }

/* ---- アバター ---- */
function w3Avatar(name,color){ const T=W3.T; const g=new T.Group(); const c=new T.Color(okCol(color));
  const body=new T.Mesh(new T.CapsuleGeometry(.28,.7,6,14),new T.MeshStandardMaterial({color:c,roughness:.6})); body.position.y=.65; body.castShadow=true; g.add(body);
  const head=new T.Group(); head.position.y=1.45; g.add(head);
  const hm=new T.Mesh(new T.SphereGeometry(.26,22,16),new T.MeshStandardMaterial({color:c.clone().lerp(new T.Color(0xffffff),.45),roughness:.5})); hm.castShadow=true; head.add(hm);
  for(const x of [-.09,.09]){ const e=new T.Mesh(new T.SphereGeometry(.045,10,8),new T.MeshBasicMaterial({color:0x111111})); e.position.set(x,.03,-.23); head.add(e); }
  const nm=new T.Sprite(new T.SpriteMaterial({map:w3TextTex(T,name,'#ffffff','rgba(0,0,0,.5)'),depthTest:false})); nm.scale.set(1.2,.3,1); nm.position.y=2.0; g.add(nm);
  const bub=new T.Sprite(new T.SpriteMaterial({transparent:true,depthTest:false})); bub.scale.set(1.8,.45,1); bub.position.y=2.45; bub.visible=false; g.add(bub);
  return {g,head,body,bub,name,sayAt:0,hop:0}; }
function w3Say(av,text){ const T=W3.T; if(av.bub.material.map) av.bub.material.map.dispose(); av.bub.material.map=w3TextTex(T,text,'#111111','rgba(255,255,255,.95)'); av.bub.material.needsUpdate=true; av.bub.visible=true; av.sayT=5; av.hop=.6; }

/* ---- 入力 ---- */
function w3Bind(){ const ov=W3.ov;
  ov.querySelector('.w3exit').onclick=()=>w3Close();
  ov.querySelector('.w3view').onclick=()=>{ W3.third=!W3.third; w3Hint(W3.third?L('三人称（自分が見える）','Third person'):L('一人称','First person')); };
  ov.querySelector('.w3editB').onclick=()=>w3SetEdit(!W3.edit);
  ov.querySelector('.w3jump').onpointerdown=e=>{ e.preventDefault(); w3Jump(); };
  ov.querySelector('.w3hi').onclick=()=>w3SendSay(L('ヤッホー！','Hi!'));
  const box=ov.querySelector('.w3sayBox'), inp=ov.querySelector('.w3in');
  ov.querySelector('.w3chat').onclick=()=>{ box.classList.toggle('on'); if(box.classList.contains('on')) inp.focus(); };
  const send=()=>{ const t=inp.value.trim(); if(t){ w3SendSay(t); inp.value=''; } box.classList.remove('on'); inp.blur(); };
  ov.querySelector('.w3send').onclick=send; inp.onkeydown=e=>{ e.stopPropagation(); if(e.key==='Enter') send(); if(e.key==='Escape'){ box.classList.remove('on'); inp.blur(); } };
  // スティック
  const st=ov.querySelector('.w3stick'), kn=ov.querySelector('.w3knob'); let sid=null;
  const setS=e=>{ const r=st.getBoundingClientRect(); let x=(e.clientX-r.left-r.width/2)/(r.width/2), y=(e.clientY-r.top-r.height/2)/(r.height/2); const l=Math.hypot(x,y); if(l>1){ x/=l; y/=l; } W3.stick.x=x; W3.stick.y=y; kn.style.transform=`translate(${x*40}px,${y*40}px)`; };
  st.onpointerdown=e=>{ sid=e.pointerId; st.setPointerCapture(sid); setS(e); }; st.onpointermove=e=>{ if(e.pointerId===sid) setS(e); };
  st.onpointerup=st.onpointercancel=e=>{ if(e.pointerId!==sid) return; sid=null; W3.stick.x=W3.stick.y=0; kn.style.transform=''; };
  // 見回す・タップ
  const cv=ov.querySelector('.w3c'); const ptrs=new Map();
  cv.onpointerdown=e=>{ cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY,t:performance.now()}); };
  cv.onpointermove=e=>{ const p=ptrs.get(e.pointerId); if(!p) return; const dx=e.clientX-p.x, dy=e.clientY-p.y; p.x=e.clientX; p.y=e.clientY; W3.yaw-=dx*.0045*(CFG.look||1); W3.pitch=clamp(W3.pitch-dy*.0045*(CFG.look||1),-1.4,1.4); };
  cv.onpointerup=e=>{ const p=ptrs.get(e.pointerId); ptrs.delete(e.pointerId); if(p&&Math.hypot(e.clientX-p.x0,e.clientY-p.y0)<8&&performance.now()-p.t<400) w3Tap(e.clientX,e.clientY); };
  cv.onpointercancel=e=>ptrs.delete(e.pointerId);
  W3.kd=e=>{ if(!W3.on||e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return; W3.keys.add(e.code); if(e.code==='Space'){ e.preventDefault(); w3Jump(); } if(e.code==='Escape') w3Close(); e.stopPropagation(); };
  W3.ku=e=>{ W3.keys.delete(e.code); };
  addEventListener('keydown',W3.kd,true); addEventListener('keyup',W3.ku,true);
}
function w3Jump(){ if(W3.ground){ W3.vel.y=7.2; W3.ground=false; AU.tone(520,.05,'sine',.05); } }
function w3SendSay(t){ t=String(t).slice(0,60); w3Say(W3.me,t); w3Log(W3.me.name,t); W3.mySay={t,at:Date.now()}; w3NetSend(true); w3ScriptEvent({ev:'chat',name:W3.me.name,text:t}); }
function w3Tap(x,y){ const T=W3.T; const v=new T.Vector2(x/innerWidth*2-1,-(y/innerHeight)*2+1); W3.ray.setFromCamera(v,W3.cam);
  const list=[...W3.objs.values()].map(e=>e.m).filter(m=>m.visible!==false); const hit=W3.ray.intersectObjects(list,true)[0];
  if(W3.edit){ if(W3.carry){ w3Drop(); return; } if(hit){ w3Select(hit.object.userData.oid); } else w3Select(null); return; }
  if(hit&&hit.distance<12){ w3ScriptEvent({ev:'click',id:hit.object.userData.oid}); } }

/* ---- うごき ---- */
const W3R=.32, W3H=1.65; const w3G=()=>20*(W3.gScript!=null?W3.gScript:(W3.data&&W3.data.grav!=null?W3.data.grav:1));
function w3Collide(axis){ const p=W3.pos; for(const b of W3.boxes){ if(p.x+W3R<=b.min.x||p.x-W3R>=b.max.x||p.z+W3R<=b.min.z||p.z-W3R>=b.max.z||p.y+W3H<=b.min.y||p.y>=b.max.y) continue;
    if(axis==='y') continue;
    const step=b.max.y-p.y; if(step>0&&step<=.45&&W3.ground){ p.y=b.max.y; continue; }
    if(axis==='x'){ const a=p.x-(b.min.x+b.max.x)/2; p.x=a>0?b.max.x+W3R+.001:b.min.x-W3R-.001; }
    else { const a=p.z-(b.min.z+b.max.z)/2; p.z=a>0?b.max.z+W3R+.001:b.min.z-W3R-.001; } } }
function w3Loop(now){ if(!W3.on) return; W3.raf=requestAnimationFrame(w3Loop); const dt=Math.min(.05,(now-W3.last)/1000); W3.last=now; const T=W3.T;
  // 入力
  let mx=W3.stick.x, mz=W3.stick.y; const K=W3.keys; if(K.has('KeyW')||K.has('ArrowUp')) mz=-1; if(K.has('KeyS')||K.has('ArrowDown')) mz=1; if(K.has('KeyA')) mx=-1; if(K.has('KeyD')) mx=1;
  if(K.has('ArrowLeft')) W3.yaw+=dt*2; if(K.has('ArrowRight')) W3.yaw-=dt*2;
  const sp=(K.has('ShiftLeft')?7:4.2), s=Math.sin(W3.yaw), c=Math.cos(W3.yaw);
  const dx=(mx*c+mz*s)*sp*dt, dz=(-mx*s+mz*c)*sp*dt; W3.moving=Math.hypot(mx,mz)>.1;
  const p=W3.pos; p.x+=dx; w3Collide('x'); p.z+=dz; w3Collide('z');
  // 重力
  // 動く物（重力・押せる）
  const G=w3G(), T3=W3.T;
  for(const e of (W3.dyn||[])){ const o=e.o; if(W3.carry===o.id) continue; e.m.updateMatrixWorld(true); const bb=new T3.Box3().setFromObject(e.m); const hy=(bb.max.y-bb.min.y)/2, hx=(bb.max.x-bb.min.x)/2, hz=(bb.max.z-bb.min.z)/2;
    e.vy-=G*dt; e.vy=Math.max(e.vy,-40); let y=o.p[1]+e.vy*dt; let land=false;
    if(W3.data.ground!=='none'&&y-hy<=0&&Math.hypot(o.p[0],o.p[2])<80){ y=hy; land=true; }
    for(const b of W3.boxes){ if(o.p[0]+hx<=b.min.x||o.p[0]-hx>=b.max.x||o.p[2]+hz<=b.min.z||o.p[2]-hz>=b.max.z) continue; if(e.vy<=0&&o.p[1]-hy>=b.max.y-.05&&y-hy<b.max.y){ y=b.max.y+hy; land=true; } }
    if(land){ e.vy=o.bounce&&Math.abs(e.vy)>2?-e.vy*.55:0; }
    // 押す
    const pp=W3.pos; if(o.solid&&pp.x+W3R>o.p[0]-hx&&pp.x-W3R<o.p[0]+hx&&pp.z+W3R>o.p[2]-hz&&pp.z-W3R<o.p[2]+hz&&pp.y+W3H>y-hy&&pp.y<y+hy-.1){
      const ox=o.p[0]-pp.x, oz=o.p[2]-pp.z; if(Math.abs(ox)/hx>Math.abs(oz)/hz) o.p[0]=pp.x+Math.sign(ox||1)*(hx+W3R+.01); else o.p[2]=pp.z+Math.sign(oz||1)*(hz+W3R+.01); }
    if(y<-60){ y=10; e.vy=0; }
    o.p[1]=y; w3Place(e.m,o); }
  W3.vel.y-=G*dt; const py=p.y; p.y+=W3.vel.y*dt; W3.ground=false;
  // 動く物の上にも乗れる
  for(const e of (W3.dyn||[])){ if(!e.o.solid) continue; const b=new T3.Box3().setFromObject(e.m); if(p.x+W3R<=b.min.x||p.x-W3R>=b.max.x||p.z+W3R<=b.min.z||p.z-W3R>=b.max.z) continue; if(W3.vel.y<=0&&py>=b.max.y-.05&&p.y<b.max.y){ p.y=b.max.y; W3.vel.y=0; W3.ground=true; } }
  if(W3.data.ground!=='none'&&p.y<=0&&Math.hypot(p.x,p.z)<80){ p.y=0; W3.vel.y=0; W3.ground=true; }
  for(const b of W3.boxes){ if(p.x+W3R<=b.min.x||p.x-W3R>=b.max.x||p.z+W3R<=b.min.z||p.z-W3R>=b.max.z) continue;
    if(W3.vel.y<=0&&py>=b.max.y-.05&&p.y<b.max.y){ p.y=b.max.y; W3.vel.y=0; W3.ground=true; }
    else if(W3.vel.y>0&&py+W3H<=b.min.y+.05&&p.y+W3H>b.min.y){ p.y=b.min.y-W3H; W3.vel.y=0; } }
  if(Math.abs(p.y-py)<1e-4&&W3.vel.y===0) W3.ground=true;
  if(p.y<-30){ const sp2=W3.data.spawn||[0,0,6]; p.set(sp2[0],sp2[1]+1,sp2[2]); W3.vel.set(0,0,0); w3Hint(L('落ちちゃった！スタート地点にもどったよ','You fell! Back to start')); }
  // カメラ
  const eye=new T.Vector3(p.x,p.y+1.5,p.z);
  if(W3.third){ const back=new T.Vector3(Math.sin(W3.yaw)*Math.cos(W3.pitch),-Math.sin(W3.pitch),Math.cos(W3.yaw)*Math.cos(W3.pitch)); W3.cam.position.copy(eye).addScaledVector(back,3.2).add(new T.Vector3(0,.4,0)); W3.cam.lookAt(eye); }
  else { W3.cam.position.copy(eye); W3.cam.rotation.set(W3.pitch,W3.yaw,0,'YXZ'); }
  // 自分のアバター
  const me=W3.me; me.g.visible=W3.third; me.g.position.set(p.x,p.y+(me.hop>0?Math.abs(Math.sin(me.hop*10))*.25:0),p.z); me.g.rotation.y=W3.yaw; me.head.rotation.x=-W3.pitch*.5;
  w3AvTick(me,dt);
  // 持っている物
  if(W3.carry){ const e=W3.objs.get(W3.carry); if(e){ const f=new T.Vector3(); W3.cam.getWorldDirection(f); const d=Math.max(2.5,Math.max(...e.o.s)*1.4); const q=eye.clone().addScaledVector(f,d); const g=.25; e.o.p=[Math.round(q.x/g)*g,Math.max(e.o.t==='tree'||e.o.t==='light'?0:e.o.s[1]/2,Math.round(q.y/g)*g),Math.round(q.z/g)*g]; if(e.o.t==='tree') e.o.p[1]=Math.max(0,e.o.p[1]-1); w3Place(e.m,e.o); w3Outline(); } }
  // ほかの人
  for(const pl of W3.players.values()){ const a=pl.av; a.g.position.lerp(pl.tp,Math.min(1,dt*8)); let dy=pl.ty-a.g.rotation.y; dy=Math.atan2(Math.sin(dy),Math.cos(dy)); a.g.rotation.y+=dy*Math.min(1,dt*8); w3AvTick(a,dt); }
  W3.spawnM.visible=W3.edit; if(W3.edit){ const s2=W3.data.spawn||[0,0,6]; W3.spawnM.position.set(s2[0],s2[1]+.03,s2[2]); }
  for(const {o,m} of W3.objs.values()) if(o.t==='light') m.children[1].visible=W3.edit;
  W3.R.render(W3.scene,W3.cam);
  w3NetSend(false); w3ScriptTick(dt);
  // ふれたとき（スクリプト）
  if(W3.script&&W3.touchables){ for(const id of W3.touchables){ const e=W3.objs.get(id); if(!e) continue; const b=new T.Box3().setFromObject(e.m).expandByScalar(.25); const inside=b.containsPoint(new T.Vector3(p.x,p.y+.8,p.z)); if(inside&&!e.touching) w3ScriptEvent({ev:'touch',id}); e.touching=inside; } }
}
function w3AvTick(a,dt){ if(a.hop>0) a.hop=Math.max(0,a.hop-dt); if(a.sayT>0){ a.sayT-=dt; if(a.sayT<=0) a.bub.visible=false; } }

/* ---- エディタ ---- */
function w3SetEdit(v){ W3.edit=v; W3.ov.classList.toggle('editing',v); W3.grid.visible=v; if(!v){ if(W3.carry) w3Drop(); w3Select(null); if(W3.dirty) w3Save(true); } w3Panel(); w3Hint(v?L('つくるモード：物をタップで選ぶ。＋で追加','Edit mode: tap to select, + to add'):L('あそぶモード','Play mode')); }
function w3Select(id){ W3.sel=id; w3Outline(); w3Panel(); }
function w3Outline(){ const T=W3.T; if(W3.box3) { W3.scene.remove(W3.box3); W3.box3=null; } const e=W3.sel&&W3.objs.get(W3.sel); if(!e) return; W3.box3=new T.BoxHelper(e.m,0x4f8cff); W3.scene.add(W3.box3); }
function w3Changed(id,rebuild){ W3.dirty=true; const e=W3.objs.get(id); if(!e) return; if(rebuild) w3Rebuild(id); else { w3Place(e.m,e.o); w3Outline(); w3Boxes(); } }
function w3NewObj(t){ const T=W3.T; const f=new T.Vector3(); W3.cam.getWorldDirection(f); f.y=0; f.normalize(); const q=W3.pos.clone().addScaledVector(f,3.5);
  const o={id:'o'+Date.now().toString(36)+((Math.random()*99)|0),t,p:[Math.round(q.x*4)/4,t==='tree'||t==='light'?(t==='light'?2.5:0):.5,Math.round(q.z*4)/4],r:[0,Math.round(-W3.yaw*180/Math.PI/15)*15,0],s:t==='text'?[3,1,1]:t==='panel'?[2,2,1]:[1,1,1],c:t==='tree'?'#22c55e':t==='text'?'#ffffff':t==='light'?'#fde68a':W3COL[(Math.random()*9|0)+1],solid:t==='text'||t==='light'?0:1};
  if(t==='text'){ o.txt=L('かんばん','Sign'); o.p[1]=1.8; } if(t==='stairs'){ o.p[1]=.5; o.s=[1.5,2,2]; }
  if(W3.data.objs.length>=500){ toastW(L('物は500個までです','Max 500 objects')); return; }

function mk(o){ if(!o) return null; if(o._api) return o._api; const id=o.id; const api={ id, get name(){ return o.name||''; }, get type(){ return o.t; },
  get pos(){ return o.p.slice(); }, get rot(){ return o.r.slice(); }, get scale(){ return o.s.slice(); }, get color(){ return o.c; },
  setPos(x,y,z){ o.p=[r3(+x||0),r3(+y||0),r3(+z||0)]; post({op:'set',id,p:o.p}); return api; },
  move(x,y,z){ return api.setPos(o.p[0]+(+x||0),o.p[1]+(+y||0),o.p[2]+(+z||0)); },
  setRot(x,y,z){ o.r=[+x||0,+y||0,+z||0]; post({op:'set',id,r:o.r}); return api; },
  rotate(x,y,z){ return api.setRot(o.r[0]+(+x||0),o.r[1]+(+y||0),o.r[2]+(+z||0)); },
  setScale(x,y,z){ if(y===undefined){ y=x; z=x; } o.s=[+x||1,+y||1,+z||1]; post({op:'set',id,s:o.s}); return api; },
  setColor(c){ o.c=String(c); post({op:'set',id,c:o.c}); return api; },
  setText(t){ o.txt=String(t).slice(0,40); post({op:'set',id,txt:o.txt}); return api; },
  setGravity(on){ post({op:'set',id,phys:on?1:0}); return api; }, jump(v=6){ post({op:'set',id,vy:+v||6}); return api; },
  show(){ post({op:'set',id,hide:0}); return api; }, hide(){ post({op:'set',id,hide:1}); return api; },
  onClick(f){ H.click.push([id,f]); return api; }, onTouch(f){ H.touch.push([id,f]); post({op:'touchable',id}); return api; } };
  o._api=api; return api; }
const world={ time:0, player:{pos:[0,0,0],name:''},
  get(n){ const o=objs[n]||Object.values(objs).find(x=>x.name===n); return mk(o); },
  all(){ return Object.values(objs).map(mk); },
  on(ev,f){ if(H[ev]) H[ev].push([null,f]); if(ev==='touch') Object.keys(objs).forEach(id=>post({op:'touchable',id})); },
  say(t){ post({op:'say',t:String(t).slice(0,60)}); }, teleport(x,y,z){ post({op:'tp',p:[+x||0,+y||0,+z||0]}); },
  sound(freq=660,dur=.15){ post({op:'snd',f:+freq,d:+dur}); }, setSky(c){ post({op:'sky',c:String(c)}); }, setGravity(g){ post({op:'grav',g:+g}); },
  random(a=0,b=1){ return a+Math.random()*(b-a); }, log(...a){ post({op:'log',t:a.map(String).join(' ').slice(0,200)}); } };

addEventListener('message',e=>{ const d=e.data; if(!d||!d.__w3) return;

  else if(d.ev==='click'||d.ev==='touch'){ H[d.ev].forEach(h=>{ if(h[0]===null||h[0]===d.id) call(h[1],world.get(d.id)); }); }

function w3ScriptStart(){ const d=W3.data; const scripts=[]; if(d.script) scripts.push({id:null,code:d.script}); for(const o of d.objs) if(o.script) scripts.push({id:o.id,code:o.script});

  const onMsg=m=>{ if(!m||!m.__w3||!W3.on) return; w3ScriptOp(m); };
  const init={__w3:1,ev:'init',objs,scripts,me:W3.me.name};
  const useFrame=()=>{ // 予備：箱（sandbox）の中で動かす
    const f=document.createElement('iframe'); f.setAttribute('sandbox','allow-scripts'); f.style.display='none'; f.srcdoc='<script>'+W3RUNTIME+'<\/script>'; document.body.appendChild(f);

    const sc={post:m=>f.contentWindow&&f.contentWindow.postMessage(m,'*'),kill:()=>{ removeEventListener('message',lis); f.remove(); },pending:0,lastAck:performance.now(),acc:0};

function w3ScriptTick(dt){ const sc=W3.script; if(!sc) return; sc.acc+=dt; if(sc.acc<1/30) return;

  if(m.op==='tp'){ const p=m.p.map(Number); if(p.every(isFinite)){ W3.pos.set(p[0],p[1],p[2]); W3.vel.set(0,0,0); } return; }

   <div class="w3sub">${L('れい（押すと入ります）','Examples')}</div><div class="w3row w3ex"></div>
   <details class="w3help"><summary>${L('使える命令','Reference')}</summary><pre>self.setPos(x,y,z) / self.move(x,y,z)
self.setRot(x,y,z) / self.rotate(x,y,z)   ${L('（度）','(degrees)')}
self.setScale(s) / self.setColor('#ff0000')
self.setText('…') / self.show() / self.hide()
self.onClick(f) / self.onTouch(f)
self.pos / self.rot / self.scale / self.name
world.get('${L('名前','name')}') / world.all()
world.on('tick', dt=>…) / world.on('chat',(name,text)=>…)
world.say('…') / world.sound(880, 0.2)
world.teleport(x,y,z) / world.setSky('#000000') / world.setGravity(0.5)
self.setGravity(true) / self.jump(6)
world.player.pos / world.time / world.random(a,b) / world.log(…)</pre></details>
   <div class="w3row"><button class="w3pb pri w3ok">${IC('check')}${L('保存して動かす','Save & run')}</button><button class="w3pb w3clr">${IC('trash-2')}${L('コードをけす','Clear')}</button></div>`;
  const ta=box.querySelector('.w3ta'); ta.value=(o?o.script:W3.data.script)||''; ta.onkeydown=e=>{ e.stopPropagation(); if(e.key==='Tab'){ e.preventDefault(); const s=ta.selectionStart; ta.setRangeText('  ',s,ta.selectionEnd,'end'); } };
  const ex=box.querySelector('.w3ex'); for(const [n,c] of W3EX){ const b=h('button','w3pb',esc(n)); b.onclick=()=>{ ta.value=(ta.value?ta.value+'\n\n':'')+(o?c:c.replace(/self\./g,"world.get('"+L('名前','name')+"').")); }; ex.appendChild(b); }
  box.querySelector('.w3x').onclick=()=>box.remove();
  box.querySelector('.w3clr').onclick=()=>{ ta.value=''; };
  box.querySelector('.w3ok').onclick=()=>{ const code=ta.value.slice(0,20000); if(o) o.script=code; else W3.data.script=code; W3.dirty=true; box.remove(); w3ScriptStop(); w3ScriptStart(); w3Panel(); toastW(L('コードを動かしました','Code is running')); };
}

/* ---- みんなで（位置の共有） ---- */
// Realtime Database（速い）→ だめなら Firestore（ゆっくり）
async function w3NetStart(){ W3.net=null; if(!W3.remote||!FB.user) return; const uid=FB.user.uid;
  try{ const db=await import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-database.js`); const app=FB.m.getApp('homexr'); const rdb=db.getDatabase(app,FB_CONFIG.databaseURL);
    const me=db.ref(rdb,`xr_live/${W3.wid}/${uid}`); await db.set(me,w3State()); db.onDisconnect(me).remove();
    const unsub=db.onValue(db.ref(rdb,`xr_live/${W3.wid}`),s=>w3Players(s.val()||{}));
    W3.net={kind:'rtdb',send:st=>db.set(me,st).catch(()=>{}),stop:()=>{ unsub(); db.remove(me).catch(()=>{}); },rate:120};
  }catch(e){ console.warn('rtdb',e);
    try{ const m=FB.m; const me=m.doc(FB.db,'xr_worlds',W3.wid,'players',uid); await m.setDoc(me,w3State());
      const unsub=m.onSnapshot(m.collection(FB.db,'xr_worlds',W3.wid,'players'),qs=>{ const o={}; qs.forEach(d=>o[d.id]=d.data()); w3Players(o); });
      W3.net={kind:'fs',send:st=>m.setDoc(me,st).catch(()=>{}),stop:()=>{ unsub(); m.deleteDoc(me).catch(()=>{}); },rate:900};
    }catch(e2){ console.warn('fs',e2); w3Hint(L('みんなとつながれませんでした（ひとりで遊べます）','Could not connect to others')); } }
  if(W3.net) w3Log('●',L(`みんなとつながりました（${W3.net.kind==='rtdb'?'速い':'ふつう'}モード）`,`Connected (${W3.net.kind})`));
}
function w3NetStop(){ if(W3.net){ try{ W3.net.stop(); }catch(e){} W3.net=null; } for(const p of W3.players.values()) W3.scene&&W3.scene.remove(p.av.g); W3.players.clear(); }
function w3State(){ const p=W3.pos; return {n:(FB.profile&&FB.profile.name||'?').slice(0,20),c:okCol(FB.profile&&FB.profile.color||'#5aa8ff'),p:[+p.x.toFixed(2),+p.y.toFixed(2),+p.z.toFixed(2)],ry:+W3.yaw.toFixed(2),say:W3.mySay?W3.mySay.t:'',sayAt:W3.mySay?W3.mySay.at:0,t:Date.now()}; }
function w3NetSend(force){ const n=W3.net; if(!n) return; const now=performance.now(); const st=w3State(); const key=st.p.join(',')+st.ry+st.sayAt;
  if(!force&&(now-(W3.sentAt||0)<n.rate||(key===W3.sentKey&&now-(W3.sentAt||0)<5000))) return; W3.sentAt=now; W3.sentKey=key; n.send(st); }
function w3Players(all){ const T=W3.T; const me=FB.user&&FB.user.uid; const seen=new Set();
  for(const [uid,s] of Object.entries(all)){ if(uid===me||!s||!Array.isArray(s.p)) continue; if(Date.now()-(s.t||0)>60000) continue; seen.add(uid);
    let pl=W3.players.get(uid); if(!pl){ const av=w3Avatar(String(s.n||'?').slice(0,20),okCol(s.c)); av.g.position.set(...s.p); W3.scene.add(av.g); pl={av,tp:new T.Vector3(...s.p),ty:0,sayAt:0}; W3.players.set(uid,pl); w3Log('●',L(`${pl.av.name}さんが来ました`,`${pl.av.name} joined`)); AU.tone(880,.08,'sine',.06); }
    pl.tp.set(...s.p.map(Number)); pl.ty=+s.ry||0;
    if(s.sayAt&&s.sayAt!==pl.sayAt){ pl.sayAt=s.sayAt; if(Date.now()-s.sayAt<15000&&s.say){ w3Say(pl.av,String(s.say).slice(0,60)); w3Log(pl.av.name,String(s.say).slice(0,60)); w3ScriptEvent({ev:'chat',name:pl.av.name,text:String(s.say).slice(0,60)}); } } }
  for(const [uid,pl] of W3.players){ if(!seen.has(uid)){ W3.scene.remove(pl.av.g); W3.players.delete(uid); w3Log('●',L(`${pl.av.name}さんが出ました`,`${pl.av.name} left`)); } }
  const t=W3.ov&&W3.ov.querySelector('.w3title .sub'); if(t) t.textContent=W3.net?L(`${W3.players.size+1}人`,`${W3.players.size+1} here`):''; }

/* ---- 公開 ---- */
async function w3Upload(id,d){ await fbInit(); if(!FB.user) throw new Error('login'); const m=FB.m; const json=JSON.stringify({...d,published:undefined});
  if(json.length>900000) throw new Error(L('ワールドが大きすぎます','World too large'));
  await m.setDoc(m.doc(FB.db,'xr_worlds',id),{owner:FB.user.uid,ownerName:(FB.profile&&FB.profile.name||'').slice(0,20),name:(d.name||'').slice(0,30),desc:(d.desc||'').slice(0,80),public:true,data:json,objCount:d.objs.length,updatedAt:Date.now()}); }

regApp('worlds',{name:'ワールド',en:'Worlds',g:'globe',bg:'linear-gradient(160deg,#34d399,#0ea5e9 55%,#6366f1)',cat:'xr',w:980,h:660,pin:1,
  desc:'自分だけの3Dワールドをつくって、歩いたり、友だちを呼んでいっしょに遊んだりできます。物を置く・色を変える・コードで動かすこともできます。',
  den:'Build your own 3D world, walk around, invite friends, and add code to make things move.',
  impl:(body,w)=>{
    const root=h('div','scroll pad'); body.appendChild(root); let tab='mine';
    const draw=async()=>{ root.innerHTML='';
      const hd=h('div','row'); hd.style.cssText='justify-content:space-between;margin-bottom:14px';
      const seg=h('div','seg'); for(const [k,ja,en] of [['mine','マイワールド','My worlds'],['all','みんなのワールド','Public worlds']]){ const b=h('button',tab===k?'on':'',L(ja,en)); b.onclick=()=>{ tab=k; draw(); }; seg.appendChild(b); }
      hd.append(seg); root.appendChild(hd);
      if(tab==='mine'){
        const nb=h('div','row'); nb.style.cssText='gap:10px;margin-bottom:16px;flex-wrap:wrap';
        for(const [k,ic,ja,en] of [['grass','trees','草原からつくる','Start: meadow'],['night','moon','夜のひろばからつくる','Start: night plaza'],['empty','square','からっぽからつくる','Start: empty']])
          nb.appendChild(btn(IC(ic)+L(ja,en),()=>{ const id=wid(); const d={v:1,name:L('わたしのワールド','My world'),desc:'',...W3TPL[k](),script:'',createdAt:Date.now()}; const m=MYW(); m[id]=d; if(saveMYW(m)){ draw(); w3Open(id,{mine:true}).then(()=>setTimeout(()=>W3.on&&w3SetEdit(true),300)); } },k==='grass'?'pri':''));
        root.appendChild(nb);
        const m=MYW(); const ids=Object.keys(m).sort((a,b)=>(m[b].updatedAt||m[b].createdAt||0)-(m[a].updatedAt||m[a].createdAt||0));
        if(!ids.length) root.appendChild(h('p','sub',L('まだワールドがありません。上のボタンでつくってみよう！','No worlds yet. Create one above!')));
        for(const id of ids){ const d=m[id]; const c=h('div','card w3card');
          c.innerHTML=`<div class="w3thumb" style="background:linear-gradient(${okCol(d.sky)},${okCol(d.ground==='none'?d.sky:d.ground)})">${svg('globe')}</div><div style="flex:1;min-width:0"><b>${esc(d.name||'')}</b><div class="sub">${L('物','Objects')} ${d.objs.length}${d.published?' ・ '+L('公開中','Public'):''}</div></div>`;
          const r=h('div','row'); r.style.cssText='gap:8px;flex-wrap:nowrap';
          r.append(btn(IC('play')+L('入る','Enter'),()=>w3Open(id,{mine:true,remote:!!d.published}),'pri'),btn(IC('square-pen')+L('つくる','Edit'),()=>w3Open(id,{mine:true,remote:!!d.published}).then(()=>setTimeout(()=>W3.on&&w3SetEdit(true),300))));
          r.appendChild(btn(d.published?IC('lock')+L('非公開にする','Unpublish'):IC('share-2')+L('公開する','Publish'),async()=>{
            try{ await fbInit(); }catch(e){ toastW(fbErr(e)); return; } if(!FB.user){ toastW(L('公開するにはログインしてね（チャットアプリからログインできます）','Sign in to publish (via Chat)')); return; }
            try{ if(d.published){ await FB.m.updateDoc(FB.m.doc(FB.db,'xr_worlds',id),{public:false}); d.published=false; } else { await w3Upload(id,d); d.published=true; } m[id]=d; saveMYW(m); toastW(d.published?L('公開しました！みんなのワールドに出ます','Published!'):L('非公開にしました','Unpublished')); draw(); }catch(e){ toastW(L('できませんでした：','Failed: ')+(e.message||fbErr(e))); } }));
          r.appendChild(btn(IC('trash-2'),()=>{ if(c.dataset.ask){ delete m[id]; saveMYW(m); if(d.published&&FB.user) FB.m.deleteDoc(FB.m.doc(FB.db,'xr_worlds',id)).catch(()=>{}); draw(); } else { c.dataset.ask=1; toastW(L('もう一度押すと削除します','Tap again to delete')); setTimeout(()=>delete c.dataset.ask,3000); } }));
          c.appendChild(r); root.appendChild(c); }
        root.appendChild(h('p','sub',L('ワールドはこの端末に保存されます。「公開する」と、みんなのワールドに出て、ほかの人も入れるようになります（ログインが必要）。','Worlds are saved on this device. Publish to let others join (sign-in required).'))).style.marginTop='12px';
      } else {
        root.appendChild(h('p','sub',L('読みこみ中…','Loading…')));
        try{ await fbInit(); const m=FB.m; const qs=await m.getDocs(m.query(m.collection(FB.db,'xr_worlds'),m.where('public','==',true),m.limit(60)));
          const list=[]; qs.forEach(d=>list.push({id:d.id,...d.data()})); list.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0)); root.lastChild.remove();
          if(!list.length) root.appendChild(h('p','sub',L('まだ公開されたワールドがありません','No public worlds yet')));
          for(const x of list){ const c=h('div','card w3card'); let d={}; try{ d=JSON.parse(x.data); }catch(e){}
            c.innerHTML=`<div class="w3thumb" style="background:linear-gradient(${okCol(d.sky)},${okCol(d.ground==='none'?d.sky:d.ground)})">${svg('globe')}</div><div style="flex:1;min-width:0"><b>${esc(x.name||'')}</b><div class="sub">${esc(x.ownerName||'')}${x.desc?' ・ '+esc(x.desc):''}</div></div>`;
            const r=h('div','row'); r.style.cssText='gap:8px;flex-wrap:nowrap';
            r.append(btn(IC('log-in')+L('入る','Join'),()=>w3Open(x.id,{data:d,remote:true,mine:FB.user&&x.owner===FB.user.uid}),'pri'),btn(IC('copy')+L('コピーしてつくる','Remix'),()=>{ const id=wid(); const nd={...d,name:(d.name||'')+L('（コピー）',' (copy)'),published:false,createdAt:Date.now()}; const mm=MYW(); mm[id]=nd; if(saveMYW(mm)){ tab='mine'; draw(); toastW(L('マイワールドにコピーしました','Copied to My worlds')); } }));
            c.appendChild(r); root.appendChild(c); }
        }catch(e){ root.lastChild&&root.lastChild.remove(); root.appendChild(h('p','sub',L('読みこめませんでした：','Could not load: ')+esc(fbErr(e)))); }
      }
    }; draw(); }});
if(!INST.includes('worlds')){ INST.splice(Math.min(3,INST.length),0,'worlds'); STORE.set('inst',INST); }
renderLib();
