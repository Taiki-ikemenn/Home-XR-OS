<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1b1a19">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Home XR OS</title>
<style>
:root{
  --glass:rgba(30,30,34,.95); --glass2:rgba(52,52,58,.92); --line:rgba(255,255,255,.1);
  --tx:#f4f4f6; --tx2:rgba(244,244,246,.62); --acc:#4c8dff; --acc2:#7aa9ff; --ok:#3ecf8e; --ng:#ff6b6b;
  --font:system-ui,-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:#141312;color:var(--tx);font-family:var(--font);-webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

/* ===== 3D空間 ===== */
#pass{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;display:none}
body.passthru #pass{display:block}
#vp,.vp{position:fixed;inset:0;overflow:hidden;perspective-origin:50% 50%}
.cam{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
#dimmer{position:fixed;inset:0;background:#000;opacity:.15;pointer-events:none;transition:opacity .4s}
body.passthru #dimmer{opacity:0!important}
#env,#world{position:absolute;left:0;top:0;transform-style:preserve-3d}
body.passthru #vpE{display:none}
.strip{position:absolute;left:0;top:0;transform-origin:0 0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background-repeat:no-repeat}
.wo{position:absolute;left:0;top:0;width:max-content;transform-origin:0 0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.wo.off{visibility:hidden}

/* ===== ライブラリ ===== */
.lib{width:1080px;padding:20px 10px;display:flex;flex-direction:column;align-items:center;gap:34px;transition:opacity .25s}
.libRow{display:flex;gap:56px;justify-content:center}
.app{width:132px;display:flex;flex-direction:column;align-items:center;gap:12px;border-radius:26px;padding:8px 0;transition:transform .18s}
.app .ic{width:96px;height:96px}
.app .lb{font-size:17px;font-weight:600;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.6);white-space:nowrap;display:flex;gap:4px;align-items:center}
.app .lb i{font-style:normal;font-size:13px;opacity:.9}
.app.hov{transform:translateY(-6px) scale(1.07)}
.app.hov .ic{box-shadow:0 14px 30px rgba(0,0,0,.45),0 0 0 4px rgba(255,255,255,.85)}
.ic{border-radius:24px;display:grid;place-items:center;box-shadow:0 8px 22px rgba(0,0,0,.35);position:relative;overflow:hidden}
.ic::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(160deg,rgba(255,255,255,.28),rgba(255,255,255,0) 45%)}
.ic svg{width:56%;height:56%;position:relative;z-index:1}
.ic.big svg{width:100%;height:100%}

.clock{font-size:26px;font-weight:600;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.6);letter-spacing:.02em;white-space:nowrap}
.leftbar{display:flex;flex-direction:column;gap:30px;padding:10px}
.lbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;opacity:.8;transition:transform .15s,background .15s}
.lbtn svg{width:24px;height:24px}
.lbtn.hov{background:rgba(255,255,255,.18);opacity:1;transform:scale(1.15)}

/* ===== ドック ===== */
.dock{display:flex;align-items:center;gap:6px;background:rgba(28,28,30,.82);border-radius:40px;padding:10px 16px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.dbtn{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:#fff;transition:transform .15s,background .15s;position:relative}
.dbtn svg{width:26px;height:26px}
.dbtn.on{background:#fff;color:#222}
.dbtn.hov{background:rgba(255,255,255,.2);transform:scale(1.12)}
.dbtn.on.hov{background:#fff}
.dbtn .badge{position:absolute;top:8px;right:8px;width:10px;height:10px;border-radius:50%;background:#ff4f5e;box-shadow:0 0 0 2px rgba(28,28,30,1)}
.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#ffd1a6,#ff8fa3);display:grid;place-items:center;font-weight:800;color:#5a2a35;font-size:18px}
.sep{width:2px;height:28px;background:rgba(255,255,255,.22);border-radius:2px;margin:0 8px}

/* ===== ウィンドウ ===== */
.win{display:flex;flex-direction:column;align-items:center;gap:14px}
.winBox{background:var(--glass);border-radius:30px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.45);border:1px solid var(--line);display:flex;flex-direction:column;position:relative}
.winTitle{height:58px;flex:none;display:flex;align-items:center;gap:12px;padding:0 22px;font-weight:700;font-size:20px;border-bottom:1px solid var(--line)}
.winTitle .ic{width:34px;height:34px;border-radius:10px}
.winTitle .sp{flex:1}
.winBody{flex:1;min-height:0;position:relative;overflow:hidden}
.winBar{display:flex;align-items:center;gap:14px}
.grab{width:180px;height:14px;border-radius:10px;background:rgba(255,255,255,.55);transition:background .15s,transform .15s}
.grab.hov,.grab.drag{background:#fff;transform:scaleY(1.4)}
.wbtn{width:44px;height:44px;border-radius:50%;background:rgba(40,40,44,.85);display:grid;place-items:center;font-size:18px;color:#fff;transition:transform .15s,background .15s}
.wbtn.hov{background:rgba(255,255,255,.25);transform:scale(1.12)}
.win.theater .winBox{box-shadow:0 0 120px rgba(80,140,255,.25)}

/* 共通部品 */
.scroll{overflow:hidden;height:100%}
.pad{padding:22px}
.btn{padding:12px 20px;border-radius:999px;background:rgba(255,255,255,.12);font-weight:700;font-size:17px;transition:background .15s,transform .15s;white-space:nowrap}
.btn.pri{background:var(--acc);color:#fff}
.btn.hov{background:rgba(255,255,255,.24);transform:scale(1.04)}
.btn.pri.hov{background:var(--acc2)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.card{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:20px;padding:16px;transition:background .15s,transform .15s}
.card.hov{background:rgba(255,255,255,.12)}
h3{font-size:22px;font-weight:800;margin-bottom:12px}
.sub{color:var(--tx2);font-size:15px}
.hov-l.hov{background:rgba(255,255,255,.1)}
.slider{height:34px;display:flex;align-items:center;position:relative;cursor:pointer}
.slider .tr{position:absolute;left:0;right:0;height:8px;border-radius:8px;background:rgba(255,255,255,.18)}
.slider .fi{position:absolute;left:0;height:8px;border-radius:8px;background:#fff}
.slider .kn{position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;transform:translateX(-50%);box-shadow:0 2px 8px rgba(0,0,0,.4);transition:transform .12s}
.slider.hov .kn,.slider.drag .kn{transform:translateX(-50%) scale(1.25)}
.toggle{width:58px;height:34px;border-radius:999px;background:rgba(255,255,255,.2);position:relative;transition:background .2s;flex:none}
.toggle::after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .2s}
.toggle.on{background:var(--acc)}
.toggle.on::after{left:28px}
.toggle.hov{box-shadow:0 0 0 3px rgba(255,255,255,.35)}
.seg{display:flex;background:rgba(255,255,255,.08);border-radius:999px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{padding:10px 16px;border-radius:999px;font-weight:700;font-size:16px;color:var(--tx2)}
.seg button.on{background:#fff;color:#222}
.seg button.hov:not(.on){background:rgba(255,255,255,.14);color:#fff}
.field{background:rgba(255,255,255,.1);border-radius:16px;padding:12px 16px;font-size:18px;min-height:48px;display:flex;align-items:center;gap:8px;border:2px solid transparent}
.field.focus{border-color:var(--acc)}
.field .ph{color:var(--tx2)}
.field .caret{width:2px;height:22px;background:#fff;animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}

/* 小さなパネル（クイック設定・通知など） */
.mini{width:520px;background:var(--glass);border-radius:28px;padding:22px;border:1px solid var(--line);box-shadow:0 24px 60px rgba(0,0,0,.45)}
.mini h4{font-size:20px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.mini h4 .sp{flex:1}
.qrow{display:flex;align-items:center;gap:14px;padding:10px 0}
.qrow .lb{flex:1;font-weight:700;font-size:17px}
.noti{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:16px}
.noti .ic{width:40px;height:40px;border-radius:12px;flex:none}
.noti b{display:block;font-size:16px}.noti span{font-size:14px;color:var(--tx2)}

/* キーボード */
.kb{background:rgba(24,24,28,.94);border-radius:26px;padding:16px;display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);box-shadow:0 24px 60px rgba(0,0,0,.5)}
.kbr{display:flex;gap:8px;justify-content:center}
.key{min-width:56px;height:56px;padding:0 10px;border-radius:14px;background:rgba(255,255,255,.12);font-size:22px;font-weight:600;display:grid;place-items:center;transition:background .1s,transform .1s}
.key.hov{background:rgba(255,255,255,.28);transform:scale(1.08)}
.key.w{min-width:120px;font-size:17px}.key.xw{min-width:300px;font-size:17px}
.key.pri{background:var(--acc)}

.tgt.boom{opacity:0!important;filter:brightness(2.5)}
.toastW{background:rgba(30,30,34,.94);border-radius:999px;padding:14px 24px;font-size:18px;font-weight:700;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.4);transition:opacity .3s}

/* ===== 画面上の操作 ===== */
#input{position:fixed;inset:0;z-index:5;touch-action:none}
#hud{position:fixed;inset:0;width:100%;height:100%;z-index:6;pointer-events:none}
#pads{position:fixed;inset:0;z-index:7;pointer-events:none}
body.nopad #pads{display:none}
.stick{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 26px);width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.25);pointer-events:auto;touch-action:none;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.stick .nub{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:0 4px 14px rgba(0,0,0,.35)}
.stick small{position:absolute;left:0;right:0;top:-24px;text-align:center;font-size:12px;font-weight:700;color:rgba(255,255,255,.75);text-shadow:0 1px 4px rgba(0,0,0,.8)}
#stickL{left:calc(env(safe-area-inset-left) + 26px)}
#stickR{right:calc(env(safe-area-inset-right) + 26px)}
.pbtn{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.3);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);text-shadow:0 1px 4px rgba(0,0,0,.6)}
#pinchBtn{right:calc(env(safe-area-inset-right) + 196px);bottom:calc(env(safe-area-inset-bottom) + 40px);width:110px;height:110px;font-size:17px}
#pinchBtn.on{background:rgba(76,141,255,.75);border-color:#fff}
#homeBtn2{right:calc(env(safe-area-inset-right) + 206px);bottom:calc(env(safe-area-inset-bottom) + 164px);width:62px;height:62px;font-size:13px}
#backBtn2{left:calc(env(safe-area-inset-left) + 196px);bottom:calc(env(safe-area-inset-bottom) + 40px);width:62px;height:62px;font-size:13px}
#centerBtn2{left:calc(env(safe-area-inset-left) + 196px);bottom:calc(env(safe-area-inset-bottom) + 112px);width:62px;height:62px;font-size:12px}

@media (max-width:600px){
  .stick{width:112px;height:112px;bottom:calc(env(safe-area-inset-bottom) + 18px)}
  .stick .nub{width:48px;height:48px;margin:-24px 0 0 -24px}
  #stickL{left:14px}#stickR{right:14px}
  #pinchBtn{width:84px;height:84px;right:22px;bottom:calc(env(safe-area-inset-bottom) + 150px);font-size:14px}
  #homeBtn2{right:120px;bottom:calc(env(safe-area-inset-bottom) + 30px);width:50px;height:50px;font-size:11px}
  #backBtn2{left:136px;bottom:calc(env(safe-area-inset-bottom) + 30px);width:50px;height:50px;font-size:11px}
  #centerBtn2{left:136px;bottom:calc(env(safe-area-inset-bottom) + 90px);width:50px;height:50px;font-size:10px}
}
#handCam{position:fixed;left:14px;top:14px;width:160px;border-radius:14px;transform:scaleX(-1);z-index:8;opacity:.8;display:none;border:2px solid rgba(255,255,255,.4)}
body.hands #handCam{display:block}
#directView{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;background:#111;color:#fff}
#directView .dvBar{display:flex;gap:8px;align-items:center;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));background:#1c1c22}
#directView .dvBtn{background:#2e2e38;border-radius:12px;padding:10px 14px;font-size:16px;white-space:nowrap}
#directView .dvUrl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:#000;border-radius:12px;padding:10px 14px;font-size:15px;opacity:.85}
#directView iframe{flex:1;border:0;width:100%;background:#fff}
#directView .dvTip{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(0,0,0,.8);padding:10px 16px;border-radius:12px;font-size:14px;max-width:90%;text-align:center;pointer-events:none}
body.direct #pads,body.direct #hud{display:none}
#handDbg{position:fixed;z-index:9;pointer-events:none;display:none}
body.hands #handDbg{display:block}
#handCam{transition:width .2s}
#handCam.big{width:min(420px,60vw)}
body.framehole #world iframe{pointer-events:auto}
.fsI{font-size:26px;line-height:1;font-weight:700}
.ico{display:inline-flex;width:1.15em;height:1.15em;vertical-align:-.2em;margin-right:.4em;flex:none}
.ico:last-child{margin-right:0}
.ico svg{width:100%;height:100%}
.ico.fillI svg{fill:currentColor}
.ico.pinI{width:.85em;height:.85em;margin-right:.25em;opacity:.85}
.icb{width:58px;height:58px;margin:0}
.icb svg{fill:currentColor;fill-opacity:.3}
.bigIco{display:inline-flex;width:56px;height:56px;margin:0 auto 6px}
.bigIco svg{width:100%;height:100%}
.bigIco.sm{width:36px;height:36px;margin:0}
.bigIco.xl{width:110px;height:110px}
.wsvg svg{width:100%;height:100%}
.widget{width:320px;padding:12px 16px 16px;border-radius:26px;background:rgba(28,28,34,.74);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.14);color:#fff;display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.wgHead{order:-1;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.wgHead .grab{width:70px;height:10px;flex:none}
.wgLab{font-size:14px;opacity:.7;flex:1;font-weight:700}
.wgX{width:34px;height:34px;opacity:.7}
.wgBig{font-size:60px;font-weight:800;letter-spacing:-1px;line-height:1.1;font-variant-numeric:tabular-nums}
.wgCalT{font-weight:800;margin-bottom:8px;font-size:18px}
.wgCalG{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:15px}
.wgCalG b{font-size:12px;opacity:.6}
.wgCalG span{line-height:30px;border-radius:50%}
.wgCalG .sun{color:#f87171}.wgCalG .sat{color:#60a5fa}
.wgCalG span.today{background:var(--acc);color:#fff;font-weight:800}
.wgMemo{background:var(--wc);color:#1f2937;border-color:rgba(0,0,0,.08)}
.wgMemo .grab{background:rgba(0,0,0,.25)}
.wgMemo .wgX{color:#1f2937}
.wgMemoF{width:100%;min-height:120px;background:rgba(255,255,255,.35)!important;color:#1f2937!important;font-size:20px;text-align:left;align-items:flex-start;justify-content:flex-start;white-space:pre-wrap}
.wgDot{width:26px;height:26px;border-radius:50%;border:2px solid rgba(0,0,0,.2);padding:0}
.wgPhoto{width:380px}
.wgImg img{width:100%;border-radius:16px;display:block}
.wgPick{margin-top:10px;font-size:14px}
.wgAddB{text-align:center}
.envGrid{display:grid!important;grid-template-columns:repeat(5,1fr);gap:4px;border-radius:18px}
.envGrid button{border-radius:12px;font-size:14px;padding-left:4px;padding-right:4px;white-space:nowrap}
.tgAv{display:flex;flex-direction:column;align-items:center;gap:10px;transition:opacity .5s}
.tgAv.away{opacity:.35}
.tgHead{width:130px;height:130px;border-radius:50%;background:var(--c);position:relative;box-shadow:0 14px 40px rgba(0,0,0,.4),inset 0 -10px 0 rgba(0,0,0,.12);border:4px solid rgba(255,255,255,.85)}
.tgEye{position:absolute;left:50%;top:32%;width:18px;height:22px;margin-left:-30px;border-radius:50%;background:#fff;box-shadow:42px 0 0 #fff;transition:transform .6s}
.tgFace{position:absolute;bottom:16px;width:100%;text-align:center;font-size:30px;font-weight:800;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.3)}
.tgName{background:rgba(20,20,26,.8);padding:6px 14px;border-radius:12px;font-weight:700;font-size:20px}
.tgBub{opacity:0;transform:translateY(8px);background:#fff;color:#111;padding:10px 16px;border-radius:18px;font-weight:800;font-size:22px;transition:opacity .3s,transform .3s;white-space:nowrap;max-width:420px;overflow:hidden;text-overflow:ellipsis}
.tgBub.on{opacity:1;transform:none}
.tgCode{font-size:18px}.tgCode b{letter-spacing:3px;font-size:22px;margin-left:4px}
.qScroll{max-height:min(500px,58vh);overflow:hidden;overflow-y:auto;scrollbar-width:none}
.favI{width:62%;height:62%;object-fit:contain;border-radius:18%}
.libFoot{justify-content:center;gap:14px;margin-top:18px;align-items:center}
.libEditB{display:inline-flex;align-items:center;padding:10px 18px;border-radius:999px;background:rgba(255,255,255,.14);font-weight:700;font-size:16px;color:#fff}
.libHint{text-align:center;font-size:15px;opacity:.85;margin-top:10px;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.app.editing .ic{animation:jig .3s ease-in-out infinite alternate}
.app.editing:nth-child(2n) .ic{animation-delay:-.15s}
@keyframes jig{from{transform:rotate(-2.2deg)}to{transform:rotate(2.2deg)}}
.app.dragSrc{opacity:.35}
.app.dropT .ic{box-shadow:0 0 0 5px #4f8cff,0 14px 30px rgba(0,0,0,.45);transform:scale(1.08)}
.app.fold.dropT .ic{box-shadow:0 0 0 6px #34d399,0 14px 30px rgba(0,0,0,.45);transform:scale(1.15)}
.folderIc{background:rgba(255,255,255,.22)!important;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:grid!important;grid-template-columns:1fr 1fr;gap:7px;padding:11px;place-items:stretch!important}
.folderIc .mini4{width:auto!important;height:auto!important;border-radius:9px;box-shadow:none;aspect-ratio:1}
.folderIc .mini4 svg{width:62%;height:62%}
.folderIc .mini4 span{font-size:17px!important}
.folderIc .mini4.empty{background:rgba(255,255,255,.1)}
.folderView{width:780px;padding:26px 30px;border-radius:34px;background:rgba(30,30,36,.84);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.14);box-shadow:0 30px 80px rgba(0,0,0,.5);color:#fff}
.folderName{font-size:28px;font-weight:800;display:inline-flex;align-items:center;gap:8px}
.folderGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 10px;justify-items:center}
.libOut{margin-top:20px;padding:18px;border:2px dashed rgba(255,255,255,.35);border-radius:20px;text-align:center;font-weight:700;opacity:.85}
.libOut.dropT{border-color:#4f8cff;background:rgba(79,140,255,.15)}
.libSheet .sheetCol{display:flex;flex-direction:column;gap:10px;align-items:stretch}
.aiLog{padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-height:0}
.aiMsg{max-width:80%;padding:12px 16px;border-radius:20px;font-size:18px;line-height:1.6;background:rgba(255,255,255,.1);align-self:flex-start;word-break:break-word}
.aiMsg.me{align-self:flex-end;background:var(--acc);color:#fff;border-bottom-right-radius:6px}
.aiMsg.ai{border-bottom-left-radius:6px}
.aiAct{margin-top:8px;padding:8px 12px;border-radius:12px;background:rgba(0,0,0,.25);font-size:15px}
.aiW{display:flex;gap:10px;align-items:center}
.aiDots i{display:inline-block;width:9px;height:9px;margin:0 3px;border-radius:50%;background:#fff;opacity:.3;animation:aid 1s infinite}
.aiDots i:nth-child(2){animation-delay:.15s}.aiDots i:nth-child(3){animation-delay:.3s}
@keyframes aid{50%{opacity:1;transform:translateY(-3px)}}
.aiHello{margin:auto;text-align:center;padding:30px}

<script>
'use strict';
const APP_VERSION='3.6.1';
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, rad=d=>d*Math.PI/180, deg=r=>r*180/Math.PI;
const angDiff=(a,b)=>{const d=a-b; if(!isFinite(d)) return 0; return ((d%360)+540)%360-180;};
const STORE={get(k,d){try{const v=localStorage.getItem('xr_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('xr_'+k,JSON.stringify(v))}catch(e){}}};
const DEFCFG={env:'living',dim:.15,cur:1,look:1,pad:true,hand:true,vol:.6,gyro:false,sound:true};
let CFG={...DEFCFG,...STORE.get('cfg',{})};
const saveCfg=()=>STORE.set('cfg',CFG);
const h=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ================= 視点と空間 ================= */
const S={yaw:0,pitch:0,vyaw:0,vpitch:0,P:900,DB:1200,W:0,H:0,cx:0,cy:0,pinch:false,t:0,dt:0,lookT:0};
const vp=$('vp'), cam=$('cam'), envEl=$('env'), world=$('world'), vpE=$('vpE'), camE=$('camE');
function resize(){
  S.W=innerWidth; S.H=innerHeight;
  S.P=Math.round(Math.max(S.W,S.H)*.6);
  // 1000px のパネルが画面のおよそ72%に見える距離
  S.DB=S.P*1000/(.72*Math.min(S.W,S.H*1.55));
  vp.style.perspective=vpE.style.perspective=S.P+'px'; for(const v of document.querySelectorAll('.vp.layer')) v.style.perspective=S.P+'px';
  if(!S.cx){S.cx=S.W/2;S.cy=S.H/2}
  S.cx=clamp(S.cx,0,S.W); S.cy=clamp(S.cy,0,S.H);
  hud.width=Math.round(S.W*DPR()); hud.height=Math.round(S.H*DPR());
  buildEnv(); WOS.forEach(o=>o.place());
}
const DPR=()=>Math.min(2,window.devicePixelRatio||1);
function applyCam(){
  cam.style.transform=camE.style.transform=`translateZ(${S.P}px) rotateX(${S.pitch}deg) rotateY(${S.yaw}deg)`; for(const c of LAYERCAMS) c.style.transform=cam.style.transform;
  // うしろのものは描かない
  const lim=deg(Math.atan(S.W/2/S.P))+24; for(const s of STRIPS){ const off=Math.abs(angDiff(s.a,S.yaw))>lim; if(off!==s.off){s.off=s.off=off; for(const e of s.el) e.style.visibility=off?'hidden':'visible'} }
  for(const o of WOS){ const off=!o.shown||Math.abs(angDiff(o.yaw,S.yaw))>lim+10; if(off!==o.off){o.off=off; o.el.classList.toggle('off',off)} }
}
/* 空間に浮かぶもの */
const WOS=[]; const LAYERCAMS=[...document.querySelectorAll('.vp.layer .cam')];
class WO{
  constructor(el,{yaw=0,y=0,d=1,s=1,shown=true}={}){
    this.el=el; el.classList.add('wo'); this.yaw=yaw; this.y=y; this.d=d; this.s=s; this.shown=shown; this.off=null;
    world.appendChild(el); WOS.push(this); this.place();
  }
  place(){ this.el.style.transform=`rotateY(${-this.yaw}deg) translateZ(${-this.d*S.DB}px) translateY(${this.y}px) scale(${this.s}) translate(-50%,-50%)`; }
  show(v=true){ this.shown=v; this.off=null; applyCam(); }
  remove(){ const i=WOS.indexOf(this); if(i>=0)WOS.splice(i,1); this.el.remove(); }
}
// パネルの幅（px）を角度にする
const pxToDeg=(px,d=1)=>deg(Math.atan(px/(d*S.DB)));

/* ================= 背景（パノラマ） ================= */
let STRIPS=[], PANO={tiles:null,env:null}; const ENVPAINT={};
const NSTRIP=48, NROW=4, VANG=52;
function buildEnv(){
  envEl.innerHTML=''; STRIPS=[];
  const R=S.DB*2.6, circ=TAU*R, sw=circ/NSTRIP, Hh=2*R*Math.tan(rad(VANG)), rh=Hh/NROW;
  if(PANO.env!==CFG.env||!PANO.tiles) paintPano();
  for(let i=0;i<NSTRIP;i++){
    const th=-180+(i+.5)*360/NSTRIP; const col=[];
    for(let k=0;k<NROW;k++){
      const el=PANO.tiles[i][k]; el.className='strip';
      const tw=PANO.tw, tht=PANO.th, sx=sw/tw, sy=rh/tht;
      el.style.width=el.width+'px'; el.style.height=el.height+'px';
      el.style.transform=`rotateY(${-th}deg) translateZ(${-R}px) translateY(${-Hh/2+k*rh-sy}px) translateX(${-sw/2-sx}px) scale(${sx*1.004},${sy*1.004})`;
      envEl.appendChild(el); col.push(el);
    }
    STRIPS.push({el:col,a:th,off:null});
  }
  setDim(CFG.dim,true); applyCam();
}
async function openCam(facing,extra={}){
  const md=navigator.mediaDevices; if(!md||!md.getUserMedia) throw new Error('no camera');
  try{ return await md.getUserMedia({video:{facingMode:{exact:facing},...extra},audio:false}); }
  catch(e){ if(e&&e.name==='NotAllowedError') throw e; }
  // exact で開けないとき：カメラの名前から探す
  try{ const devs=(await md.enumerateDevices()).filter(d=>d.kind==='videoinput'); const re=facing==='environment'?/back|rear|environment|背面|後/i:/front|user|前面|前/i; const d=devs.find(x=>re.test(x.label)); if(d) return await md.getUserMedia({video:{deviceId:{exact:d.deviceId},...extra},audio:false}); }catch(e){}
  return await md.getUserMedia({video:{facingMode:facing,...extra},audio:false});
}
function setDim(v,temp){ if(!temp) CFG.dim=v; $('dimmer').style.opacity=v; }
const TAU=Math.PI*2;
function rnd(seed){ let s=seed>>>0||1; return ()=>((s=Math.imul(s^s>>>15,1|s)+0x6D2B79F5|0,(s^s>>>7)>>>0)%100000)/100000; }
function paintPano(){
  const W=4096, H=Math.round(4096*(2*Math.tan(rad(VANG)))/TAU), K=2;
  const c=document.createElement('canvas'); c.width=W*K; c.height=H*K; const g=c.getContext('2d'); g.scale(K,K);
  const X=a=>(a+180)/360*W; // 角度→x
  const Xl=a=>(a*.62+180)/360*W;
  const pf=ENVPAINT[CFG.env]; if(pf) pf(g,W,H,X); else if(CFG.env==='space') paintSpace(g,W,H,X); else if(CFG.env==='beach') paintBeach(g,W,H,X); else paintLiving(g,W,H,Xl);
  const c2=document.createElement('canvas'); c2.width=W*K; c2.height=H*K; const g2=c2.getContext('2d');
  g2.filter=CFG.env==='photo'?'none':'blur(4px)'; g2.drawImage(c,0,0); g2.filter='none';
  // 小さなタイルに分ける（大きすぎる画像は描けない端末があるため）
  const tw=W*K/NSTRIP, th=H*K/NROW; PANO.tiles=[]; PANO.tw=tw; PANO.th=th;
  for(let i=0;i<NSTRIP;i++){ const col=[]; for(let k=0;k<NROW;k++){ const t=document.createElement('canvas'); t.width=Math.ceil(tw)+2; t.height=Math.ceil(th)+2; t.getContext('2d').drawImage(c2,i*tw-1,k*th-1,t.width,t.height,0,0,t.width,t.height); col.push(t); } PANO.tiles.push(col); }
  PANO.env=CFG.env;
}
function wrapDraw(g,W,fn){ fn(0); fn(-W); fn(W); }
function paintLiving(g,W,H,X){
  const r=rnd(7), hz=H*.5, fl=H*.6;
  // 壁
  let gr=g.createLinearGradient(0,0,0,fl); gr.addColorStop(0,'#2a2826'); gr.addColorStop(.35,'#3d3a37'); gr.addColorStop(1,'#4a4642'); g.fillStyle=gr; g.fillRect(0,0,W,fl);
  // 天井の影
  gr=g.createLinearGradient(0,0,0,H*.2); gr.addColorStop(0,'rgba(10,10,10,.55)'); gr.addColorStop(1,'rgba(10,10,10,0)'); g.fillStyle=gr; g.fillRect(0,0,W,H*.2);
  // 壁のパネル目地
  g.strokeStyle='rgba(0,0,0,.18)'; g.lineWidth=3; for(let i=0;i<36;i++){const x=i*W/36+20; g.beginPath(); g.moveTo(x,H*.08); g.lineTo(x,fl); g.stroke()}
  // 床（じゅうたん）
  gr=g.createLinearGradient(0,fl,0,H); gr.addColorStop(0,'#55504b'); gr.addColorStop(.3,'#6a645d'); gr.addColorStop(1,'#7c766e'); g.fillStyle=gr; g.fillRect(0,fl,W,H-fl);
  for(let i=0;i<9000;i++){ g.fillStyle=`rgba(${r()<.5?255:0},${r()<.5?255:0},${r()<.5?255:0},.035)`; g.fillRect(r()*W,fl+r()*(H-fl),3,2); }

function onGyro(e){
  if(!GY||e.alpha==null||e.beta==null||!isFinite(e.alpha)||!isFinite(e.beta)) return;
  const a=rad(e.alpha),b=rad(e.beta),g=rad(isFinite(e.gamma)?e.gamma:0); const ca=Math.cos(a),sa=Math.sin(a),cb=Math.cos(b),sb=Math.sin(b),cg=Math.cos(g),sg=Math.sin(g);

  if(!GY.ref){ GY.ref={yaw,pitch}; GY.base={yaw:S.yaw,pitch:S.pitch}; }

function pollInput(dt){
  // ゲームパッド
  const gps=navigator.getGamepads?navigator.getGamepads():[]; let gp=null; for(const g of gps) if(g){gp=g;break}
  let lx=IN.L.x, ly=IN.L.y, rx=IN.R.x, ry=IN.R.y;
  const k=c=>IN.keys.has(c)?1:0;
  lx+=k('KeyD')-k('KeyA'); ly+=k('KeyS')-k('KeyW'); rx+=k('ArrowRight')-k('ArrowLeft'); ry+=k('ArrowDown')-k('ArrowUp');
  if(gp){ const dz=v=>Math.abs(v)<.15?0:v; lx+=dz(gp.axes[0]||0); ly+=dz(gp.axes[1]||0); rx+=dz(gp.axes[2]||0); ry+=dz(gp.axes[3]||0);
    const b=i=>gp.buttons[i]&&gp.buttons[i].pressed, was=i=>IN.gpPrev[i];
    const pin=b(0)||b(7)||b(5);
    if(pin&&!IN.gpPin){ AU.init(); IN.mouse=false; pinchDown(); } if(!pin&&IN.gpPin) pinchUp(); IN.gpPin=pin;
    if(b(1)&&!was(1)) goBack(); if(b(3)&&!was(3)) goHome(); if(b(2)&&!was(2)) recenter(); if(b(9)&&!was(9)) goHome();
    IN.gpPrev=gp.buttons.map(x=>x.pressed);
  }
  if(lx||ly){ IN.mouse=false; const sp=820*CFG.cur*(Math.min(S.W,S.H)/800); const m=Math.min(1,Math.hypot(lx,ly)); const cur=Math.pow(m,1.6)/Math.max(m,1e-6);
    S.cx=clamp(S.cx+lx*cur*sp*dt,0,S.W); S.cy=clamp(S.cy+ly*cur*sp*dt,0,S.H); if(S.pinch) pinchMove(); }
  if(rx||ry){ S.yaw+=rx*95*CFG.look*dt; S.pitch=clamp(S.pitch-ry*70*CFG.look*dt,-28,28); }
  if(GY&&isFinite(GY.yaw)&&isFinite(GY.pitch)){ S.yaw=lerp(S.yaw,S.yaw+angDiff(GY.yaw,S.yaw),.25); S.pitch=lerp(S.pitch,GY.pitch,.25); }
  if(!isFinite(S.yaw)) S.yaw=0; if(!isFinite(S.pitch)) S.pitch=0; if(Math.abs(S.yaw)>1e5) S.yaw=angDiff(S.yaw,0);
  if(!isFinite(S.cx)||!isFinite(S.cy)){ S.cx=S.W/2; S.cy=S.H/2; }
  if(S.recenterT){ const t=Math.min(1,(S.t-S.recenterT.t0)/.35), e=t*t*(3-2*t); S.yaw=S.recenterT.y0+angDiff(S.recenterT.to,S.recenterT.y0)*e; S.pitch=S.recenterT.p0*(1-e); if(t>=1) S.recenterT=null; }
}
function turnTo(yaw){ S.recenterT={t0:S.t,y0:S.yaw,p0:S.pitch,to:yaw}; if(GY){GY.ref=null;} }

/* ================= カーソル・レイ・手 ================= */
let ringR=12;
function drawHud(){
  const d=DPR(); hx.setTransform(d,0,0,d,0,0); hx.clearRect(0,0,S.W,S.H);
  for(const f of HUDHOOK) try{ f(hx); }catch(e){}
  const x=S.cx, y=S.cy, hov=!!HOV, pin=S.pinch;
  const tgt=pin?8:hov?17:12; ringR=lerp(ringR,tgt,.35);
  // 手の位置（右下）
  const hxp=S.W*.74+(x-S.W/2)*.18, hyp=S.H+30+(y-S.H/2)*.08;
  const tipX=hxp-34, tipY=hyp-150;
  if(CFG.hand){
    const g=hx.createLinearGradient(tipX,tipY,x,y); g.addColorStop(0,'rgba(255,255,255,.0)'); g.addColorStop(.2,'rgba(255,255,255,.28)'); g.addColorStop(1,'rgba(255,255,255,.55)');
    hx.strokeStyle=g; hx.lineWidth=2.4; hx.beginPath(); hx.moveTo(tipX,tipY); hx.lineTo(x,y); hx.stroke();
    drawHand(hxp,hyp,Math.atan2(y-tipY,x-tipX)+Math.PI/2,pin);
  }
  hx.beginPath(); hx.arc(x,y,ringR,0,TAU); hx.lineWidth=3; hx.strokeStyle='rgba(255,255,255,.95)'; hx.shadowColor='rgba(0,0,0,.5)'; hx.shadowBlur=6; hx.stroke(); hx.shadowBlur=0;
  if(hov||pin){ hx.fillStyle=pin?'rgba(255,255,255,.9)':'rgba(255,255,255,.28)'; hx.beginPath(); hx.arc(x,y,ringR-(pin?0:4),0,TAU); hx.fill(); }
}
function drawHand(x,y,ang,pin){
  hx.save(); hx.translate(x,y); hx.rotate(ang*.35-.25); hx.globalAlpha=.55;
  hx.fillStyle='rgba(235,240,255,.55)'; hx.strokeStyle='rgba(255,255,255,.9)'; hx.lineWidth=2;
  const cap=(x1,y1,x2,y2,w)=>{ hx.lineCap='round'; hx.lineWidth=w; hx.strokeStyle='rgba(225,232,255,.6)'; hx.beginPath(); hx.moveTo(x1,y1); hx.lineTo(x2,y2); hx.stroke(); hx.lineWidth=2; };
  // てのひら
  hx.beginPath(); hx.ellipse(10,-30,62,72,0,0,TAU); hx.fill(); hx.stroke();
  const p=pin?1:0;
  cap(-30,-70,-44,-150+30*p,24);      // 人さし指
  cap(-44,-150+30*p,-40+18*p,-186+46*p,20);
  cap(-62,-10,-74-6*p,-74+4*p,26);     // おや指
  cap(-74-6*p,-74+4*p,-60+20*p,-118+22*p,22);
  cap(4,-92,4,-168,24); cap(36,-86,40,-154,22); cap(62,-66,72,-122,20);
  hx.restore();
}

/* ================= ループ ================= */
let lastT=performance.now()/1000;
const FRAME=[];
function loop(){
  const t=performance.now()/1000; S.dt=Math.min(.05,t-lastT); lastT=t; S.t=t;
  try{ pollInput(S.dt); applyCam(); updateHover(); for(const f of FRAME) f(S.dt); drawHud(); }catch(e){ console.error(e); }
  requestAnimationFrame(loop);
}

let LIB, CLOCK, LEFT, DOCK, PANELS={};
function buildHome(){
  // ライブラリ
  const lib=h('div','lib'); LIB=new WO(lib,{yaw:0,y:-60,d:1.02});
  renderLib();
  // 時計
  const ck=h('div','clock'); CLOCK=new WO(ck,{yaw:0,y:-410,d:1.04}); tickClock(); setInterval(tickClock,5000);
  // 左のバー
  const lb=h('div','leftbar');
  for(const [k,f,lab] of [['search',()=>openSearch(),'さがす'],['list',()=>openWinList(),'開いているアプリ'],['bag',()=>openApp('store'),'ストア']]){ const b=h('button','lbtn',svg(k)); b.setAttribute('aria-label',lab); b.onclick=f; lb.appendChild(b); }
  LEFT=new WO(lb,{yaw:-pxToDeg(600,1.02),y:-80,d:1.02});
  // ドック
  const dk=h('div','dock');
  const add=(html,f,id,lab)=>{ const b=h('button','dbtn',html); if(id) b.id=id; b.setAttribute('aria-label',lab); b.onclick=f; dk.appendChild(b); return b; };
  add('<div class="avatar">き</div>',()=>togglePanel('profile'),'dAvatar','プロフィール');
  add(svg('home'),goHome,'dHome','ホーム'); dk.appendChild(h('div','sep'));
  add(svg('globe'),()=>openApp('browser'),'dBrowser','ブラウザ');
  add(svg('grid'),()=>toggleLib(),'dApps','アプリ');
  add(svg('people'),()=>openApp('chat'),'dPeople','チャット'); dk.appendChild(h('div','sep'));
  add(svg('sliders'),()=>togglePanel('quick'),'dQuick','クイック設定');
  const bell=add(svg('bell')+'<span class="badge"></span>',()=>togglePanel('noti'),'dBell','お知らせ');
  DOCK=new WO(dk,{yaw:0,y:330,d:.84});
  FRAME.push(dt=>{ // ドックは視線にゆっくりついてくる
    const df=angDiff(S.yaw,DOCK.yaw); if(Math.abs(df)>22) DOCK.follow=true;
    if(DOCK.follow&&!S.pinch){ DOCK.yaw+=df*Math.min(1,dt*3); DOCK.place(); if(Math.abs(df)<.5) DOCK.follow=false; }
  });

}
function renderLib(){
  const lib=LIB.el; lib.innerHTML='';
  const ids=INST.filter(i=>APPS[i]); const pattern=[4,5]; let i=0,k=0;
  while(i<ids.length){ const n=pattern[k%2]; const row=h('div','libRow'); for(const id of ids.slice(i,i+n)){ const a=APPS[id]; const b=h('button','app'); b.dataset.app=id; b.appendChild(iconEl(id)); b.appendChild(h('div','lb',(a.pin?IC('pin','pinI'):'')+esc(a.name))); b.onclick=()=>openApp(id); row.appendChild(b); } lib.appendChild(row); i+=n; k++; }
}
function tickClock(){ const d=new Date(); CLOCK.el.textContent=d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}); }
function toggleLib(v){ const show=v==null?!LIB.shown:v; LIB.yaw=CLOCK.yaw=S.yaw; LEFT.yaw=S.yaw-pxToDeg(600,1.02); [LIB,CLOCK,LEFT].forEach(o=>{o.place();o.show(show)}); updateDock(); }
function updateDock(){ const a=$('dApps'); if(a) a.classList.toggle('on',!!(LIB&&LIB.shown)); }
function goHome(){ closePanels(); if(GAMEON) endGame(); toggleLib(true); recenter(); }
function goBack(){ AU.back(); if(KB.wo&&KB.wo.shown){ hideKB(); return; } if(closePanels()) return; if(GAMEON){ endGame(); return; } const w=WINS[WINS.length-1]; if(w){ closeWin(w.id); return; } toggleLib(true); }

/* ================= ウィンドウ ================= */
const WINS=[];
function openApp(id){
  const a=APPS[id]; if(!a) return; closePanels(); hideKB();
  if(a.game&&!a.w){ toggleLib(false); startGame(id); return; }
  const ex=WINS.find(w=>w.id===id); if(ex){ turnTo(ex.o.yaw); toggleLib(false); return; }
  if(WINS.length>=3) closeWin(WINS[0].id);
  AU.open(); toggleLib(false);
  const root=h('div','win'); root.dataset.app=id;
  const box=h('div','winBox'); box.style.width=a.w+'px'; box.style.height=a.h+'px';
  const tt=h('div','winTitle'); tt.appendChild(iconEl(id)); tt.appendChild(h('span','',esc(a.name))); tt.appendChild(h('div','sp'));
  const body=h('div','winBody');
  box.append(tt,body);
  const bar=h('div','winBar'); const more=h('button','wbtn',svg('more')); more.setAttribute('aria-label','そのほか'); more.onclick=()=>toastW('ハンドルをつまんで動かせます');
  const grab=h('div','grab'); grab.title='つまんで動かす';
  const cl=h('button','wbtn',svg('close')); cl.setAttribute('aria-label','閉じる'); cl.onclick=()=>closeWin(id);
  bar.append(more,grab,cl); root.append(box,bar);
  // 置く場所：今見ている方向。ほかのウィンドウと重ならないようにずらす
  const span=pxToDeg(a.w/2+40,.98)*2; let yaw=S.yaw; const others=WINS.map(w=>w.o.yaw);
  for(let k=0;k<6&&others.some(o=>Math.abs(angDiff(o,yaw))<span*.9);k++){ yaw=S.yaw+(k%2?-1:1)*span*Math.ceil((k+1)/2); }
  const o=new WO(root,{yaw,y:-30,d:.98});
  const w={id,o,body,box,root,app:a}; WINS.push(w);
  try{ (APPIMPL[id]||(()=>{}))(body,w); }catch(e){ console.error(e); }
  turnTo(yaw); updateDock(); return w;
}
function closeWin(id){
  const i=WINS.findIndex(w=>w.id===id); if(i<0) return; const w=WINS[i];
  if(w.onClose) try{ w.onClose(); }catch(e){}
  WINS.splice(i,1); w.root.style.transition='opacity .2s'; w.root.style.opacity=0; setTimeout(()=>w.o.remove(),200); AU.back(); hideKB();
  if(w.theater) setTheater(w,false);
  if(!WINS.length&&!GAMEON) setTimeout(()=>{ if(!WINS.length&&!GAMEON) toggleLib(true); },150);
}
function setTheater(w,on){
  w.theater=on; w.root.classList.toggle('theater',on);
  w.o.s=on?1.75:1; w.o.d=on?1.25:.98; w.o.y=on?-80:-30; w.o.place();
  setDim(on?.8:CFG.dim,true);
  DOCK.show(!on);
}

/* ================= 小さなパネル ================= */
function panel(key,build){
  if(!PANELS[key]){ const el=h('div','mini'); PANELS[key]=new WO(el,{yaw:DOCK.yaw,y:-110,d:.8,shown:false}); }
  const p=PANELS[key]; p.el.innerHTML=''; build(p.el); return p;
}
function closePanels(){ let any=false; for(const k in PANELS){ if(PANELS[k].shown){ PANELS[k].show(false); any=true; } } ['dQuick','dBell','dAvatar'].forEach(i=>$(i)&&$(i).classList.remove('on')); return any; }
function togglePanel(key){
  const was=PANELS[key]&&PANELS[key].shown; closePanels(); if(was) return;
  const btn={quick:'dQuick',noti:'dBell',profile:'dAvatar'}[key]; $(btn)&&$(btn).classList.add('on');
  const p=panel(key,{quick:buildQuick,noti:buildNoti,profile:buildProfile,search:()=>{},list:()=>{}}[key]);
  p.yaw=S.yaw; p.place(); p.show(true); AU.open();
}
function head(el,title,closeFn){ const h4=h('h4','',`<span>${title}</span><span class="sp"></span>`); const c=h('button','wbtn',svg('close')); c.setAttribute('aria-label','閉じる'); c.onclick=closeFn||closePanels; h4.appendChild(c); el.appendChild(h4); }
function qrow(lab,ctrl){ const r=h('div','qrow'); r.appendChild(h('div','lb',lab)); r.appendChild(ctrl); return r; }
function envSeg(){ const s=h('div','seg'); for(const [k,n] of [['living','リビング'],['space','宇宙'],['beach','夕方の海'],['pass','パススルー']]){ const b=h('button',(CFG.env===k||(k==='pass'&&document.body.classList.contains('passthru')))?'on':'',n); b.onclick=()=>{ setEnv(k); s.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); }; s.appendChild(b); } return s; }
function buildQuick(el){
  head(el,'クイック設定');
  el.appendChild(h('div','sub','まわりの景色')); const seg=envSeg(); seg.style.margin='8px 0 6px'; el.appendChild(seg);
  const sl=makeSlider(1-CFG.dim,v=>{ setDim(1-v); saveCfg(); }); sl.style.flex='1'; el.appendChild(qrow('景色の明るさ',sl));
  const vo=makeSlider(CFG.vol,v=>{ CFG.vol=v; AU.master&&(AU.master.gain.value=v); saveCfg(); }); vo.style.flex='1'; el.appendChild(qrow('音量',vo));
  el.appendChild(qrow('画面のスティック',makeToggle(CFG.pad,v=>{ CFG.pad=v; document.body.classList.toggle('nopad',!v); saveCfg(); })));
  el.appendChild(qrow('端末を動かして見回す',makeToggle(CFG.gyro,v=>setGyro(v))));
  const r=h('div','row'); r.style.marginTop='10px'; const b1=h('button','btn','正面にもどす'); b1.onclick=()=>{closePanels();recenter()}; const b2=h('button','btn','すべての設定'); b2.onclick=()=>openApp('settings'); r.append(b1,b2); el.appendChild(r);
}
const NOTI=[['chat','はると','「あとでいっしょにまとあてやろう！」','2分前'],['store','ストア','「おえかき」が入手できます','15分前'],['video','ビデオ','新しい動画「星空タイムラプス」','1時間前'],['settings','システム','Home XR OS v'+APP_VERSION+' にアップデートしました','きのう']];
function buildNoti(el){
  head(el,'お知らせ'); $('dBell').querySelector('.badge')?.remove();
  for(const [ic,t,m,tm] of NOTI){ const n=h('button','noti hov-l'); n.style.width='100%'; n.style.textAlign='left'; n.appendChild(iconEl(ic)); n.appendChild(h('div','',`<b>${esc(t)} <span style="font-weight:500">・${tm}</span></b><span>${esc(m)}</span>`)); n.onclick=()=>openApp(ic==='settings'?'help':ic); el.appendChild(n); }
}
function buildProfile(el){
  head(el,'プロフィール');
  el.appendChild(h('div','row',`<div class="avatar" style="width:72px;height:72px;font-size:30px">き</div><div><b style="font-size:22px">きみ</b><div class="sub">オンライン ・ Home XR OSを体験中</div></div>`));
  const st=STORE.get('score',{}); el.appendChild(h('div','card',`<b>ゲームの記録</b><div class="sub" style="margin-top:6px;line-height:1.8">まとあて360：${st.target||0}点<br>キューブスラッシュ：${st.slash||0}点<br>ブロックくずし：${st.breakout||0}点</div>`)).style.marginTop='14px';
}
function openSearch(){
  closePanels(); const p=panel('search',el=>{
    head(el,'アプリをさがす');
    const f=h('div','field focus','<span class="ph">アプリの名前</span>'); el.appendChild(f);
    const res=h('div',''); res.style.marginTop='12px'; el.appendChild(res);
    const draw=t=>{ f.innerHTML=t?esc(t)+'<span class="caret"></span>':'<span class="ph">アプリの名前</span><span class="caret"></span>'; res.innerHTML='';
      for(const id of INST.filter(i=>!t||APPS[i].name.includes(t))){ const n=h('button','noti hov-l'); n.style.width='100%'; n.appendChild(iconEl(id)); n.appendChild(h('div','',`<b>${esc(APPS[id].name)}</b>`)); n.onclick=()=>{ hideKB(); openApp(id); }; res.appendChild(n); } };
    draw(''); showKB({text:'',onInput:draw,anchor:PANELS.search,mode:'kana'});
  }); p.yaw=S.yaw; p.y=-160; p.place(); p.show(true);
}
function openWinList(){
  closePanels(); const p=panel('list',el=>{
    head(el,'開いているアプリ');
    if(!WINS.length) el.appendChild(h('div','sub','いまは何も開いていないよ'));
    for(const w of WINS){ const n=h('div','noti'); n.appendChild(iconEl(w.id)); n.appendChild(h('div','',`<b>${esc(w.app.name)}</b>`)).style.flex='1'; const go=h('button','btn','見る'); go.onclick=()=>{closePanels();turnTo(w.o.yaw)}; const x=h('button','btn','閉じる'); x.onclick=()=>{closeWin(w.id);openWinList()}; n.append(go,x); n.style.alignItems='center'; el.appendChild(n); }
  }); p.yaw=S.yaw; p.y=-120; p.place(); p.show(true);
}
function setEnv(k){
  if(k==='pass'){ startPass(); return; }
  stopPass(); CFG.env=k; saveCfg(); buildEnv();
}
async function startPass(){
  try{ const st=await openCam('environment'); $('pass').srcObject=st; document.body.classList.add('passthru'); toastW('パススルー：カメラの映像を表示しています'); }
  catch(e){ toastW('カメラを使えませんでした'); }
}
function stopPass(){ const v=$('pass'); if(v.srcObject){ v.srcObject.getTracks().forEach(t=>t.stop()); v.srcObject=null; } document.body.classList.remove('passthru'); }

/* ================= トースト ================= */
let TOAST=null;
function toastW(t){
  if(!TOAST){ TOAST=new WO(h('div','toastW'),{yaw:S.yaw,y:-330,d:.8,shown:false}); }
  TOAST.el.textContent=t; TOAST.yaw=S.yaw; TOAST.place(); TOAST.show(true); TOAST.el.style.opacity=1;
  clearTimeout(toastW.t); toastW.t=setTimeout(()=>{ TOAST.el.style.opacity=0; setTimeout(()=>TOAST.show(false),300); },2400);
}

/* ================= 仮想キーボード ================= */
const KB={wo:null,opts:null,text:'',mode:'kana',daku:false};
const KANA=['あいうえお','かきくけこ','さしすせそ','たちつてと','なにぬねの','はひふへほ','まみむめも','や ゆ よ','らりるれろ','わをんー、'];
const DK={'か':'が','き':'ぎ','く':'ぐ','け':'げ','こ':'ご','さ':'ざ','し':'じ','す':'ず','せ':'ぜ','そ':'ぞ','た':'だ','ち':'ぢ','つ':'づ','て':'で','と':'ど','は':'ば','ひ':'び','ふ':'ぶ','へ':'べ','ほ':'ぼ'};
const SM={'あ':'ぁ','い':'ぃ','う':'ぅ','え':'ぇ','お':'ぉ','や':'ゃ','ゆ':'ゅ','よ':'ょ','つ':'っ'};
const CYC={}; for(const k in DK){ CYC[k]=DK[k]; CYC[DK[k]]=k; }
for(const [a,b,c] of [['は','ば','ぱ'],['ひ','び','ぴ'],['ふ','ぶ','ぷ'],['へ','べ','ぺ'],['ほ','ぼ','ぽ']]){ CYC[a]=b; CYC[b]=c; CYC[c]=a; }
for(const k in SM){ CYC[k]=SM[k]; CYC[SM[k]]=k; } CYC['っ']='つ'; CYC['つ']='っ'; CYC['づ']='つ';
function showKB(opts){
  KB.opts=opts; KB.text=opts.text||''; KB.mode=opts.mode||'kana';
  if(!KB.wo) KB.wo=new WO(h('div','kb'),{yaw:S.yaw,y:420,d:.78,shown:false});
  drawKB(); const a=opts.anchor; KB.wo.yaw=a?a.yaw:S.yaw; KB.wo.y=a?(a.y+ (a===PANELS.search?260:340)):380; KB.wo.place(); KB.wo.show(true);
}
function hideKB(){ if(KB.wo&&KB.wo.shown){ KB.wo.show(false); KB.opts&&KB.opts.onClose&&KB.opts.onClose(); KB.opts=null; } }
function kbType(s){ KB.text+=s; KB.opts&&KB.opts.onInput(KB.text); }
function drawKB(){
  const k=KB.wo.el; k.innerHTML='';
  const key=(lab,f,cls='')=>{ const b=h('button','key '+cls,lab); b.onclick=f; return b; };
  if(KB.mode==='kana'){
    const cols=KANA.map(s=>[...s]);
    for(let r=0;r<5;r++){ const row=h('div','kbr'); for(let c=0;c<10;c++){ const ch=cols[c][r]; if(!ch||ch===' '){ row.appendChild(h('div','key','')).style.visibility='hidden'; continue; } row.appendChild(key(ch,()=>kbType(ch))); } k.appendChild(row); }
  } else {
    for(const r of ['1234567890','qwertyuiop','asdfghjkl','zxcvbnm.']){ const row=h('div','kbr'); for(const ch of r) row.appendChild(key(ch,()=>kbType(ch))); k.appendChild(row); }
  }
  const row=h('div','kbr');
  row.appendChild(key(KB.mode==='kana'?'ABC':'かな',()=>{ KB.mode=KB.mode==='kana'?'abc':'kana'; drawKB(); },'w'));
  if(KB.mode==='kana'){ row.appendChild(key('゛゜小',()=>{ const t=KB.text, l=t.slice(-1), n=CYC[l]; if(n){ KB.text=t.slice(0,-1)+n; KB.opts.onInput(KB.text); } },'w')); }
  row.appendChild(key('スペース',()=>kbType(' '),'xw'));
  row.appendChild(key('⌫',()=>{ KB.text=[...KB.text].slice(0,-1).join(''); KB.opts.onInput(KB.text); },'w'));
  row.appendChild(key(KB.opts&&KB.opts.enter||'完了',()=>{ const o=KB.opts; if(o&&o.onEnter) o.onEnter(KB.text); else hideKB(); },'w pri'));
  k.appendChild(row);
}

const SONGS=[{t:'あさのひかり',bpm:96,ch:[[60,64,67],[57,60,64],[53,57,60],[55,59,62]],col:'#ffd166'},{t:'よるのドライブ',bpm:110,ch:[[57,60,64],[53,57,60],[60,64,67],[55,59,62]],col:'#8b93ff'},{t:'うみのさんぽ',bpm:84,ch:[[62,66,69],[59,62,66],[55,59,62],[57,61,64]],col:'#5ad1ff'},{t:'うちゅうのゆめ',bpm:72,ch:[[52,55,59],[48,52,55],[53,57,60],[50,53,57]],col:'#e58bff'}];
const mtof=m=>440*Math.pow(2,(m-69)/12);
APPIMPL.music=(body,w)=>{
  body.style.cssText+=';display:flex;flex-direction:column;padding:22px;gap:16px';
  const top=h('div','row'); const art=cv(220,220); art.style.cssText='width:180px;border-radius:24px'; const ti=h('div',''); ti.style.flex='1'; top.append(art,ti);
  const vis=cv(820,140); vis.style.cssText='width:100%;height:110px'; const ctl=h('div','row'); ctl.style.justifyContent='center';
  const prev=h('button','wbtn',svg('back')), pp=h('button','wbtn',svg('play')), next=h('button','wbtn',svg('fwd')); pp.style.cssText='width:64px;height:64px'; ctl.append(prev,pp,next);
  const list=h('div','row'); list.style.gap='8px'; body.append(top,vis,ctl,list);
  const M={i:0,play:false,step:0,next:0,bars:new Array(32).fill(0)};
  const sel=i=>{ M.i=(i+SONGS.length)%SONGS.length; const s=SONGS[M.i]; const g=art.getContext('2d'); scene(g,220,220,M.i*3+1,M.i%2?'night':''); ti.innerHTML=`<div class="sub">プレイリスト ・ ジェネレート音楽</div><b style="font-size:30px">${s.t}</b><div class="sub">Home XR OSのオリジナル曲</div>`; list.querySelectorAll('.btn').forEach((b,k)=>b.classList.toggle('pri',k===M.i)); M.step=0; };
  SONGS.forEach((s,i)=>{ const b=h('button','btn',s.t); b.onclick=()=>{ sel(i); setP(true); }; list.appendChild(b); });
  const setP=p=>{ M.play=p; pp.innerHTML=svg(p?'pause':'play'); M.next=AU.ctx?AU.ctx.currentTime+.05:0; };
  pp.onclick=()=>{ AU.init(); setP(!M.play); }; prev.onclick=()=>sel(M.i-1); next.onclick=()=>sel(M.i+1);
  const note=(m,t,d,type,v)=>{ const c=AU.ctx; const o=c.createOscillator(), g=c.createGain(); o.type=type; o.frequency.value=mtof(m); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g); g.connect(AU.master); o.start(t); o.stop(t+d+.05); };
  const tick=dt=>{ if(!body.isConnected) return; const s=SONGS[M.i];
    if(M.play&&AU.ctx){ const c=AU.ctx, spb=60/s.bpm/2; while(M.next<c.currentTime+.15){ const st=M.step, chord=s.ch[Math.floor(st/8)%4];
      if(st%8===0) chord.forEach(m=>note(m-12,M.next,spb*7,'triangle',.05));
      if(st%2===0) note(chord[(st/2)%3]+12,M.next,spb*1.6,'sine',.07);
      if(st%4===0){ note(chord[0]-24,M.next,spb*1.5,'sine',.12); }
      M.bars=M.bars.map((b,k)=>Math.max(b,(Math.random()*.6+.4)*(k%((st%4)+3)===0?1:.5)));
      M.step++; M.next+=spb; } }
    const g=vis.getContext('2d'); g.clearRect(0,0,820,140); M.bars=M.bars.map(b=>b*(M.play?.92:.85)); M.bars.forEach((b,k)=>{ g.fillStyle=s.col; g.globalAlpha=.85; const hh=8+b*120; g.fillRect(k*25.6+4,140-hh,18,hh); }); g.globalAlpha=1; };
  FRAME.push(tick); w.onClose=()=>{ M.play=false; const i=FRAME.indexOf(tick); if(i>=0) FRAME.splice(i,1); };
  sel(0);
};

  for(const c of ['#2b2b2b','#ff5a5f','#ffb35c','#ffe066','#3ecf8e','#4c8dff','#b06bff','#ffffff']){ const b=h('button','wbtn'); b.style.background=c; b.style.border='3px solid rgba(255,255,255,.4)'; b.onclick=()=>{ col=c; tools.querySelectorAll('.wbtn').forEach(x=>x.style.outline=''); b.style.outline='3px solid #fff'; }; tools.appendChild(b); }

  const cl=h('button','btn','ぜんぶ消す'); cl.onclick=()=>{ g.fillStyle='#fffdf7'; g.fillRect(0,0,1200,680); }; tools.appendChild(cl);

  cvs._xr={down(x,y){ last=pt(x,y); g.fillStyle=col; g.beginPath(); g.arc(last[0],last[1],size/2,0,TAU); g.fill(); },

  tools.querySelector('.wbtn').style.outline='3px solid #fff';

/* ================= ゲーム（360°） ================= */
let GAMEON=null, GAME=null;
const HUDHOOK=[];
function hideHomeForGame(){
  GAME.hidden=[]; for(const o of [LIB,CLOCK,LEFT,DOCK,...WINS.map(w=>w.o)]) if(o.shown){ GAME.hidden.push(o); o.show(false); }
  closePanels(); hideKB(); setDim(Math.max(CFG.dim,.55),true);
}
function startGame(id){
  if(GAMEON) endGame(true);
  GAMEON=id; GAME={id,score:0,combo:0,t:0,objs:[],yaw0:S.yaw,phase:'count',count:3.2};
  hideHomeForGame();
  const hudEl=h('div','mini'); hudEl.style.cssText='width:max-content;white-space:nowrap;padding:14px 22px;display:flex;gap:22px;align-items:center;border-radius:999px';
  hudEl.innerHTML=`<b style="font-size:20px">${APPS[id].name}</b><span class="sub">スコア</span><b id="gScore" style="font-size:26px;min-width:70px">0</b><span class="sub">のこり</span><b id="gTime" style="font-size:26px;min-width:44px">--</b><span id="gCombo" class="sub" style="min-width:80px"></span>`;
  const q=h('button','btn','やめる'); q.onclick=()=>endGame(); hudEl.appendChild(q);
  GAME.hud=new WO(hudEl,{yaw:S.yaw,y:-330,d:1});
  const big=h('div',''); big.style.cssText='font-size:150px;font-weight:900;color:#fff;text-shadow:0 10px 40px rgba(0,0,0,.6);text-align:center;white-space:nowrap';
  GAME.big=new WO(big,{yaw:S.yaw,y:-40,d:1});
  (id==='target'?initTarget:initSlash)();
  AU.tone(523,.15,'triangle',.12); FRAME.push(gameTick);
}
function endGame(silent){
  if(!GAMEON) return; const G0=GAME; GAMEON=null; GAME=null;
  const i=FRAME.indexOf(gameTick); if(i>=0) FRAME.splice(i,1);
  for(const o of G0.objs) o.wo&&o.wo.remove(); G0.hud.remove(); G0.big.remove(); if(G0.res) G0.res.remove(); if(G0.extra) G0.extra.forEach(o=>o.remove());
  HUDHOOK.length=0; MUS.stop(); GAMEPINCH=null;
  setDim(CFG.dim,true); for(const o of G0.hidden) o.show(true);
  if(!WINS.length&&!silent) toggleLib(true);
}
function gameTick(dt){
  const G0=GAME; if(!G0) return;
  if(G0.phase==='count'){ G0.count-=dt; const n=Math.ceil(G0.count); G0.big.el.textContent=n>0?String(n):'スタート！'; if(n!==G0.lastN){ G0.lastN=n; AU.tone(n>0?660:990,.12,'square',.08); }
    if(G0.count<=-.5){ G0.phase='play'; G0.big.show(false); G0.onStart&&G0.onStart(); } return; }
  if(G0.phase==='play'){ G0.t+=dt; const left=G0.dur-G0.t; $('gTime').textContent=Math.max(0,Math.ceil(left)); G0.update(dt);
    if(left<=0) finishGame(); }
}
function setScore(add,label){
  const G0=GAME; G0.score=Math.max(0,G0.score+add); $('gScore').textContent=G0.score; $('gCombo').textContent=G0.combo>1?`${G0.combo} コンボ`:'';
  if(label) popText(label,add>0);
}
function popText(t,good){
  const e=h('div','',t); e.style.cssText=`font-size:46px;font-weight:900;color:${good?'#ffe066':'#ff7a7a'};text-shadow:0 4px 18px rgba(0,0,0,.6);white-space:nowrap;transition:transform .7s,opacity .7s`;
  const o=new WO(e,{yaw:S.yaw+deg(Math.atan((S.cx-S.W/2)/S.P)),y:(S.cy-S.H/2)*.9-60,d:.9}); requestAnimationFrame(()=>{ e.style.transform='translateY(-60px)'; e.style.opacity=0; }); setTimeout(()=>o.remove(),750);
}
function finishGame(){
  const G0=GAME; G0.phase='end'; MUS.stop();
  for(const o of G0.objs) o.wo&&o.wo.remove(); G0.objs=[];
  const best=STORE.get('score',{}); const nb=G0.score>(best[G0.id]||0); if(nb){ best[G0.id]=G0.score; STORE.set('score',best); }
  const el=h('div','mini'); el.style.width='560px'; el.style.textAlign='center';
  el.innerHTML=`<div class="sub">${APPS[G0.id].name}</div><div style="font-size:72px;font-weight:900;margin:6px 0">${G0.score}</div><div class="sub" style="margin-bottom:6px">${nb?'じこベスト更新！':'ベスト：'+(best[G0.id]||0)}</div><div class="sub" style="margin-bottom:18px">${G0.stat||''}</div>`;
  const r=h('div','row'); r.style.justifyContent='center'; const a=h('button','btn pri','もう一回'); a.onclick=()=>{ const id=G0.id; endGame(true); startGame(id); }; const b=h('button','btn','ホームへ'); b.onclick=()=>endGame(); r.append(a,b); el.appendChild(r);
  G0.res=new WO(el,{yaw:S.yaw,y:-20,d:.95}); turnTo(S.yaw);
  AU.tone(784,.15,'triangle',.12); setTimeout(()=>AU.tone(1047,.25,'triangle',.12),160);
}
// 画面外のまとを指す矢印
function drawPointer(g,yaw,ypx,col){
  const dy=angDiff(yaw,S.yaw); const sx=S.W/2+Math.tan(rad(clamp(dy,-80,80)))*S.P; if(Math.abs(dy)<35&&sx>40&&sx<S.W-40) return;
  const right=dy>0, x=right?S.W-48:48, y=clamp(S.H/2+ypx*.4,90,S.H-90);
  g.save(); g.translate(x,y); g.rotate(right?0:Math.PI); g.fillStyle=col; g.globalAlpha=.85+.15*Math.sin(S.t*8);
  g.beginPath(); g.moveTo(22,0); g.lineTo(-12,-20); g.lineTo(-4,0); g.lineTo(-12,20); g.closePath(); g.fill(); g.restore();
}

/* ---- まとあて360 ---- */
function initTarget(){
  const G0=GAME; G0.dur=45; G0.spawnT=0; G0.hits=0; G0.miss=0;
  G0.update=dt=>{
    G0.spawnT-=dt; const maxN=G0.t<15?3:G0.t<30?4:5;
    if(G0.spawnT<=0&&G0.objs.length<maxN){ G0.spawnT=Math.max(.45,1.2-G0.t*.015); spawnTarget(); }
    for(const o of [...G0.objs]){ o.life-=dt; const k=clamp(o.life/o.max,0,1); o.wo.s=.55+.45*k; o.wo.place(); o.wo.el.style.opacity=k<.2?k/.2:1;
      if(o.life<=0){ o.wo.remove(); G0.objs.splice(G0.objs.indexOf(o),1); G0.combo=0; G0.miss++; setScore(0); } }
  };
  GAMEPINCH=el=>{
    const t=el&&el.closest('.tgt'); if(!t){ AU.tone(200,.08,'sine',.08); G0.combo=0; setScore(0); return; }
    const o=G0.objs.find(x=>x.wo.el===t); if(!o) return;
    const r=t.getBoundingClientRect(); const d=Math.hypot(S.cx-(r.left+r.width/2),S.cy-(r.top+r.height/2))/(r.width/2);
    const base=d<.33?100:d<.66?50:20; G0.combo++; G0.hits++;
    const pts=Math.round(base*(1+Math.min(G0.combo-1,10)*.1));
    AU.tone(base===100?1320:base===50?990:740,.12,'triangle',.14); AU.noise(.12,.12,2000);
    t.classList.add('boom'); setTimeout(()=>o.wo.remove(),260); G0.objs.splice(G0.objs.indexOf(o),1);
    setScore(pts,(base===100?'ど真ん中！ +':'+')+pts);
  };
  HUDHOOK.push(g=>{ if(!GAME||GAME.phase!=='play') return; for(const o of GAME.objs) drawPointer(g,o.wo.yaw,o.wo.y,'#ffd166'); });
  G0.stat='';
  const f=G0.update; G0.update=dt=>{ f(dt); G0.stat=`当てた数：${G0.hits}　にがした数：${G0.miss}`; };
}
let GAMEPINCH=null;
function spawnTarget(){
  const G0=GAME; const el=h('div','tgt');
  el.style.cssText='width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,#ff4a4a 0 16%,#fff 17% 33%,#ff8a3d 34% 50%,#fff 51% 66%,#ffcf4a 67% 100%);box-shadow:0 0 0 6px rgba(255,255,255,.9),0 18px 40px rgba(0,0,0,.45);transition:transform .25s,opacity .25s';
  const yaw=G0.yaw0+(Math.random()*2-1)*(G0.t<10?70:150), y=-300+Math.random()*520, d=.9+Math.random()*.6;
  const o={wo:new WO(el,{yaw,y,d,s:.2}),life:3.6-Math.min(1.4,G0.t*.03),max:0}; o.max=o.life; G0.objs.push(o);
  AU.tone(520,.06,'sine',.05,1.6);
}

/* ---- キューブスラッシュ ---- */
const MUS={on:false,next:0,beat:0,bpm:104,
  start(){ if(!AU.ctx) return; this.on=true; this.beat=0; this.next=AU.ctx.currentTime+.1; },
  stop(){ this.on=false; },
  tick(onBeat){ if(!this.on||!AU.ctx) return; const c=AU.ctx, spb=60/this.bpm;
    while(this.next<c.currentTime+.12){ const t=this.next, b=this.beat;
      const o=c.createOscillator(), g=c.createGain(); o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(40,t+.15); g.gain.setValueAtTime(.35,t); g.gain.exponentialRampToValueAtTime(.001,t+.18); o.connect(g); g.connect(AU.master); o.start(t); o.stop(t+.2);
      const n=c.createBufferSource(), nb=c.createBuffer(1,c.sampleRate*.05,c.sampleRate), a=nb.getChannelData(0); for(let i=0;i<a.length;i++) a[i]=(Math.random()*2-1)*(1-i/a.length); n.buffer=nb; const hp=c.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=6000; const ng=c.createGain(); ng.gain.value=.12; n.connect(hp); hp.connect(ng); ng.connect(AU.master); n.start(t+spb/2);
      const ch=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]][Math.floor(b/4)%4];
      if(b%4===0) for(const m of ch){ const p=c.createOscillator(), pg=c.createGain(); p.type='sawtooth'; p.frequency.value=mtof(m); const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1200; pg.gain.setValueAtTime(0,t); pg.gain.linearRampToValueAtTime(.025,t+.05); pg.gain.exponentialRampToValueAtTime(.001,t+spb*4); p.connect(lp); lp.connect(pg); pg.connect(AU.master); p.start(t); p.stop(t+spb*4+.1); }
      const ml=c.createOscillator(), mg=c.createGain(); ml.type='square'; ml.frequency.value=mtof(ch[(b*2)%3]+12); mg.gain.setValueAtTime(.03,t); mg.gain.exponentialRampToValueAtTime(.001,t+spb*.8); ml.connect(mg); mg.connect(AU.master); ml.start(t); ml.stop(t+spb);
      onBeat(b,t-c.currentTime); this.beat++; this.next+=spb; } }
};
const DIRS={up:[0,-1,'↑'],down:[0,1,'↓'],left:[-1,0,'←'],right:[1,0,'→'],any:[0,0,'●']};
function initSlash(){
  const G0=GAME; G0.dur=60; G0.cut=0; G0.miss=0; G0.vx=0; G0.vy=0; G0.px=S.cx; G0.py=S.cy;
  // ネオンのレーン

}
function spawnCube(){
  const G0=GAME; const red=Math.random()<.5; const dk=G0.t<10?['any','down','up'][(Math.random()*3)|0]:Object.keys(DIRS)[(Math.random()*5)|0];

APPIMPL.breakout=(body,w)=>{
  const c=cv(1200,900); c.dataset.canvas=''; c.style.cssText='width:100%;height:100%;display:block;background:#0b2a2a'; body.appendChild(c);
  const g=c.getContext('2d'); const W=1200,H=900;
  const B={px:600,ball:null,lives:3,score:0,level:1,bricks:[],msg:'つまんでスタート'};
  const build=()=>{ B.bricks=[]; for(let r=0;r<6;r++) for(let k=0;k<10;k++) B.bricks.push({x:60+k*108,y:90+r*44,w:96,h:32,c:['#ff6b8b','#ff9f5c','#ffd166','#6ee7b7','#5ad1ff','#a78bfa'][r],alive:true}); };
  build();
  const launch=()=>{ if(B.ball) return; if(B.lives<=0){ B.lives=3; B.score=0; B.level=1; build(); } B.ball={x:B.px,y:H-110,vx:(Math.random()<.5?-1:1)*360,vy:-560-B.level*40}; B.msg=''; AU.tone(660,.08,'square',.06); };
  c._xr={down(){ launch(); }};
  const tick=dt=>{ if(!body.isConnected) return;
    if(S.hit===c){ const p=localPos(c); B.px=clamp(p.x*W,90,W-90); }
    const b=B.ball;
    if(b){ b.x+=b.vx*dt; b.y+=b.vy*dt;
      if(b.x<14||b.x>W-14){ b.vx*=-1; b.x=clamp(b.x,14,W-14); AU.tone(440,.03,'square',.03); }
      if(b.y<14){ b.vy*=-1; b.y=14; }
      if(b.y>H-80&&b.y<H-56&&Math.abs(b.x-B.px)<95&&b.vy>0){ b.vy=-Math.abs(b.vy); b.vx=(b.x-B.px)/95*620; AU.tone(520,.04,'square',.05); }
      for(const k of B.bricks){ if(!k.alive) continue; if(b.x>k.x-12&&b.x<k.x+k.w+12&&b.y>k.y-12&&b.y<k.y+k.h+12){ k.alive=false; b.vy*=-1; B.score+=10*B.level; AU.tone(700+Math.random()*500,.05,'triangle',.06); break; } }
      if(b.y>H+20){ B.ball=null; B.lives--; AU.tone(180,.3,'sawtooth',.08,.5); B.msg=B.lives>0?'つまんでつづける':'ゲームオーバー（つまんでもう一回）'; if(B.lives<=0){ const best=STORE.get('score',{}); if(B.score>(best.breakout||0)){ best.breakout=B.score; STORE.set('score',best); } } }
      if(B.bricks.every(k=>!k.alive)){ B.level++; build(); B.ball=null; B.msg=`レベル${B.level}！つまんでスタート`; AU.tone(1047,.2,'triangle',.1); }
    } else if(!B.ball){ }
    g.fillStyle='#0b2a2a'; g.fillRect(0,0,W,H);
    for(const k of B.bricks) if(k.alive){ g.fillStyle=k.c; rr(g,k.x,k.y,k.w,k.h,8,k.c); }
    g.fillStyle='#fff'; rr(g,B.px-90,H-72,180,22,11,'#fff');
    const bx=b?b.x:B.px, by=b?b.y:H-100; g.fillStyle='#fff'; g.beginPath(); g.arc(bx,by,13,0,TAU); g.fill();
    g.fillStyle='rgba(255,255,255,.85)'; g.font='bold 34px system-ui'; g.textAlign='left'; g.fillText(`スコア ${B.score}`,30,50); g.textAlign='right'; g.fillText('●'.repeat(Math.max(0,B.lives))+`  Lv.${B.level}`,W-30,50);
    if(B.msg){ g.textAlign='center'; g.font='bold 44px system-ui'; g.fillText(B.msg,W/2,H/2+120); }
  };
  FRAME.push(tick); w.onClose=()=>{ const i=FRAME.indexOf(tick); if(i>=0) FRAME.splice(i,1); };
};

// ---- カメラで手を認識（右手：人さし指＝カーソル、親指とつまむ、手のひら＝メニュー） ----
const HT={on:false,rec:null,video:null,last:-1,gap:66,avg:null,pin:false,palmT:0,palmFired:false,sx:null,sy:null,seen:0};
function htInfo(dist,hint){ let e=$('htInfo'); if(!e){ e=h('div',''); e.id='htInfo'; document.body.appendChild(e); }
  e.textContent=dist==null?L('手が見えません','No hand'):(HT.pin?L('つまみ中','Pinching'):L('手が見えてる','Hand found'))+'　'+L('すき間 ','gap ')+dist+(hint?'　'+hint:''); }
// カメラの映像に、見つけた手の骨組みを描く（タップで大きく）
const HBONES=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[0,17],[17,18],[18,19],[19,20]];
function htDraw(LM){ let c=$('handDbg'); if(!c){ c=h('canvas',''); c.id='handDbg'; document.body.appendChild(c); }
  const v=$('handCam'), r=v.getBoundingClientRect(); c.style.left=r.left+'px'; c.style.top=r.top+'px'; c.style.width=r.width+'px'; c.style.height=r.height+'px';
  const W=Math.round(r.width), H=Math.round(r.height); if(c.width!==W) c.width=W; if(c.height!==H) c.height=H; c.style.transform=v.style.transform; const inf=$('htInfo'); if(inf) inf.style.top=(r.bottom+6)+'px';
  const x=c.getContext('2d'); x.clearRect(0,0,W,H); if(!LM) return;
  x.lineWidth=2.5; x.strokeStyle=HT.pin?'#ffd84a':'#3ecf8e'; x.beginPath(); for(const [a,b] of HBONES){ x.moveTo(LM[a].x*W,LM[a].y*H); x.lineTo(LM[b].x*W,LM[b].y*H); } x.stroke();
  x.fillStyle='#fff'; for(const i of [4,8]){ x.beginPath(); x.arc(LM[i].x*W,LM[i].y*H,4,0,TAU); x.fill(); } }
document.addEventListener('click',e=>{ if(e.target&&(e.target.id==='handCam'||e.target.id==='handDbg')) $('handCam').classList.toggle('big'); },true);
async function startHands(){
  if(HT.on) return; toastW('手の認識を準備しています…');
  try{
    const v=$('handCam'); const back=CFG.handCam!=='front'; const st=await openCam(back?'environment':'user',{width:{ideal:640},height:{ideal:480},frameRate:{ideal:30}}); HT.back=back; v.style.transform=back?'none':'scaleX(-1)'; v.srcObject=st; await v.play(); HT.video=v;
    const V='0.10.14';
    const mp=await import(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${V}/vision_bundle.mjs`);
    const fs=await mp.FilesetResolver.forVisionTasks(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${V}/wasm`);
    const opt=d=>({baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task',delegate:d},runningMode:'VIDEO',numHands:1,minHandDetectionConfidence:.3,minHandPresenceConfidence:.3,minTrackingConfidence:.3});
    try{ HT.rec=await mp.GestureRecognizer.createFromOptions(fs,opt('GPU')); }catch(e){ HT.rec=await mp.GestureRecognizer.createFromOptions(fs,opt('CPU')); }
    HT.on=true; document.body.classList.add('hands'); CFG.hands=true; saveCfg(); toastW('右手の人さし指でカーソル、親指とくっつけてつまむ。手のひらでメニュー');
  }catch(e){ console.warn(e); stopHands(); toastW('手の認識を始められませんでした（カメラとネットが必要です）'); }
}
function stopHands(){ HT.on=false; CFG.hands=false; saveCfg(); document.body.classList.remove('hands'); const v=$('handCam'); if(v.srcObject){ v.srcObject.getTracks().forEach(t=>t.stop()); v.srcObject=null; } if(HT.pin){ HT.pin=false; pinchUp(); } }
FRAME.push(()=>{
  if(!HT.on||!HT.rec||!HT.video||HT.video.readyState<2) return;
  const now=performance.now(); if(now-HT.last<HT.gap) return; HT.last=now;
  let r; const t0=performance.now(); try{ r=HT.rec.recognizeForVideo(HT.video,now); }catch(e){ return; }
  // 重い端末では、認識する回数を自動で減らす
  const took=performance.now()-t0; HT.avg=HT.avg==null?took:HT.avg*.9+took*.1; HT.gap=clamp(HT.avg*1.4,30,200);
  if(HT.avg>180){ HT.slow=(HT.slow||0)+1; if(HT.slow>20){ stopHands(); toastW(L('この端末では手の認識が重すぎるので、オフにしました','Hand tracking was too slow on this device and was turned off')); return; } } else HT.slow=0;
  // 前カメラは鏡にしていないので、ラベルの Left が自分の右手
  const base=HT.back?'Right':'Left', want=CFG.swapHand?(base==='Right'?'Left':'Right'):base; let idx=-1;
  if(r.landmarks&&r.landmarks.length) idx=0;
  $('handCam').classList.toggle('seen',idx>=0); HT.found=idx>=0;
  if(idx<0){ htInfo(null); htDraw(null); HT.seen=0; HT.lost=(HT.lost||0)+1; if(HT.pin&&HT.lost>6){ HT.pin=false; pinchUp(); } return; }
  HT.lost=0;
  HT.seen++;
  const LM=r.landmarks[idx], g=(r.gestures[idx]&&r.gestures[idx][0])||{};
  // 手のひら → メニュー
  if(g.categoryName==='Open_Palm'&&g.score>.6){ HT.palmT+=.033; if(HT.palmT>.6&&!HT.palmFired){ HT.palmFired=true; togglePalmMenu(true); AU.tone(990,.12,'sine',.1); } }
  else{ HT.palmT=0; HT.palmFired=false; }
  // カーソルの位置：人さし指の付け根と「親指と人さし指のまん中」を使う
  // （指先だとつまむ瞬間にカーソルが右下へズレるので）
  const tip=LM[8], th=LM[4], w=LM[0], mm=LM[9], mcp=LM[5];
  const ax=mcp.x*.5+(tip.x+th.x)/4, ay=mcp.y*.5+(tip.y+th.y)/4;
  const nx=clamp(((HT.back?ax:1-ax)-.2)/.6,0,1), ny=clamp((ay-.2)/.55,0,1);
  // 親指と人さし指のすき間：3D（メートル）で測る。角度や距離に左右されにくい
  const WL=r.worldLandmarks&&r.worldLandmarks[idx];
  let d, cm=null;
  if(WL&&WL[4]&&WL[8]){ cm=Math.hypot(WL[4].x-WL[8].x,WL[4].y-WL[8].y,(WL[4].z-WL[8].z))*100;
    // cm を今までの目安（手の大きさ比）に合わせる：2.5cm→.45 / 4cm→.7
    d=cm/5.5; }
  else{ const size=Math.hypot(w.x-mm.x,w.y-mm.y)||.1; d=Math.hypot(tip.x-th.x,tip.y-th.y)/size; }
  // すき間が縮んでいる途中か
  const closing=HT.pd!=null&&d<HT.pd-.015; HT.pd=d;
  let tx=nx*S.W, ty=ny*S.H;
  // つまんでいる間：つまむ直前の位置を起点に、そこからの手の動きだけ反映
  if(HT.pin){
    if(now<HT.lock){ tx=HT.ox; ty=HT.oy; }
    else{ if(HT.rx==null){ HT.rx=tx; HT.ry=ty; } tx=HT.ox+(tx-HT.rx); ty=HT.oy+(ty-HT.ry); }
  }
  // 指を近づけているあいだは、カーソルをほとんど動かさない
  const k=HT.pin?(now<HT.lock?1:.4):(d<.75&&closing)?.12:d<.6?.25:.45;
  HT.sx=HT.sx==null?tx:lerp(HT.sx,tx,k); HT.sy=HT.sy==null?ty:lerp(HT.sy,ty,k);
  HT.close=HT.pin?1:clamp((.95-d)/(.95-.45),0,1);
  // 指が開いていたときの位置を覚えておく（つまんだらそこに戻す）
  if(d>.7&&!HT.pin){ HT.ox=HT.sx; HT.oy=HT.sy; HT.ot=now; }
  { const sz=Math.hypot(w.x-mm.x,w.y-mm.y); let hint='';
    if(sz>.3) hint=L('もう少しはなして','move back'); else if(sz<.07) hint=L('もう少し近づけて','move closer');
    else if(w.x<.06||w.x>.94||w.y>.97||tip.y<.03) hint=L('真ん中へ','center your hand');
    htInfo(cm!=null?cm.toFixed(1)+'cm':d.toFixed(2),hint); htDraw(LM); }
  const frozen=now<(HT.freeze||0);
  if(HT.seen>2&&!frozen){ S.cx=clamp(HT.sx,0,S.W); S.cy=clamp(HT.sy,0,S.H); IN.mouse=false; if(S.pinch) pinchMove(); }
  // つまむ／はなす（ゆるめに判定）
  if(!HT.pin&&d<.45&&g.categoryName!=='Open_Palm'){
    HT.pin=true; HT.lock=now+200; HT.rx=null;
    if(HT.ox==null||now-HT.ot>800){ HT.ox=HT.sx; HT.oy=HT.sy; }
    HT.sx=HT.ox; HT.sy=HT.oy; S.cx=clamp(HT.ox,0,S.W); S.cy=clamp(HT.oy,0,S.H);
    updateHover(); pinchDown(); if(DRAG){ DRAG.hand=true; DRAG.tol=34; }
    AU.tone(1100,.03,'sine',.05); HT.dwellT=0;
  }
  else if(HT.pin&&d>.65){ HT.pin=false; pinchUp(); HT.freeze=now+250; HT.ox=null; }
  // 止めてクリック（オプション）
  if(CFG.dwell&&!HT.pin&&HT.seen>2){
    if(HT.dx==null||Math.hypot(S.cx-HT.dx,S.cy-HT.dy)>16||!HOV){ HT.dx=S.cx; HT.dy=S.cy; HT.dwellT=0; }
    else{ HT.dwellT=(HT.dwellT||0)+(now-(HT.dlast||now)); if(HT.dwellT>1100){ HT.dwellT=-900; pinchDown(); if(DRAG){ DRAG.hand=true; DRAG.tol=34; } pinchUp(); } }
    HT.dlast=now;
  } else { HT.dwellT=0; HT.dlast=now; }
});
// カーソルのまわりに「どれくらいつまめているか」を表示

function canvasApp(body,w,o){
  const W=w.app.w, H=w.app.h-58, K=1.5;
  const c=cv(W*K,H*K); c.dataset.canvas=''; c.style.cssText='width:100%;height:100%;display:block;background:'+(o.bg||'#14161c');
  body.appendChild(c); const g=c.getContext('2d'); g.scale(K,K);
  const st={W,H,hx:null,hy:null,pin:false,t:0};
  c._xr={down(x,y){ st.pin=true; o.down&&o.down(x*W,y*H); }, move(x,y){ o.move&&o.move(x*W,y*H); }, up(){ st.pin=false; o.up&&o.up(); }};
  const tick=dt=>{ if(!c.isConnected) return; st.t+=dt; if(S.hit===c){ const p=localPos(c); st.hx=p.x*W; st.hy=p.y*H; } else st.hx=st.hy=null; try{ o.draw(g,dt,st); }catch(e){ console.error(e); } };
  FRAME.push(tick); const prev=w.onClose; w.onClose=()=>{ prev&&prev(); const i=FRAME.indexOf(tick); if(i>=0) FRAME.splice(i,1); o.close&&o.close(); };
  return {c,g,st};
}

// サイトの置き方：
//   /index.html              … いちばん新しいバージョン

const UPD={base:'',manifest:null,checked:false};

async function fetchManifest(){
  if(location.protocol==='file:') throw new Error(L('ファイルから開いているので確認できません','Opened from a file'));
  const c=new AbortController(); const t=setTimeout(()=>c.abort(),5000);
  try{ const r=await fetch(UPD.base+'versions.json?t='+Date.now(),{cache:'no-store',signal:c.signal}); if(!r.ok) throw new Error('HTTP '+r.status); UPD.manifest=await r.json(); UPD.checked=true; return UPD.manifest; }
  finally{ clearTimeout(t); }
}

  const url=verURL(v)+'?v='+v;
  if(now){ location.replace(url); return; }

}

(async function bootUpdate(){

function frameOK(fr){

  // ほかのものが前に重なっていないか（まん中と4すみで確認）
  const pts=[[.5,.5],[.2,.25],[.8,.25],[.2,.75],[.8,.75]];
  for(const [px,py] of pts){ const x=r.left+r.width*px, y=r.top+r.height*py; if(x<0||y<0||x>S.W||y>S.H) continue;
    const top=document.elementsFromPoint(x,y).find(e=>e.id!=='input'&&e.id!=='hud'&&!e.closest('#pads'));
    if(top!==fr) return null; }

/* ---- サイトの中で移動したら、アドレスバーと「もどる・すすむ」も合わせる ---- */
// ほかのサイトのURLは安全のため読めないので、移動したことだけ分かる。
// もどる・すすむは、ブラウザ本体の履歴を使ってサイトの中で動かす。
const _br14b=APPIMPL.browser;
APPIMPL.browser=(body,w)=>{
  _br14b(body,w);
  const f=body.querySelector('.field'); const [bk,fw]=body.querySelectorAll('.wbtn');
  let fr=null, n=0, fwd=0, expect=0, told=false;
  const host=u=>{ try{ return new URL(u).host; }catch(e){ return u; } };
  const show=()=>{ if(!fr) return; f.set(n>0?host(fr.src)+L(' …（サイト内のページ）',' … (page inside the site)'):fr.src); };
  const hook=()=>{ const x=body.querySelector('iframe'); if(x===fr) return; fr=x; n=0; fwd=0; expect=0; if(!fr) return;
    let first=true;
    fr.addEventListener('load',()=>{ if(first){ first=false; return; }
      if(expect<0){ n--; fwd++; expect=0; } else if(expect>0){ n++; fwd--; expect=0; } else { n++; fwd=0; }
      show();
      if(n===1&&!told){ told=true; toastW(L('サイトの中で移動しました。ほかのサイトのURLは安全のため表示できないので、サイト名だけ出します','Moved inside the site. Only the site name can be shown.')); } }); };
  new MutationObserver(hook).observe(body,{childList:true,subtree:true});
  // サイトを表示しているときの「もどる・すすむ」
  bk.addEventListener('click',e=>{ if(fr&&fr.isConnected&&n>0){ e.stopImmediatePropagation(); expect=-1; history.back(); } },true);
  fw.addEventListener('click',e=>{ if(fr&&fr.isConnected&&fwd>0){ e.stopImmediatePropagation(); expect=1; history.forward(); } },true);
};

/* ================= ライブラリ：並び替え・フォルダ ================= */
// LAYOUT … いちばん上にならべる順番（アプリのid と フォルダのid）
// FOLDERS … { f_xxx: {name, apps:[id…]} }
let LAYOUT=STORE.get('layout',null), FOLDERS=STORE.get('folders',{}), LIBEDIT=false, LIBCTX='top';
const isFold=id=>typeof id==='string'&&id.startsWith('f_');
function libNormalize(){
  const inst=INST.filter(i=>APPS[i]); const instSet=new Set(inst);
  for(const k in FOLDERS){ FOLDERS[k].apps=(FOLDERS[k].apps||[]).filter(i=>instSet.has(i)); }
  const inF=new Set(Object.values(FOLDERS).flatMap(f=>f.apps));
  let top=(LAYOUT||[]).filter(i=>isFold(i)?!!FOLDERS[i]:(instSet.has(i)&&!inF.has(i)));
  const seen=new Set(top); for(const i of inst) if(!seen.has(i)&&!inF.has(i)){ top.push(i); seen.add(i); }
  for(const k in FOLDERS) if(!seen.has(k)) top.push(k);
  LAYOUT=top;
}
function libSave(){ STORE.set('layout',LAYOUT); STORE.set('folders',FOLDERS); }
const listOf=ctx=>ctx==='top'?LAYOUT:(FOLDERS[ctx]?FOLDERS[ctx].apps:[]);
function folderIcon(fid){
  const e=h('div','ic folderIc'); const apps=(FOLDERS[fid]&&FOLDERS[fid].apps||[]).slice(0,4);
  for(const id of apps){ const m=iconEl(id); m.classList.add('mini4'); e.appendChild(m); }
  for(let i=apps.length;i<4;i++) e.appendChild(h('div','mini4 empty'));
  return e;
}
function libTile(id,ctx){
  const fold=isFold(id); const b=h('button','app'+(fold?' fold':'')+(LIBEDIT?' editing':''));
  b.dataset.lid=id; b.dataset.ctx=ctx; if(!fold) b.dataset.app=id;
  const name=fold?FOLDERS[id].name:appName(id);
  b.setAttribute('aria-label',fold?L(`フォルダ「${name}」`,`Folder "${name}"`):name);
  b.appendChild(fold?folderIcon(id):iconEl(id));
  b.appendChild(h('div','lb',(!fold&&APPS[id].pin?IC('pin','pinI'):'')+esc(name)));
  b.onclick=()=>{ if(LIBEDIT) return libSheet(id,ctx); if(fold) openFolder(id); else openApp(id); };
  return b;
}
renderLib=function(){
  libNormalize(); const lib=LIB.el; lib.innerHTML='';
  const ids=LAYOUT; const per=13; const pages=Math.max(1,Math.ceil(ids.length/per)); LIBPAGE=clamp(LIBPAGE,0,pages-1);
  const wrap=h('div',''); wrap.style.cssText='display:flex;align-items:center;gap:18px';
  const prev=h('button','wbtn libPrev',svg('back')); prev.setAttribute('aria-label',L('前のページ','Previous page')); prev.onclick=()=>{ LIBPAGE--; renderLib(); };
  const next=h('button','wbtn libNext',svg('fwd')); next.setAttribute('aria-label',L('次のページ','Next page')); next.onclick=()=>{ LIBPAGE++; renderLib(); };
  const canNext=LIBPAGE<pages-1||(LIBEDIT&&LIBDRAG);
  prev.style.visibility=LIBPAGE>0?'inherit':'hidden'; next.style.visibility=canNext?'inherit':'hidden';
  const grid=h('div',''); grid.style.cssText='display:flex;flex-direction:column;gap:30px;width:1000px;min-height:520px';
  const page=ids.slice(LIBPAGE*per,LIBPAGE*per+per); const pattern=[4,5,4]; let i=0,k=0;
  while(i<page.length){ const n=pattern[k%3]; const row=h('div','libRow'); for(const id of page.slice(i,i+n)) row.appendChild(libTile(id,'top')); grid.appendChild(row); i+=n; k++; }
  wrap.append(prev,grid,next); lib.appendChild(wrap);
  const foot=h('div','row libFoot');
  if(pages>1){ const dots=h('div','row'); dots.style.cssText='justify-content:center;gap:10px'; for(let p=0;p<pages;p++){ const d=h('button',''); d.setAttribute('aria-label',L(`${p+1}ページ目`,`Page ${p+1}`)); d.style.cssText=`width:${p===LIBPAGE?34:12}px;height:12px;border-radius:6px;background:${p===LIBPAGE?'#fff':'rgba(255,255,255,.4)'};transition:width .2s`; d.onclick=()=>{ LIBPAGE=p; renderLib(); }; dots.appendChild(d); } foot.appendChild(dots); }
  if(LIBEDIT){ foot.append(btn(IC('folder-plus')+L('新しいフォルダ','New folder'),()=>newFolder()),btn(IC('check')+L('完了','Done'),()=>setLibEdit(false),'pri'));
    lib.appendChild(foot); lib.appendChild(h('div','libHint',L('アプリをつまんだまま動かすと並び替え。フォルダの上で離すと中に入ります。押すとメニューが出ます。','Pinch and drag to reorder. Drop on a folder to put it inside. Tap for options.'))); }
  else { const eb=h('button','libEditB',IC('pencil')+L('並び替え・フォルダ','Arrange')); eb.onclick=()=>setLibEdit(true); foot.appendChild(eb); lib.appendChild(foot); }
  lib.classList.toggle('editing',LIBEDIT);
};
function setLibEdit(v){ LIBEDIT=v; closeSheet(); renderLib(); if(FOLDV.o&&FOLDV.o.shown) drawFolder(); AU.tone(v?660:520,.06,'sine',.08); }

/* ---- 小さなメニュー（シート） ---- */
const SHEET={o:null};
function sheet(build){ if(!SHEET.o){ SHEET.o=new WO(h('div','mini libSheet'),{yaw:0,y:-40,d:.84,shown:false}); }
  const o=SHEET.o; o.el.innerHTML=''; build(o.el); o.yaw=S.yaw; o.place(); o.show(true); AU.open(); }
function closeSheet(){ if(SHEET.o&&SHEET.o.shown){ SHEET.o.show(false); hideKB(); } }
function sheetHead(el,title){ const r=h('div','row'); r.style.cssText='justify-content:space-between;margin-bottom:14px;flex-wrap:nowrap'; r.appendChild(h('h3','',esc(title))); const x=h('button','wbtn',svg('close')); x.setAttribute('aria-label',L('閉じる','Close')); x.onclick=closeSheet; r.appendChild(x); el.appendChild(r); }
function moveIn(ctx,id,delta){ const a=listOf(ctx); const i=a.indexOf(id); const j=clamp(i+delta,0,a.length-1); if(i<0||i===j) return; a.splice(i,1); a.splice(j,0,id); libSave(); renderLib(); drawFolder(); }
function libSheet(id,ctx){
  const fold=isFold(id);
  sheet(el=>{ sheetHead(el,fold?FOLDERS[id].name:appName(id)); const col=h('div','sheetCol'); el.appendChild(col);
    const mv=h('div','row'); mv.style.cssText='gap:8px;flex-wrap:nowrap'; mv.append(btn(IC('chevron-left')+L('前へ','Earlier'),()=>moveIn(ctx,id,-1)),btn(L('後ろへ','Later')+IC('chevron-right'),()=>moveIn(ctx,id,1))); col.appendChild(mv);
    if(fold){
      col.appendChild(btn(IC('square-pen')+L('名前を変える','Rename'),()=>renameFolder(id)));
      col.appendChild(btn(IC('trash-2')+L('フォルダを削除（中のアプリは外に出ます）','Delete folder (apps move out)'),()=>{ deleteFolder(id); closeSheet(); }));
    } else {
      if(ctx!=='top') col.appendChild(btn(IC('log-out')+L('フォルダから出す','Move out of folder'),()=>{ moveToFolder(id,'top'); closeSheet(); }));
      const fl=Object.keys(FOLDERS).filter(f=>f!==ctx);
      if(fl.length){ col.appendChild(h('div','sub',L('フォルダに入れる','Move to folder'))); const r=h('div','row'); r.style.cssText='gap:8px;flex-wrap:wrap'; for(const f of fl) r.appendChild(btn(IC('folder')+esc(FOLDERS[f].name),()=>{ moveToFolder(id,f); closeSheet(); })); col.appendChild(r); }
      col.appendChild(btn(IC('folder-plus')+L('新しいフォルダを作って入れる','New folder with this app'),()=>{ newFolder([id]); }));
      if(!APPS[id].core) col.appendChild(btn(IC('trash-2')+L('ライブラリから削除','Remove from library'),()=>{ removeApp(id); closeSheet(); }));
      else col.appendChild(h('div','sub',L('このアプリは削除できません','This app cannot be removed')));
    }
  });
}
function moveToFolder(id,f){
  for(const k in FOLDERS){ const a=FOLDERS[k].apps; const i=a.indexOf(id); if(i>=0) a.splice(i,1); }
  const ti=LAYOUT.indexOf(id); if(ti>=0) LAYOUT.splice(ti,1);
  if(f==='top'){ const fi=FOLDV.id?LAYOUT.indexOf(FOLDV.id):-1; LAYOUT.splice(fi>=0?fi+1:LAYOUT.length,0,id); }
  else FOLDERS[f].apps.push(id);
  libSave(); renderLib(); drawFolder(); AU.tone(700,.06,'sine',.08);
}
function newFolder(apps=[]){
  const fid='f_'+Date.now().toString(36); const n=Object.keys(FOLDERS).length+1;
  FOLDERS[fid]={name:L(`フォルダ${n}`,`Folder ${n}`),apps:[]};
  // 最初のアプリがあった場所に置く
  let pos=Math.min(LAYOUT.length,LIBPAGE*13+12); if(apps.length){ const i=LAYOUT.indexOf(apps[0]); if(i>=0) pos=i; }
  LAYOUT.splice(pos,0,fid); for(const a of apps) moveToFolder(a,fid);
  libSave(); renderLib(); renameFolder(fid,true);
}
function renameFolder(fid,isNew){
  sheet(el=>{ sheetHead(el,isNew?L('フォルダを作りました','Folder created'):L('名前を変える','Rename folder'));
    el.appendChild(h('p','sub',L('フォルダの名前','Folder name')));
    const f=inputField({o:SHEET.o},L('フォルダの名前','Folder name'),{value:FOLDERS[fid].name,enter:L('決定','OK'),onEnter:t=>{ save(t); }}); f.style.cssText+=';width:100%;margin:8px 0 12px';
    const save=t=>{ t=String(t||'').trim().slice(0,16); if(t){ FOLDERS[fid].name=t; libSave(); renderLib(); drawFolder(); } hideKB(); closeSheet(); };
    el.append(f,btn(IC('check')+L('決定','Save'),()=>save(f.get()),'pri'));
    setTimeout(()=>f.click(),60);
  });
}
function deleteFolder(fid){ const pos=LAYOUT.indexOf(fid); const apps=FOLDERS[fid]?FOLDERS[fid].apps:[]; delete FOLDERS[fid]; if(pos>=0){ LAYOUT.splice(pos,1,...apps); } if(FOLDV.id===fid) closeFolder(); libSave(); renderLib(); toastW(L('フォルダを削除しました','Folder deleted')); }
function removeApp(id){
  if(id.startsWith('my_')&&typeof myRemove==='function'){ myRemove(id); }
