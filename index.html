<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1b1a19">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Home XR OS</title>
<style>
:root{
  --glass:rgba(30,30,34,.95); --glass2:rgba(52,52,58,.92); --line:rgba(255,255,255,.1);
  --tx:#f4f4f6; --tx2:rgba(244,244,246,.62); --acc:#4c8dff; --acc2:#7aa9ff; --ok:#3ecf8e; --ng:#ff6b6b;
  --font:system-ui,-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:#141312;color:var(--tx);font-family:var(--font);-webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

/* ===== 3D空間 ===== */
#pass{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;display:none}
body.passthru #pass{display:block}
#vp,.vp{position:fixed;inset:0;overflow:hidden;perspective-origin:50% 50%}
.cam{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
#dimmer{position:fixed;inset:0;background:#000;opacity:.15;pointer-events:none;transition:opacity .4s}
body.passthru #dimmer{opacity:0!important}
#env,#world{position:absolute;left:0;top:0;transform-style:preserve-3d}
body.passthru #vpE{display:none}
.strip{position:absolute;left:0;top:0;transform-origin:0 0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background-repeat:no-repeat}
.wo{position:absolute;left:0;top:0;width:max-content;transform-origin:0 0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.wo.off{visibility:hidden}

/* ===== ライブラリ ===== */
.lib{width:1080px;padding:20px 10px;display:flex;flex-direction:column;align-items:center;gap:34px;transition:opacity .25s}
.libRow{display:flex;gap:56px;justify-content:center}
.app{width:132px;display:flex;flex-direction:column;align-items:center;gap:12px;border-radius:26px;padding:8px 0;transition:transform .18s}
.app .ic{width:96px;height:96px}
.app .lb{font-size:17px;font-weight:600;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.6);white-space:nowrap;display:flex;gap:4px;align-items:center}
.app .lb i{font-style:normal;font-size:13px;opacity:.9}
.app.hov{transform:translateY(-6px) scale(1.07)}
.app.hov .ic{box-shadow:0 14px 30px rgba(0,0,0,.45),0 0 0 4px rgba(255,255,255,.85)}
.ic{border-radius:24px;display:grid;place-items:center;box-shadow:0 8px 22px rgba(0,0,0,.35);position:relative;overflow:hidden}
.ic::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(160deg,rgba(255,255,255,.28),rgba(255,255,255,0) 45%)}
.ic svg{width:56%;height:56%;position:relative;z-index:1}
.ic.big svg{width:100%;height:100%}

.clock{font-size:26px;font-weight:600;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.6);letter-spacing:.02em;white-space:nowrap}
.leftbar{display:flex;flex-direction:column;gap:30px;padding:10px}
.lbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;opacity:.8;transition:transform .15s,background .15s}
.lbtn svg{width:24px;height:24px}
.lbtn.hov{background:rgba(255,255,255,.18);opacity:1;transform:scale(1.15)}

/* ===== ドック ===== */
.dock{display:flex;align-items:center;gap:6px;background:rgba(28,28,30,.82);border-radius:40px;padding:10px 16px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.dbtn{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:#fff;transition:transform .15s,background .15s;position:relative}
.dbtn svg{width:26px;height:26px}
.dbtn.on{background:#fff;color:#222}
.dbtn.hov{background:rgba(255,255,255,.2);transform:scale(1.12)}
.dbtn.on.hov{background:#fff}
.dbtn .badge{position:absolute;top:8px;right:8px;width:10px;height:10px;border-radius:50%;background:#ff4f5e;box-shadow:0 0 0 2px rgba(28,28,30,1)}
.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#ffd1a6,#ff8fa3);display:grid;place-items:center;font-weight:800;color:#5a2a35;font-size:18px}
.sep{width:2px;height:28px;background:rgba(255,255,255,.22);border-radius:2px;margin:0 8px}

/* ===== ウィンドウ ===== */
.win{display:flex;flex-direction:column;align-items:center;gap:14px}
.winBox{background:var(--glass);border-radius:30px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.45);border:1px solid var(--line);display:flex;flex-direction:column;position:relative}
.winTitle{height:58px;flex:none;display:flex;align-items:center;gap:12px;padding:0 22px;font-weight:700;font-size:20px;border-bottom:1px solid var(--line)}
.winTitle .ic{width:34px;height:34px;border-radius:10px}
.winTitle .sp{flex:1}
.winBody{flex:1;min-height:0;position:relative;overflow:hidden}
.winBar{display:flex;align-items:center;gap:14px}
.grab{width:180px;height:14px;border-radius:10px;background:rgba(255,255,255,.55);transition:background .15s,transform .15s}
.grab.hov,.grab.drag{background:#fff;transform:scaleY(1.4)}
.wbtn{width:44px;height:44px;border-radius:50%;background:rgba(40,40,44,.85);display:grid;place-items:center;font-size:18px;color:#fff;transition:transform .15s,background .15s}
.wbtn.hov{background:rgba(255,255,255,.25);transform:scale(1.12)}
.win.theater .winBox{box-shadow:0 0 120px rgba(80,140,255,.25)}

/* 共通部品 */
.scroll{overflow:hidden;height:100%}
.pad{padding:22px}
.btn{padding:12px 20px;border-radius:999px;background:rgba(255,255,255,.12);font-weight:700;font-size:17px;transition:background .15s,transform .15s;white-space:nowrap}
.btn.pri{background:var(--acc);color:#fff}
.btn.hov{background:rgba(255,255,255,.24);transform:scale(1.04)}
.btn.pri.hov{background:var(--acc2)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.card{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:20px;padding:16px;transition:background .15s,transform .15s}
.card.hov{background:rgba(255,255,255,.12)}
h3{font-size:22px;font-weight:800;margin-bottom:12px}
.sub{color:var(--tx2);font-size:15px}
.hov-l.hov{background:rgba(255,255,255,.1)}
.slider{height:34px;display:flex;align-items:center;position:relative;cursor:pointer}
.slider .tr{position:absolute;left:0;right:0;height:8px;border-radius:8px;background:rgba(255,255,255,.18)}
.slider .fi{position:absolute;left:0;height:8px;border-radius:8px;background:#fff}
.slider .kn{position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;transform:translateX(-50%);box-shadow:0 2px 8px rgba(0,0,0,.4);transition:transform .12s}
.slider.hov .kn,.slider.drag .kn{transform:translateX(-50%) scale(1.25)}
.toggle{width:58px;height:34px;border-radius:999px;background:rgba(255,255,255,.2);position:relative;transition:background .2s;flex:none}
.toggle::after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .2s}
.toggle.on{background:var(--acc)}
.toggle.on::after{left:28px}
.toggle.hov{box-shadow:0 0 0 3px rgba(255,255,255,.35)}
.seg{display:flex;background:rgba(255,255,255,.08);border-radius:999px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{padding:10px 16px;border-radius:999px;font-weight:700;font-size:16px;color:var(--tx2)}
.seg button.on{background:#fff;color:#222}
.seg button.hov:not(.on){background:rgba(255,255,255,.14);color:#fff}
.field{background:rgba(255,255,255,.1);border-radius:16px;padding:12px 16px;font-size:18px;min-height:48px;display:flex;align-items:center;gap:8px;border:2px solid transparent}
.field.focus{border-color:var(--acc)}
.field .ph{color:var(--tx2)}
.field .caret{width:2px;height:22px;background:#fff;animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}

/* 小さなパネル（クイック設定・通知など） */
.mini{width:520px;background:var(--glass);border-radius:28px;padding:22px;border:1px solid var(--line);box-shadow:0 24px 60px rgba(0,0,0,.45)}
.mini h4{font-size:20px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.mini h4 .sp{flex:1}
.qrow{display:flex;align-items:center;gap:14px;padding:10px 0}
.qrow .lb{flex:1;font-weight:700;font-size:17px}
.noti{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:16px}
.noti .ic{width:40px;height:40px;border-radius:12px;flex:none}
.noti b{display:block;font-size:16px}.noti span{font-size:14px;color:var(--tx2)}

/* キーボード */
.kb{background:rgba(24,24,28,.94);border-radius:26px;padding:16px;display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);box-shadow:0 24px 60px rgba(0,0,0,.5)}
.kbr{display:flex;gap:8px;justify-content:center}
.key{min-width:56px;height:56px;padding:0 10px;border-radius:14px;background:rgba(255,255,255,.12);font-size:22px;font-weight:600;display:grid;place-items:center;transition:background .1s,transform .1s}
.key.hov{background:rgba(255,255,255,.28);transform:scale(1.08)}
.key.w{min-width:120px;font-size:17px}.key.xw{min-width:300px;font-size:17px}
.key.pri{background:var(--acc)}

.tgt.boom{opacity:0!important;filter:brightness(2.5)}
.toastW{background:rgba(30,30,34,.94);border-radius:999px;padding:14px 24px;font-size:18px;font-weight:700;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.4);transition:opacity .3s}

/* ===== 画面上の操作 ===== */
#input{position:fixed;inset:0;z-index:5;touch-action:none}
#hud{position:fixed;inset:0;width:100%;height:100%;z-index:6;pointer-events:none}
#pads{position:fixed;inset:0;z-index:7;pointer-events:none}
body.nopad #pads{display:none}
.stick{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 26px);width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.25);pointer-events:auto;touch-action:none;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.stick .nub{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:0 4px 14px rgba(0,0,0,.35)}
.stick small{position:absolute;left:0;right:0;top:-24px;text-align:center;font-size:12px;font-weight:700;color:rgba(255,255,255,.75);text-shadow:0 1px 4px rgba(0,0,0,.8)}
#stickL{left:calc(env(safe-area-inset-left) + 26px)}
#stickR{right:calc(env(safe-area-inset-right) + 26px)}
.pbtn{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.3);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);text-shadow:0 1px 4px rgba(0,0,0,.6)}
#pinchBtn{right:calc(env(safe-area-inset-right) + 196px);bottom:calc(env(safe-area-inset-bottom) + 40px);width:110px;height:110px;font-size:17px}
#pinchBtn.on{background:rgba(76,141,255,.75);border-color:#fff}
#homeBtn2{right:calc(env(safe-area-inset-right) + 206px);bottom:calc(env(safe-area-inset-bottom) + 164px);width:62px;height:62px;font-size:13px}
#backBtn2{left:calc(env(safe-area-inset-left) + 196px);bottom:calc(env(safe-area-inset-bottom) + 40px);width:62px;height:62px;font-size:13px}
#centerBtn2{left:calc(env(safe-area-inset-left) + 196px);bottom:calc(env(safe-area-inset-bottom) + 112px);width:62px;height:62px;font-size:12px}

@media (max-width:600px){
  .stick{width:112px;height:112px;bottom:calc(env(safe-area-inset-bottom) + 18px)}
  .stick .nub{width:48px;height:48px;margin:-24px 0 0 -24px}
  #stickL{left:14px}#stickR{right:14px}
  #pinchBtn{width:84px;height:84px;right:22px;bottom:calc(env(safe-area-inset-bottom) + 150px);font-size:14px}
  #homeBtn2{right:120px;bottom:calc(env(safe-area-inset-bottom) + 30px);width:50px;height:50px;font-size:11px}
  #backBtn2{left:136px;bottom:calc(env(safe-area-inset-bottom) + 30px);width:50px;height:50px;font-size:11px}
  #centerBtn2{left:136px;bottom:calc(env(safe-area-inset-bottom) + 90px);width:50px;height:50px;font-size:10px}
}
#handCam{position:fixed;left:14px;top:14px;width:160px;border-radius:14px;transform:scaleX(-1);z-index:8;opacity:.8;display:none;border:2px solid rgba(255,255,255,.4)}
body.hands #handCam{display:block}
#handCam.seen{border-color:#3ecf8e;box-shadow:0 0 0 3px rgba(62,207,142,.5)}
#palmBtn2{right:calc(env(safe-area-inset-right) + 322px);bottom:calc(env(safe-area-inset-bottom) + 164px);width:62px;height:62px;font-size:26px}
body.onehand #stickR{display:none}
body.onehand #stickL{left:auto;right:calc(env(safe-area-inset-right) + 26px)}
body.onehand #backBtn2{left:auto;right:calc(env(safe-area-inset-right) + 322px);bottom:calc(env(safe-area-inset-bottom) + 40px)}
body.onehand #centerBtn2{left:auto;right:calc(env(safe-area-inset-right) + 322px);bottom:calc(env(safe-area-inset-bottom) + 100px)}
body.onehand #stickL small::after{content:"（端で見回す）"}
.palm{width:600px}
body.reduce *,body.reduce *::before,body.reduce *::after{transition:none!important;animation:none!important}
body.reduce .app.hov{transform:none}
/* スタート画面 */
.start{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(120% 90% at 50% 10%,#3a3836 0%,#1d1c1b 70%);padding:24px;transition:opacity .5s}
.start.hide{opacity:0;pointer-events:none}
.sCard{max-width:620px;text-align:center}
.sCard h1{font-size:40px;font-weight:800;letter-spacing:.02em;margin:14px 0 8px}
.sCard p{color:var(--tx2);line-height:1.7;margin-bottom:22px}
.sGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:0 0 26px;text-align:left}
.sGrid div{background:rgba(255,255,255,.07);border-radius:16px;padding:12px 14px;font-size:14px;line-height:1.6;color:var(--tx2)}
.sGrid b{color:#fff;display:block;font-size:15px;margin-bottom:2px}
.sBtn{font-size:20px;font-weight:800;background:#fff;color:#1d1c1b;border-radius:999px;padding:16px 46px}
.goggle{width:88px;height:88px;margin:0 auto;border-radius:28px;background:linear-gradient(135deg,#6f8cff,#b06bff);display:grid;place-items:center;box-shadow:0 14px 40px rgba(111,140,255,.4)}
.ver{display:block;margin-top:14px;font-size:13px;color:var(--tx2)}
</style>
</head>
<body>
<video id="pass" playsinline muted autoplay></video>
<video id="handCam" playsinline muted autoplay aria-hidden="true"></video>
<div id="vpE" class="vp"><div id="camE" class="cam"><div id="env"></div></div></div>
<div id="dimmer"></div>
<div id="vp" class="vp"><div id="cam" class="cam"><div id="world"></div></div></div>
<div id="input"></div>
<canvas id="hud"></canvas>
<div id="pads">
  <div class="stick" id="stickL"><small>カーソル</small><div class="nub"></div></div>
  <div class="stick" id="stickR"><small>見回す</small><div class="nub"></div></div>
  <div class="pbtn" id="pinchBtn">つまむ</div>
  <div class="pbtn" id="homeBtn2">ホーム</div>
  <div class="pbtn" id="backBtn2">もどる</div>
  <div class="pbtn" id="centerBtn2">正面に</div>
  <div class="pbtn" id="palmBtn2" aria-label="手のひらメニュー">✋</div>
</div>
<div class="start" id="start">
  <div class="sCard">
    <div class="goggle"><svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"><path d="M3 9.5C3 8 4.2 7 5.7 7h12.6C19.8 7 21 8 21 9.5v4.2c0 1.6-1.3 2.8-2.9 2.8h-2.2c-1 0-1.9-.6-2.3-1.5l-.3-.7a1.4 1.4 0 0 0-2.6 0l-.3.7c-.4.9-1.3 1.5-2.3 1.5H5.9C4.3 16.5 3 15.3 3 13.7Z"/></svg></div>
    <h1 id="wTitle">ようこそ</h1>
    <p id="wSub">Home XR OS へようこそ。</p>
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
      <button class="sBtn" id="startBtn">操作の説明を見る</button>
      <button class="sBtn" id="startBtn2" style="background:rgba(255,255,255,.14);color:#fff">説明なしではじめる</button>
    </div>
    <span class="ver" id="ver"></span>
  </div>
</div>
<script>
'use strict';
const APP_VERSION='3.1.5';
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, rad=d=>d*Math.PI/180, deg=r=>r*180/Math.PI;
const angDiff=(a,b)=>{const d=a-b; if(!isFinite(d)) return 0; return ((d%360)+540)%360-180;};
const STORE={get(k,d){try{const v=localStorage.getItem('xr_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('xr_'+k,JSON.stringify(v))}catch(e){}}};
const DEFCFG={env:'living',dim:.15,cur:1,look:1,pad:true,hand:true,vol:.6,gyro:false,sound:true};
let CFG={...DEFCFG,...STORE.get('cfg',{})};
const saveCfg=()=>STORE.set('cfg',CFG);
const h=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ================= 視点と空間 ================= */
const S={yaw:0,pitch:0,vyaw:0,vpitch:0,P:900,DB:1200,W:0,H:0,cx:0,cy:0,pinch:false,t:0,dt:0,lookT:0};
const vp=$('vp'), cam=$('cam'), envEl=$('env'), world=$('world'), vpE=$('vpE'), camE=$('camE');
function resize(){
  S.W=innerWidth; S.H=innerHeight;
  S.P=Math.round(Math.max(S.W,S.H)*.6);
  // 1000px のパネルが画面のおよそ72%に見える距離
  S.DB=S.P*1000/(.72*Math.min(S.W,S.H*1.55));
  vp.style.perspective=vpE.style.perspective=S.P+'px';
  if(!S.cx){S.cx=S.W/2;S.cy=S.H/2}
  S.cx=clamp(S.cx,0,S.W); S.cy=clamp(S.cy,0,S.H);
  hud.width=Math.round(S.W*DPR()); hud.height=Math.round(S.H*DPR());
  buildEnv(); WOS.forEach(o=>o.place());
}
const DPR=()=>Math.min(2,window.devicePixelRatio||1);
function applyCam(){
  cam.style.transform=camE.style.transform=`translateZ(${S.P}px) rotateX(${S.pitch}deg) rotateY(${S.yaw}deg)`;
  // うしろのものは描かない
  const lim=deg(Math.atan(S.W/2/S.P))+24; for(const s of STRIPS){ const off=Math.abs(angDiff(s.a,S.yaw))>lim; if(off!==s.off){s.off=s.off=off; for(const e of s.el) e.style.visibility=off?'hidden':'visible'} }
  for(const o of WOS){ const off=!o.shown||Math.abs(angDiff(o.yaw,S.yaw))>lim+10; if(off!==o.off){o.off=off; o.el.classList.toggle('off',off)} }
}
/* 空間に浮かぶもの */
const WOS=[];
class WO{
  constructor(el,{yaw=0,y=0,d=1,s=1,shown=true}={}){
    this.el=el; el.classList.add('wo'); this.yaw=yaw; this.y=y; this.d=d; this.s=s; this.shown=shown; this.off=null;
    world.appendChild(el); WOS.push(this); this.place();
  }
  place(){ this.el.style.transform=`rotateY(${-this.yaw}deg) translateZ(${-this.d*S.DB}px) translateY(${this.y}px) scale(${this.s}) translate(-50%,-50%)`; }
  show(v=true){ this.shown=v; this.off=null; applyCam(); }
  remove(){ const i=WOS.indexOf(this); if(i>=0)WOS.splice(i,1); this.el.remove(); }
}
// パネルの幅（px）を角度にする
const pxToDeg=(px,d=1)=>deg(Math.atan(px/(d*S.DB)));

/* ================= 背景（パノラマ） ================= */
let STRIPS=[], PANO={tiles:null,env:null};
const NSTRIP=48, NROW=4, VANG=52;
function buildEnv(){
  envEl.innerHTML=''; STRIPS=[];
  const R=S.DB*2.6, circ=TAU*R, sw=circ/NSTRIP, Hh=2*R*Math.tan(rad(VANG)), rh=Hh/NROW;
  if(PANO.env!==CFG.env||!PANO.tiles) paintPano();
  for(let i=0;i<NSTRIP;i++){
    const th=-180+(i+.5)*360/NSTRIP; const col=[];
    for(let k=0;k<NROW;k++){
      const el=PANO.tiles[i][k]; el.className='strip';

function stick(el,vec){
  const nub=el.querySelector('.nub'); let id=null;
  const set=e=>{ const r=el.getBoundingClientRect(); let x=(e.clientX-r.left-r.width/2)/(r.width/2), y=(e.clientY-r.top-r.height/2)/(r.height/2); const m=Math.hypot(x,y); if(m>1){x/=m;y/=m} vec.x=x; vec.y=y; nub.style.transform=`translate(${x*44}px,${y*44}px)`; };
  el.addEventListener('pointerdown',e=>{ id=e.pointerId; el.setPointerCapture(id); set(e); AU.init(); });
  el.addEventListener('pointermove',e=>{ if(e.pointerId===id) set(e); });
  const end=e=>{ if(e.pointerId!==id) return; id=null; vec.x=vec.y=0; nub.style.transform=''; };
  el.addEventListener('pointerup',end); el.addEventListener('pointercancel',end);
}

// ジャイロで見回す
let GY=null;
async function setGyro(on){
  CFG.gyro=on; saveCfg();
  if(on){ try{ if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission){ const r=await DeviceOrientationEvent.requestPermission(); if(r!=='granted'){ CFG.gyro=false; toastW('ジャイロが許可されませんでした'); return; } } }catch(e){ CFG.gyro=false; return; }
    GY={ref:null,base:{yaw:S.yaw,pitch:S.pitch}}; addEventListener('deviceorientation',onGyro); toastW('端末を動かして見回せます'); }
  else{ removeEventListener('deviceorientation',onGyro); GY=null; }
}
function onGyro(e){
  if(!GY||e.alpha==null||e.beta==null||!isFinite(e.alpha)||!isFinite(e.beta)) return;
  const a=rad(e.alpha),b=rad(e.beta),g=rad(isFinite(e.gamma)?e.gamma:0); const ca=Math.cos(a),sa=Math.sin(a),cb=Math.cos(b),sb=Math.sin(b),cg=Math.cos(g),sg=Math.sin(g);
  const fx=-(ca*sg+sa*sb*cg), fy=-(sa*sg-ca*sb*cg), fz=-(cb*cg);
  const yaw=deg(Math.atan2(fx,fy)), pitch=deg(Math.asin(clamp(fz,-1,1)));
  if(!isFinite(yaw)||!isFinite(pitch)) return;
  if(!GY.ref){ GY.ref={yaw,pitch}; GY.base={yaw:S.yaw,pitch:S.pitch}; }
  GY.yaw=GY.base.yaw+angDiff(yaw,GY.ref.yaw); GY.pitch=clamp(GY.base.pitch+(pitch-GY.ref.pitch),-28,28);
}

function pollInput(dt){
  // ゲームパッド
  const gps=navigator.getGamepads?navigator.getGamepads():[]; let gp=null; for(const g of gps) if(g){gp=g;break}
  let lx=IN.L.x, ly=IN.L.y, rx=IN.R.x, ry=IN.R.y;
  const k=c=>IN.keys.has(c)?1:0;
  lx+=k('KeyD')-k('KeyA'); ly+=k('KeyS')-k('KeyW'); rx+=k('ArrowRight')-k('ArrowLeft'); ry+=k('ArrowDown')-k('ArrowUp');
  if(gp){ const dz=v=>Math.abs(v)<.15?0:v; lx+=dz(gp.axes[0]||0); ly+=dz(gp.axes[1]||0); rx+=dz(gp.axes[2]||0); ry+=dz(gp.axes[3]||0);
    const b=i=>gp.buttons[i]&&gp.buttons[i].pressed, was=i=>IN.gpPrev[i];
    const pin=b(0)||b(7)||b(5);
    if(pin&&!IN.gpPin){ AU.init(); IN.mouse=false; pinchDown(); } if(!pin&&IN.gpPin) pinchUp(); IN.gpPin=pin;
    if(b(1)&&!was(1)) goBack(); if(b(3)&&!was(3)) goHome(); if(b(2)&&!was(2)) recenter(); if(b(9)&&!was(9)) goHome();
    IN.gpPrev=gp.buttons.map(x=>x.pressed);
  }
  if(lx||ly){ IN.mouse=false; const sp=820*CFG.cur*(Math.min(S.W,S.H)/800); const m=Math.min(1,Math.hypot(lx,ly)); const cur=Math.pow(m,1.6)/Math.max(m,1e-6);
    S.cx=clamp(S.cx+lx*cur*sp*dt,0,S.W); S.cy=clamp(S.cy+ly*cur*sp*dt,0,S.H); if(S.pinch) pinchMove(); }
  if(rx||ry){ S.yaw+=rx*95*CFG.look*dt; S.pitch=clamp(S.pitch-ry*70*CFG.look*dt,-28,28); }
  if(GY&&isFinite(GY.yaw)&&isFinite(GY.pitch)){ S.yaw=lerp(S.yaw,S.yaw+angDiff(GY.yaw,S.yaw),.25); S.pitch=lerp(S.pitch,GY.pitch,.25); }
  if(!isFinite(S.yaw)) S.yaw=0; if(!isFinite(S.pitch)) S.pitch=0; if(Math.abs(S.yaw)>1e5) S.yaw=angDiff(S.yaw,0);
  if(!isFinite(S.cx)||!isFinite(S.cy)){ S.cx=S.W/2; S.cy=S.H/2; }
  if(S.recenterT){ const t=Math.min(1,(S.t-S.recenterT.t0)/.35), e=t*t*(3-2*t); S.yaw=S.recenterT.y0+angDiff(S.recenterT.to,S.recenterT.y0)*e; S.pitch=S.recenterT.p0*(1-e); if(t>=1) S.recenterT=null; }
}
function turnTo(yaw){ S.recenterT={t0:S.t,y0:S.yaw,p0:S.pitch,to:yaw}; if(GY){GY.ref=null;} }

/* ================= カーソル・レイ・手 ================= */
let ringR=12;
function drawHud(){
  const d=DPR(); hx.setTransform(d,0,0,d,0,0); hx.clearRect(0,0,S.W,S.H);
  for(const f of HUDHOOK) try{ f(hx); }catch(e){}
  const x=S.cx, y=S.cy, hov=!!HOV, pin=S.pinch;
  const tgt=pin?8:hov?17:12; ringR=lerp(ringR,tgt,.35);
  // 手の位置（右下）
  const hxp=S.W*.74+(x-S.W/2)*.18, hyp=S.H+30+(y-S.H/2)*.08;
  const tipX=hxp-34, tipY=hyp-150;
  if(CFG.hand){
    const g=hx.createLinearGradient(tipX,tipY,x,y); g.addColorStop(0,'rgba(255,255,255,.0)'); g.addColorStop(.2,'rgba(255,255,255,.28)'); g.addColorStop(1,'rgba(255,255,255,.55)');
    hx.strokeStyle=g; hx.lineWidth=2.4; hx.beginPath(); hx.moveTo(tipX,tipY); hx.lineTo(x,y); hx.stroke();
    drawHand(hxp,hyp,Math.atan2(y-tipY,x-tipX)+Math.PI/2,pin);
  }
  hx.beginPath(); hx.arc(x,y,ringR,0,TAU); hx.lineWidth=3; hx.strokeStyle='rgba(255,255,255,.95)'; hx.shadowColor='rgba(0,0,0,.5)'; hx.shadowBlur=6; hx.stroke(); hx.shadowBlur=0;
  if(hov||pin){ hx.fillStyle=pin?'rgba(255,255,255,.9)':'rgba(255,255,255,.28)'; hx.beginPath(); hx.arc(x,y,ringR-(pin?0:4),0,TAU); hx.fill(); }
}
function drawHand(x,y,ang,pin){
  hx.save(); hx.translate(x,y); hx.rotate(ang*.35-.25); hx.globalAlpha=.55;
  hx.fillStyle='rgba(235,240,255,.55)'; hx.strokeStyle='rgba(255,255,255,.9)'; hx.lineWidth=2;
  const cap=(x1,y1,x2,y2,w)=>{ hx.lineCap='round'; hx.lineWidth=w; hx.strokeStyle='rgba(225,232,255,.6)'; hx.beginPath(); hx.moveTo(x1,y1); hx.lineTo(x2,y2); hx.stroke(); hx.lineWidth=2; };
  // てのひら
  hx.beginPath(); hx.ellipse(10,-30,62,72,0,0,TAU); hx.fill(); hx.stroke();
  const p=pin?1:0;
  cap(-30,-70,-44,-150+30*p,24);      // 人さし指
  cap(-44,-150+30*p,-40+18*p,-186+46*p,20);
  cap(-62,-10,-74-6*p,-74+4*p,26);     // おや指
  cap(-74-6*p,-74+4*p,-60+20*p,-118+22*p,22);
  cap(4,-92,4,-168,24); cap(36,-86,40,-154,22); cap(62,-66,72,-122,20);
  hx.restore();
}

/* ================= ループ ================= */
let lastT=performance.now()/1000;
const FRAME=[];
function loop(){
  const t=performance.now()/1000; S.dt=Math.min(.05,t-lastT); lastT=t; S.t=t;
  try{ pollInput(S.dt); applyCam(); updateHover(); for(const f of FRAME) f(S.dt); drawHud(); }catch(e){ console.error(e); }
  requestAnimationFrame(loop);
}

// ---------- ミュージック ----------
const SONGS=[{t:'あさのひかり',bpm:96,ch:[[60,64,67],[57,60,64],[53,57,60],[55,59,62]],col:'#ffd166'},{t:'よるのドライブ',bpm:110,ch:[[57,60,64],[53,57,60],[60,64,67],[55,59,62]],col:'#8b93ff'},{t:'うみのさんぽ',bpm:84,ch:[[62,66,69],[59,62,66],[55,59,62],[57,61,64]],col:'#5ad1ff'},{t:'うちゅうのゆめ',bpm:72,ch:[[52,55,59],[48,52,55],[53,57,60],[50,53,57]],col:'#e58bff'}];
const mtof=m=>440*Math.pow(2,(m-69)/12);
APPIMPL.music=(body,w)=>{
  body.style.cssText+=';display:flex;flex-direction:column;padding:22px;gap:16px';
  const top=h('div','row'); const art=cv(220,220); art.style.cssText='width:180px;border-radius:24px'; const ti=h('div',''); ti.style.flex='1'; top.append(art,ti);
  const vis=cv(820,140); vis.style.cssText='width:100%;height:110px'; const ctl=h('div','row'); ctl.style.justifyContent='center';
  const prev=h('button','wbtn',svg('back')), pp=h('button','wbtn',svg('play')), next=h('button','wbtn',svg('fwd')); pp.style.cssText='width:64px;height:64px'; ctl.append(prev,pp,next);
  const list=h('div','row'); list.style.gap='8px'; body.append(top,vis,ctl,list);
  const M={i:0,play:false,step:0,next:0,bars:new Array(32).fill(0)};
  const sel=i=>{ M.i=(i+SONGS.length)%SONGS.length; const s=SONGS[M.i]; const g=art.getContext('2d'); scene(g,220,220,M.i*3+1,M.i%2?'night':''); ti.innerHTML=`<div class="sub">プレイリスト ・ ジェネレート音楽</div><b style="font-size:30px">${s.t}</b><div class="sub">Home XR OSのオリジナル曲</div>`; list.querySelectorAll('.btn').forEach((b,k)=>b.classList.toggle('pri',k===M.i)); M.step=0; };
  SONGS.forEach((s,i)=>{ const b=h('button','btn',s.t); b.onclick=()=>{ sel(i); setP(true); }; list.appendChild(b); });
  const setP=p=>{ M.play=p; pp.innerHTML=svg(p?'pause':'play'); M.next=AU.ctx?AU.ctx.currentTime+.05:0; };
  pp.onclick=()=>{ AU.init(); setP(!M.play); }; prev.onclick=()=>sel(M.i-1); next.onclick=()=>sel(M.i+1);
  const note=(m,t,d,type,v)=>{ const c=AU.ctx; const o=c.createOscillator(), g=c.createGain(); o.type=type; o.frequency.value=mtof(m); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g); g.connect(AU.master); o.start(t); o.stop(t+d+.05); };
  const tick=dt=>{ if(!body.isConnected) return; const s=SONGS[M.i];
    if(M.play&&AU.ctx){ const c=AU.ctx, spb=60/s.bpm/2; while(M.next<c.currentTime+.15){ const st=M.step, chord=s.ch[Math.floor(st/8)%4];
      if(st%8===0) chord.forEach(m=>note(m-12,M.next,spb*7,'triangle',.05));
      if(st%2===0) note(chord[(st/2)%3]+12,M.next,spb*1.6,'sine',.07);
      if(st%4===0){ note(chord[0]-24,M.next,spb*1.5,'sine',.12); }
      M.bars=M.bars.map((b,k)=>Math.max(b,(Math.random()*.6+.4)*(k%((st%4)+3)===0?1:.5)));
      M.step++; M.next+=spb; } }
    const g=vis.getContext('2d'); g.clearRect(0,0,820,140); M.bars=M.bars.map(b=>b*(M.play?.92:.85)); M.bars.forEach((b,k)=>{ g.fillStyle=s.col; g.globalAlpha=.85; const hh=8+b*120; g.fillRect(k*25.6+4,140-hh,18,hh); }); g.globalAlpha=1; };
  FRAME.push(tick); w.onClose=()=>{ M.play=false; const i=FRAME.indexOf(tick); if(i>=0) FRAME.splice(i,1); };
  sel(0);
};

APPIMPL.paint=(body)=>{
  body.style.cssText+=';display:flex;flex-direction:column';
  const tools=h('div','row'); tools.style.cssText='padding:12px 18px;gap:10px;border-bottom:1px solid var(--line)';
  const cvs=cv(1200,680); cvs.dataset.canvas=''; cvs.style.cssText='flex:1;width:100%;min-height:0;background:#fffdf7;display:block';
  body.append(tools,cvs);
  const g=cvs.getContext('2d'); g.fillStyle='#fffdf7'; g.fillRect(0,0,1200,680); g.lineCap=g.lineJoin='round';
  let col='#2b2b2b', size=10, last=null;
  for(const c of ['#2b2b2b','#ff5a5f','#ffb35c','#ffe066','#3ecf8e','#4c8dff','#b06bff','#ffffff']){ const b=h('button','wbtn'); b.style.background=c; b.style.border='3px solid rgba(255,255,255,.4)'; b.onclick=()=>{ col=c; tools.querySelectorAll('.wbtn').forEach(x=>x.style.outline=''); b.style.outline='3px solid #fff'; }; tools.appendChild(b); }
  const sz=makeSlider(.3,v=>size=3+v*30); sz.style.width='160px'; tools.appendChild(h('span','sub','太さ')); tools.appendChild(sz);
  const cl=h('button','btn','ぜんぶ消す'); cl.onclick=()=>{ g.fillStyle='#fffdf7'; g.fillRect(0,0,1200,680); }; tools.appendChild(cl);
  const pt=(x,y)=>[x*1200,y*680];
  cvs._xr={down(x,y){ last=pt(x,y); g.fillStyle=col; g.beginPath(); g.arc(last[0],last[1],size/2,0,TAU); g.fill(); },
    move(x,y){ const p=pt(x,y); g.strokeStyle=col; g.lineWidth=size; g.beginPath(); g.moveTo(last[0],last[1]); g.lineTo(p[0],p[1]); g.stroke(); last=p; }, up(){ last=null; }};
  tools.querySelector('.wbtn').style.outline='3px solid #fff';
};


/* ================= ゲーム（360°） ================= */
let GAMEON=null, GAME=null;
const HUDHOOK=[];
function hideHomeForGame(){
  GAME.hidden=[]; for(const o of [LIB,CLOCK,LEFT,DOCK,...WINS.map(w=>w.o)]) if(o.shown){ GAME.hidden.push(o); o.show(false); }
  closePanels(); hideKB(); setDim(Math.max(CFG.dim,.55),true);
}
function startGame(id){
  if(GAMEON) endGame(true);
  GAMEON=id; GAME={id,score:0,combo:0,t:0,objs:[],yaw0:S.yaw,phase:'count',count:3.2};
  hideHomeForGame();
  const hudEl=h('div','mini'); hudEl.style.cssText='width:max-content;white-space:nowrap;padding:14px 22px;display:flex;gap:22px;align-items:center;border-radius:999px';
  hudEl.innerHTML=`<b style="font-size:20px">${APPS[id].name}</b><span class="sub">スコア</span><b id="gScore" style="font-size:26px;min-width:70px">0</b><span class="sub">のこり</span><b id="gTime" style="font-size:26px;min-width:44px">--</b><span id="gCombo" class="sub" style="min-width:80px"></span>`;
  const q=h('button','btn','やめる'); q.onclick=()=>endGame(); hudEl.appendChild(q);
  GAME.hud=new WO(hudEl,{yaw:S.yaw,y:-330,d:1});
  const big=h('div',''); big.style.cssText='font-size:150px;font-weight:900;color:#fff;text-shadow:0 10px 40px rgba(0,0,0,.6);text-align:center;white-space:nowrap';
  GAME.big=new WO(big,{yaw:S.yaw,y:-40,d:1});
  (id==='target'?initTarget:initSlash)();
  AU.tone(523,.15,'triangle',.12); FRAME.push(gameTick);
}
function endGame(silent){
  if(!GAMEON) return; const G0=GAME; GAMEON=null; GAME=null;
  const i=FRAME.indexOf(gameTick); if(i>=0) FRAME.splice(i,1);
  for(const o of G0.objs) o.wo&&o.wo.remove(); G0.hud.remove(); G0.big.remove(); if(G0.res) G0.res.remove(); if(G0.extra) G0.extra.forEach(o=>o.remove());
  HUDHOOK.length=0; MUS.stop(); GAMEPINCH=null;
  setDim(CFG.dim,true); for(const o of G0.hidden) o.show(true);
  if(!WINS.length&&!silent) toggleLib(true);
}
function gameTick(dt){
  const G0=GAME; if(!G0) return;
  if(G0.phase==='count'){ G0.count-=dt; const n=Math.ceil(G0.count); G0.big.el.textContent=n>0?String(n):'スタート！'; if(n!==G0.lastN){ G0.lastN=n; AU.tone(n>0?660:990,.12,'square',.08); }
    if(G0.count<=-.5){ G0.phase='play'; G0.big.show(false); G0.onStart&&G0.onStart(); } return; }
  if(G0.phase==='play'){ G0.t+=dt; const left=G0.dur-G0.t; $('gTime').textContent=Math.max(0,Math.ceil(left)); G0.update(dt);
    if(left<=0) finishGame(); }
}
function setScore(add,label){
  const G0=GAME; G0.score=Math.max(0,G0.score+add); $('gScore').textContent=G0.score; $('gCombo').textContent=G0.combo>1?`${G0.combo} コンボ`:'';
  if(label) popText(label,add>0);
}
function popText(t,good){
  const e=h('div','',t); e.style.cssText=`font-size:46px;font-weight:900;color:${good?'#ffe066':'#ff7a7a'};text-shadow:0 4px 18px rgba(0,0,0,.6);white-space:nowrap;transition:transform .7s,opacity .7s`;
  const o=new WO(e,{yaw:S.yaw+deg(Math.atan((S.cx-S.W/2)/S.P)),y:(S.cy-S.H/2)*.9-60,d:.9}); requestAnimationFrame(()=>{ e.style.transform='translateY(-60px)'; e.style.opacity=0; }); setTimeout(()=>o.remove(),750);
}
function finishGame(){
  const G0=GAME; G0.phase='end'; MUS.stop();
  for(const o of G0.objs) o.wo&&o.wo.remove(); G0.objs=[];
  const best=STORE.get('score',{}); const nb=G0.score>(best[G0.id]||0); if(nb){ best[G0.id]=G0.score; STORE.set('score',best); }
  const el=h('div','mini'); el.style.width='560px'; el.style.textAlign='center';
  el.innerHTML=`<div class="sub">${APPS[G0.id].name}</div><div style="font-size:72px;font-weight:900;margin:6px 0">${G0.score}</div><div class="sub" style="margin-bottom:6px">${nb?'🎉 じこベスト更新！':'ベスト：'+(best[G0.id]||0)}</div><div class="sub" style="margin-bottom:18px">${G0.stat||''}</div>`;
  const r=h('div','row'); r.style.justifyContent='center'; const a=h('button','btn pri','もう一回'); a.onclick=()=>{ const id=G0.id; endGame(true); startGame(id); }; const b=h('button','btn','ホームへ'); b.onclick=()=>endGame(); r.append(a,b); el.appendChild(r);
  G0.res=new WO(el,{yaw:S.yaw,y:-20,d:.95}); turnTo(S.yaw);
  AU.tone(784,.15,'triangle',.12); setTimeout(()=>AU.tone(1047,.25,'triangle',.12),160);
}
// 画面外のまとを指す矢印
function drawPointer(g,yaw,ypx,col){
  const dy=angDiff(yaw,S.yaw); const sx=S.W/2+Math.tan(rad(clamp(dy,-80,80)))*S.P; if(Math.abs(dy)<35&&sx>40&&sx<S.W-40) return;
  const right=dy>0, x=right?S.W-48:48, y=clamp(S.H/2+ypx*.4,90,S.H-90);
  g.save(); g.translate(x,y); g.rotate(right?0:Math.PI); g.fillStyle=col; g.globalAlpha=.85+.15*Math.sin(S.t*8);
  g.beginPath(); g.moveTo(22,0); g.lineTo(-12,-20); g.lineTo(-4,0); g.lineTo(-12,20); g.closePath(); g.fill(); g.restore();
}

/* ---- まとあて360 ---- */
function initTarget(){
  const G0=GAME; G0.dur=45; G0.spawnT=0; G0.hits=0; G0.miss=0;
  G0.update=dt=>{
    G0.spawnT-=dt; const maxN=G0.t<15?3:G0.t<30?4:5;
    if(G0.spawnT<=0&&G0.objs.length<maxN){ G0.spawnT=Math.max(.45,1.2-G0.t*.015); spawnTarget(); }
    for(const o of [...G0.objs]){ o.life-=dt; const k=clamp(o.life/o.max,0,1); o.wo.s=.55+.45*k; o.wo.place(); o.wo.el.style.opacity=k<.2?k/.2:1;
      if(o.life<=0){ o.wo.remove(); G0.objs.splice(G0.objs.indexOf(o),1); G0.combo=0; G0.miss++; setScore(0); } }
  };
  GAMEPINCH=el=>{
    const t=el&&el.closest('.tgt'); if(!t){ AU.tone(200,.08,'sine',.08); G0.combo=0; setScore(0); return; }
    const o=G0.objs.find(x=>x.wo.el===t); if(!o) return;
    const r=t.getBoundingClientRect(); const d=Math.hypot(S.cx-(r.left+r.width/2),S.cy-(r.top+r.height/2))/(r.width/2);
    const base=d<.33?100:d<.66?50:20; G0.combo++; G0.hits++;
    const pts=Math.round(base*(1+Math.min(G0.combo-1,10)*.1));
    AU.tone(base===100?1320:base===50?990:740,.12,'triangle',.14); AU.noise(.12,.12,2000);
    t.classList.add('boom'); setTimeout(()=>o.wo.remove(),260); G0.objs.splice(G0.objs.indexOf(o),1);
    setScore(pts,(base===100?'ど真ん中！ +':'+')+pts);
  };
  HUDHOOK.push(g=>{ if(!GAME||GAME.phase!=='play') return; for(const o of GAME.objs) drawPointer(g,o.wo.yaw,o.wo.y,'#ffd166'); });
  G0.stat='';
  const f=G0.update; G0.update=dt=>{ f(dt); G0.stat=`当てた数：${G0.hits}　にがした数：${G0.miss}`; };
}
let GAMEPINCH=null;
function spawnTarget(){
  const G0=GAME; const el=h('div','tgt');
  el.style.cssText='width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,#ff4a4a 0 16%,#fff 17% 33%,#ff8a3d 34% 50%,#fff 51% 66%,#ffcf4a 67% 100%);box-shadow:0 0 0 6px rgba(255,255,255,.9),0 18px 40px rgba(0,0,0,.45);transition:transform .25s,opacity .25s';
  const yaw=G0.yaw0+(Math.random()*2-1)*(G0.t<10?70:150), y=-300+Math.random()*520, d=.9+Math.random()*.6;
  const o={wo:new WO(el,{yaw,y,d,s:.2}),life:3.6-Math.min(1.4,G0.t*.03),max:0}; o.max=o.life; G0.objs.push(o);
  AU.tone(520,.06,'sine',.05,1.6);
}

/* ---- キューブスラッシュ ---- */
const MUS={on:false,next:0,beat:0,bpm:104,
  start(){ if(!AU.ctx) return; this.on=true; this.beat=0; this.next=AU.ctx.currentTime+.1; },
  stop(){ this.on=false; },
  tick(onBeat){ if(!this.on||!AU.ctx) return; const c=AU.ctx, spb=60/this.bpm;
    while(this.next<c.currentTime+.12){ const t=this.next, b=this.beat;
      const o=c.createOscillator(), g=c.createGain(); o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(40,t+.15); g.gain.setValueAtTime(.35,t); g.gain.exponentialRampToValueAtTime(.001,t+.18); o.connect(g); g.connect(AU.master); o.start(t); o.stop(t+.2);
      const n=c.createBufferSource(), nb=c.createBuffer(1,c.sampleRate*.05,c.sampleRate), a=nb.getChannelData(0); for(let i=0;i<a.length;i++) a[i]=(Math.random()*2-1)*(1-i/a.length); n.buffer=nb; const hp=c.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=6000; const ng=c.createGain(); ng.gain.value=.12; n.connect(hp); hp.connect(ng); ng.connect(AU.master); n.start(t+spb/2);
      const ch=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]][Math.floor(b/4)%4];
      if(b%4===0) for(const m of ch){ const p=c.createOscillator(), pg=c.createGain(); p.type='sawtooth'; p.frequency.value=mtof(m); const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1200; pg.gain.setValueAtTime(0,t); pg.gain.linearRampToValueAtTime(.025,t+.05); pg.gain.exponentialRampToValueAtTime(.001,t+spb*4); p.connect(lp); lp.connect(pg); pg.connect(AU.master); p.start(t); p.stop(t+spb*4+.1); }
      const ml=c.createOscillator(), mg=c.createGain(); ml.type='square'; ml.frequency.value=mtof(ch[(b*2)%3]+12); mg.gain.setValueAtTime(.03,t); mg.gain.exponentialRampToValueAtTime(.001,t+spb*.8); ml.connect(mg); mg.connect(AU.master); ml.start(t); ml.stop(t+spb);
      onBeat(b,t-c.currentTime); this.beat++; this.next+=spb; } }
};
const DIRS={up:[0,-1,'↑'],down:[0,1,'↓'],left:[-1,0,'←'],right:[1,0,'→'],any:[0,0,'●']};
function initSlash(){
  const G0=GAME; G0.dur=60; G0.cut=0; G0.miss=0; G0.vx=0; G0.vy=0; G0.px=S.cx; G0.py=S.cy;
  // ネオンのレーン
  G0.extra=[]; for(const sd of [-1,1]){ const l=h('div',''); l.style.cssText=`width:14px;height:900px;border-radius:7px;background:linear-gradient(${sd<0?'#ff3b6b':'#2f8bff'},transparent);box-shadow:0 0 30px ${sd<0?'#ff3b6b':'#2f8bff'};opacity:.7`; G0.extra.push(new WO(l,{yaw:G0.yaw0+sd*28,y:120,d:1.6})); }
  G0.onStart=()=>MUS.start();
  G0.update=dt=>{
    // カーソルの速さ
    const vx=(S.cx-G0.px)/Math.max(dt,1e-3), vy=(S.cy-G0.py)/Math.max(dt,1e-3); G0.px=S.cx; G0.py=S.cy; G0.vx=lerp(G0.vx,vx,.5); G0.vy=lerp(G0.vy,vy,.5);
    MUS.tick((b,delay)=>{ if(G0.t>G0.dur-2.5) return; if(b%2===0||(G0.t>20&&Math.random()<.35)) setTimeout(()=>GAME===G0&&spawnCube(),Math.max(0,delay*1000)); });
    const thr=330*Math.min(S.W,S.H)/800, sp=Math.hypot(G0.vx,G0.vy);
    for(const o of [...G0.objs]){ if(o.dead) continue; o.d-=dt*o.speed; o.wo.d=o.d; o.wo.place();
      if(o.d<1.25&&o.d>.7){ const over=S.hit&&S.hit.closest('.cube')===o.wo.el;
        if(over){ const [dx,dy]=DIRS[o.dir]; const ok=o.dir==='any'?sp>thr*.6:(sp>thr&&(G0.vx*dx+G0.vy*dy)/sp>.55); if(ok) cutCube(o,true); } }

APPIMPL.breakout=(body,w)=>{
  const c=cv(1200,900); c.dataset.canvas=''; c.style.cssText='width:100%;height:100%;display:block;background:#0b2a2a'; body.appendChild(c);
  const g=c.getContext('2d'); const W=1200,H=900;
  const B={px:600,ball:null,lives:3,score:0,level:1,bricks:[],msg:'つまんでスタート'};
  const build=()=>{ B.bricks=[]; for(let r=0;r<6;r++) for(let k=0;k<10;k++) B.bricks.push({x:60+k*108,y:90+r*44,w:96,h:32,c:['#ff6b8b','#ff9f5c','#ffd166','#6ee7b7','#5ad1ff','#a78bfa'][r],alive:true}); };
  build();
  const launch=()=>{ if(B.ball) return; if(B.lives<=0){ B.lives=3; B.score=0; B.level=1; build(); } B.ball={x:B.px,y:H-110,vx:(Math.random()<.5?-1:1)*360,vy:-560-B.level*40}; B.msg=''; AU.tone(660,.08,'square',.06); };
  c._xr={down(){ launch(); }};
  const tick=dt=>{ if(!body.isConnected) return;
    if(S.hit===c){ const p=localPos(c); B.px=clamp(p.x*W,90,W-90); }
    const b=B.ball;
    if(b){ b.x+=b.vx*dt; b.y+=b.vy*dt;
      if(b.x<14||b.x>W-14){ b.vx*=-1; b.x=clamp(b.x,14,W-14); AU.tone(440,.03,'square',.03); }
      if(b.y<14){ b.vy*=-1; b.y=14; }
      if(b.y>H-80&&b.y<H-56&&Math.abs(b.x-B.px)<95&&b.vy>0){ b.vy=-Math.abs(b.vy); b.vx=(b.x-B.px)/95*620; AU.tone(520,.04,'square',.05); }
      for(const k of B.bricks){ if(!k.alive) continue; if(b.x>k.x-12&&b.x<k.x+k.w+12&&b.y>k.y-12&&b.y<k.y+k.h+12){ k.alive=false; b.vy*=-1; B.score+=10*B.level; AU.tone(700+Math.random()*500,.05,'triangle',.06); break; } }
      if(b.y>H+20){ B.ball=null; B.lives--; AU.tone(180,.3,'sawtooth',.08,.5); B.msg=B.lives>0?'つまんでつづける':'ゲームオーバー（つまんでもう一回）'; if(B.lives<=0){ const best=STORE.get('score',{}); if(B.score>(best.breakout||0)){ best.breakout=B.score; STORE.set('score',best); } } }
      if(B.bricks.every(k=>!k.alive)){ B.level++; build(); B.ball=null; B.msg=`レベル${B.level}！つまんでスタート`; AU.tone(1047,.2,'triangle',.1); }
    } else if(!B.ball){ }
    g.fillStyle='#0b2a2a'; g.fillRect(0,0,W,H);
    for(const k of B.bricks) if(k.alive){ g.fillStyle=k.c; rr(g,k.x,k.y,k.w,k.h,8,k.c); }
    g.fillStyle='#fff'; rr(g,B.px-90,H-72,180,22,11,'#fff');
    const bx=b?b.x:B.px, by=b?b.y:H-100; g.fillStyle='#fff'; g.beginPath(); g.arc(bx,by,13,0,TAU); g.fill();
    g.fillStyle='rgba(255,255,255,.85)'; g.font='bold 34px system-ui'; g.textAlign='left'; g.fillText(`スコア ${B.score}`,30,50); g.textAlign='right'; g.fillText('●'.repeat(Math.max(0,B.lives))+`  Lv.${B.level}`,W-30,50);
    if(B.msg){ g.textAlign='center'; g.font='bold 44px system-ui'; g.fillText(B.msg,W/2,H/2+120); }
  };
  FRAME.push(tick); w.onClose=()=>{ const i=FRAME.indexOf(tick); if(i>=0) FRAME.splice(i,1); };
};

// ---- カメラで手を認識（右手：人さし指＝カーソル、親指とつまむ、手のひら＝メニュー） ----
const HT={on:false,rec:null,video:null,last:-1,gap:66,avg:null,pin:false,palmT:0,palmFired:false,sx:null,sy:null,seen:0};
async function startHands(){
  if(HT.on) return; toastW('手の認識を準備しています…');
  try{
    const v=$('handCam'); const back=CFG.handCam!=='front'; const st=await openCam(back?'environment':'user',{width:{ideal:640},height:{ideal:480},frameRate:{ideal:30}}); HT.back=back; v.style.transform=back?'none':'scaleX(-1)'; v.srcObject=st; await v.play(); HT.video=v;
    const V='0.10.14';
    const mp=await import(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${V}/vision_bundle.mjs`);
    const fs=await mp.FilesetResolver.forVisionTasks(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${V}/wasm`);
    const opt=d=>({baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task',delegate:d},runningMode:'VIDEO',numHands:1,minHandDetectionConfidence:.3,minHandPresenceConfidence:.3,minTrackingConfidence:.3});
    try{ HT.rec=await mp.GestureRecognizer.createFromOptions(fs,opt('GPU')); }catch(e){ HT.rec=await mp.GestureRecognizer.createFromOptions(fs,opt('CPU')); }
    HT.on=true; document.body.classList.add('hands'); CFG.hands=true; saveCfg(); toastW('右手の人さし指でカーソル、親指とくっつけてつまむ。手のひらでメニュー');
  }catch(e){ console.warn(e); stopHands(); toastW('手の認識を始められませんでした（カメラとネットが必要です）'); }
}
function stopHands(){ HT.on=false; CFG.hands=false; saveCfg(); document.body.classList.remove('hands'); const v=$('handCam'); if(v.srcObject){ v.srcObject.getTracks().forEach(t=>t.stop()); v.srcObject=null; } if(HT.pin){ HT.pin=false; pinchUp(); } }
FRAME.push(()=>{
  if(!HT.on||!HT.rec||!HT.video||HT.video.readyState<2) return;
  const now=performance.now(); if(now-HT.last<HT.gap) return; HT.last=now;
  let r; const t0=performance.now(); try{ r=HT.rec.recognizeForVideo(HT.video,now); }catch(e){ return; }
  // 重い端末では、認識する回数を自動で減らす
  const took=performance.now()-t0; HT.avg=HT.avg==null?took:HT.avg*.9+took*.1; HT.gap=clamp(HT.avg*3,50,250);
  if(HT.avg>180){ HT.slow=(HT.slow||0)+1; if(HT.slow>20){ stopHands(); toastW(L('この端末では手の認識が重すぎるので、オフにしました','Hand tracking was too slow on this device and was turned off')); return; } } else HT.slow=0;
  // 前カメラは鏡にしていないので、ラベルの Left が自分の右手
  const base=HT.back?'Right':'Left', want=CFG.swapHand?(base==='Right'?'Left':'Right'):base; let idx=-1;
  if(r.landmarks&&r.landmarks.length) idx=0;
  $('handCam').classList.toggle('seen',idx>=0);
  if(idx<0){ HT.seen=0; HT.lost=(HT.lost||0)+1; if(HT.pin&&HT.lost>6){ HT.pin=false; pinchUp(); } return; }
  HT.lost=0;
  HT.seen++;
  const L=r.landmarks[idx], g=(r.gestures[idx]&&r.gestures[idx][0])||{};
  // 手のひら → メニュー
  if(g.categoryName==='Open_Palm'&&g.score>.6){ HT.palmT+=.033; if(HT.palmT>.6&&!HT.palmFired){ HT.palmFired=true; togglePalmMenu(true); AU.tone(990,.12,'sine',.1); } }
  else{ HT.palmT=0; HT.palmFired=false; }
  // カーソルの位置：人さし指の付け根と「親指と人さし指のまん中」を使う
  // （指先だとつまむ瞬間にカーソルが右下へズレるので）
  const tip=L[8], th=L[4], w=L[0], mm=L[9], mcp=L[5];
  const ax=mcp.x*.5+(tip.x+th.x)/4, ay=mcp.y*.5+(tip.y+th.y)/4;
  const nx=clamp(((HT.back?ax:1-ax)-.2)/.6,0,1), ny=clamp((ay-.2)/.55,0,1);
  const size=Math.hypot(w.x-mm.x,w.y-mm.y)||.1, d=Math.hypot(tip.x-th.x,tip.y-th.y)/size;
  let tx=nx*S.W, ty=ny*S.H;
  // つまんでいる間：つまむ直前の位置を起点に、そこからの手の動きだけ反映
  if(HT.pin){
    if(now<HT.lock){ tx=HT.ox; ty=HT.oy; }
    else{ if(HT.rx==null){ HT.rx=tx; HT.ry=ty; } tx=HT.ox+(tx-HT.rx); ty=HT.oy+(ty-HT.ry); }
  }
  // 指を近づけているあいだは、カーソルをほとんど動かさない
  const k=HT.pin?(now<HT.lock?1:.4):d<.8?.08:.45;
  HT.sx=HT.sx==null?tx:lerp(HT.sx,tx,k); HT.sy=HT.sy==null?ty:lerp(HT.sy,ty,k);
  HT.close=HT.pin?1:clamp((1.05-d)/(1.05-.5),0,1);
  // 指が開いていたときの位置を覚えておく（つまんだらそこに戻す）
  if(d>.85&&!HT.pin){ HT.ox=HT.sx; HT.oy=HT.sy; HT.ot=now; }
  const frozen=now<(HT.freeze||0);
  if(HT.seen>2&&!frozen){ S.cx=clamp(HT.sx,0,S.W); S.cy=clamp(HT.sy,0,S.H); IN.mouse=false; if(S.pinch) pinchMove(); }
  // つまむ／はなす（ゆるめに判定）
  if(!HT.pin&&d<.5&&g.categoryName!=='Open_Palm'){
    HT.pin=true; HT.lock=now+200; HT.rx=null;
    if(HT.ox==null||now-HT.ot>800){ HT.ox=HT.sx; HT.oy=HT.sy; }
    HT.sx=HT.ox; HT.sy=HT.oy; S.cx=clamp(HT.ox,0,S.W); S.cy=clamp(HT.oy,0,S.H);
    updateHover(); pinchDown(); if(DRAG){ DRAG.hand=true; DRAG.tol=34; }
    AU.tone(1100,.03,'sine',.05); HT.dwellT=0;
  }
  else if(HT.pin&&d>.7){ HT.pin=false; pinchUp(); HT.freeze=now+250; HT.ox=null; }
  // 止めてクリック（オプション）
  if(CFG.dwell&&!HT.pin&&HT.seen>2){
    if(HT.dx==null||Math.hypot(S.cx-HT.dx,S.cy-HT.dy)>16||!HOV){ HT.dx=S.cx; HT.dy=S.cy; HT.dwellT=0; }
    else{ HT.dwellT=(HT.dwellT||0)+(now-(HT.dlast||now)); if(HT.dwellT>1100){ HT.dwellT=-900; pinchDown(); if(DRAG){ DRAG.hand=true; DRAG.tol=34; } pinchUp(); } }
    HT.dlast=now;
  } else { HT.dwellT=0; HT.dlast=now; }
});
// カーソルのまわりに「どれくらいつまめているか」を表示
HUDHOOK.push(x=>{
  if(!HT.on||!HT.seen) return;
  const c=S.pinch?1:(HT.close||0), dw=CFG.dwell&&HT.dwellT>0?Math.min(1,HT.dwellT/1100):0;
  if(c>.05&&!S.pinch){ x.beginPath(); x.arc(S.cx,S.cy,24,-Math.PI/2,-Math.PI/2+c*TAU); x.lineWidth=4; x.strokeStyle=c>.85?'rgba(120,230,150,.95)':'rgba(255,255,255,.7)'; x.stroke(); }
  if(dw>0){ x.beginPath(); x.arc(S.cx,S.cy,31,-Math.PI/2,-Math.PI/2+dw*TAU); x.lineWidth=4; x.strokeStyle='rgba(90,170,255,.95)'; x.stroke(); }
});

function canvasApp(body,w,o){
  const W=w.app.w, H=w.app.h-58, K=1.5;
  const c=cv(W*K,H*K); c.dataset.canvas=''; c.style.cssText='width:100%;height:100%;display:block;background:'+(o.bg||'#14161c');
  body.appendChild(c); const g=c.getContext('2d'); g.scale(K,K);
  const st={W,H,hx:null,hy:null,pin:false,t:0};
  c._xr={down(x,y){ st.pin=true; o.down&&o.down(x*W,y*H); }, move(x,y){ o.move&&o.move(x*W,y*H); }, up(){ st.pin=false; o.up&&o.up(); }};
  const tick=dt=>{ if(!c.isConnected) return; st.t+=dt; if(S.hit===c){ const p=localPos(c); st.hx=p.x*W; st.hy=p.y*H; } else st.hx=st.hy=null; try{ o.draw(g,dt,st); }catch(e){ console.error(e); } };
  FRAME.push(tick); const prev=w.onClose; w.onClose=()=>{ prev&&prev(); const i=FRAME.indexOf(tick); if(i>=0) FRAME.splice(i,1); o.close&&o.close(); };
  return {c,g,st};
}
function onFrame(w,f){ FRAME.push(f); const prev=w.onClose; w.onClose=()=>{ prev&&prev(); const i=FRAME.indexOf(f); if(i>=0) FRAME.splice(i,1); }; }

// サイトの置き方：
//   /index.html              … いちばん新しいバージョン

const UPD={base:'',manifest:null,checked:false};
(function(){ const p=location.pathname; const i=p.indexOf('/versions/'); UPD.base=i>=0?p.slice(0,i+1):p.replace(/[^/]*$/,''); })();
const vcmp=(a,b)=>{ const x=String(a).split('.').map(Number), y=String(b).split('.').map(Number); for(let i=0;i<3;i++){ if((x[i]||0)!==(y[i]||0)) return (x[i]||0)-(y[i]||0); } return 0; };
const verURL=v=>UPD.base+'versions/'+v+'/';
async function fetchManifest(){
  if(location.protocol==='file:') throw new Error(L('ファイルから開いているので確認できません','Opened from a file'));
  const c=new AbortController(); const t=setTimeout(()=>c.abort(),5000);
  try{ const r=await fetch(UPD.base+'versions.json?t='+Date.now(),{cache:'no-store',signal:c.signal}); if(!r.ok) throw new Error('HTTP '+r.status); UPD.manifest=await r.json(); UPD.checked=true; return UPD.manifest; }
  finally{ clearTimeout(t); }
}
// 同じ移動をくり返さない（古いページがキャッシュに残っていても止まる）

function goVersion(v,why,now){

  const url=verURL(v)+'?v='+v;

}

      all.forEach(r=>{ const b=h('button','noti hov-l'); b.style.cssText='width:100%;text-align:left;align-items:center'+(room&&room.id===r.id?';background:rgba(255,255,255,.14)':''); b.innerHTML=r.dm?`<div class="avatar" style="background:${esc(r.color||'#888')};color:#222">${esc([...r.name][0]||'?')}</div><div><b>${esc(r.name)}</b><span>${L('ふたりのチャット','Direct')}</span></div>`:`<div><b>${esc(r.name)}</b><span>${L('だれでも話せる','Open to everyone')}</span></div>`; b.onclick=()=>open(r); side.appendChild(b); }); };
    unsubUsers=m.onSnapshot(m.query(m.collection(FB.db,'xr_users'),m.limit(50)),s=>drawSide(s.docs.map(d=>({id:d.id,...d.data()}))),e=>{ drawSide([]); });
    const open=r=>{ room=r; head.textContent=r.name; unsubMsg&&unsubMsg(); th.innerHTML=''; side.querySelectorAll('.noti').forEach(b=>b.style.background=b.textContent.includes(r.name)?'rgba(255,255,255,.14)':'');
      const q=m.query(m.collection(FB.db,'xr_rooms',r.id,'messages'),m.orderBy('createdAt','desc'),m.limit(60));
      unsubMsg=m.onSnapshot(q,s=>{ th.innerHTML=''; s.docs.slice().reverse().forEach(d=>{ const x=d.data(), me=x.uid===FB.user.uid; const wr=h('div',''); wr.style.cssText=`display:flex;flex-direction:column;align-items:${me?'flex-end':'flex-start'};margin:6px 0`;
        if(!me) wr.appendChild(h('div','sub',esc(x.name||'?')));
        const b=h('div','',esc(x.text)); b.style.cssText=`max-width:72%;padding:12px 16px;border-radius:20px;font-size:18px;line-height:1.5;white-space:pre-wrap;word-break:break-word;${me?'background:var(--acc);border-bottom-right-radius:6px':'background:rgba(255,255,255,.12);border-bottom-left-radius:6px'}`; wr.appendChild(b); wr.appendChild(h('div','sub',timeAgo(x.createdAt))).style.fontSize='12px'; th.appendChild(wr); });
        th.scrollTop=th.scrollHeight; },e=>{ th.innerHTML=`<p class="sub">${esc(fbErr(e))}</p>`; }); };
    const send=async t=>{ t=clean(t,500); if(!t||!room) return; try{ if(room.dm) await m.setDoc(m.doc(FB.db,'xr_rooms',room.id),{members:room.id.slice(3).split('_')},{merge:true}); await m.addDoc(m.collection(FB.db,'xr_rooms',room.id,'messages'),{uid:FB.user.uid,name:FB.profile.name,text:t,createdAt:m.serverTimestamp()}); AU.tone(900,.08,'sine',.1,1.3); }catch(e){ toastW(fbErr(e)); } };
    const field=inputField(w,L('メッセージ','Message'),{enter:L('送信','Send'),onEnter:t=>{ send(t); field.set(''); }}); field.style.flex='1';
    inp.append(field); for(const q of ['👍','😊',L('またね','Bye')]){ const b=btn(q,()=>send(q)); b.style.padding='8px 14px'; inp.appendChild(b); }
    open(rooms[0]); };
  const off=fbOn(()=>render()); render();
};

const _feedDemo=APPIMPL.feed;
APPIMPL.feed=(body,w)=>{
  if(!FB_CONFIG){ _feedDemo(body,w); return; }
  const sc=h('div','scroll pad'); body.appendChild(sc); let unsub=null;
  onCloseAdd(w,()=>{ unsub&&unsub(); off(); });
  const render=async()=>{ unsub&&unsub(); unsub=null; sc.innerHTML=`<p class="sub">${L('読みこみ中…','Loading…')}</p>`;
    try{ await fbInit(); }catch(e){ sc.innerHTML=`<b>${L('つながりませんでした','Could not connect')}</b><p class="sub">${esc(fbErr(e))}</p>`; return; }
    if(!FB.user){ loginUI(sc,w); return; }
    const m=FB.m; sc.innerHTML='';
    // 投稿する
    const comp=h('div','card'); comp.style.marginBottom='18px'; let seed=(Math.random()*1000)|0, withPic=true;
    const prev=cv(400,200); prev.style.cssText='width:200px;border-radius:12px'; const drawPrev=()=>{ scene(prev.getContext('2d'),400,200,seed,seed%3===1?'night':''); prev.style.display=withPic?'block':'none'; };
    const f=inputField(w,L('いまどうしてる？','What’s happening?'),{enter:L('投稿','Post'),onEnter:()=>{ hideKB(); }});
    const r=h('div','row'); r.style.marginTop='10px';
    r.append(btn('🎲 '+L('写真をかえる','New picture'),()=>{ seed=(Math.random()*1000)|0; withPic=true; drawPrev(); }),btn(L('写真なし','No picture'),()=>{ withPic=false; drawPrev(); }),btn(L('投稿する','Post'),async()=>{ const t=clean(f.get(),300); if(!t){ toastW(L('ことばを入れてね','Write something')); return; } try{ await m.addDoc(m.collection(FB.db,'xr_posts'),{uid:FB.user.uid,name:FB.profile.name,color:FB.profile.color,text:t,pic:withPic?seed:null,likes:[],createdAt:m.serverTimestamp()}); f.set(''); hideKB(); AU.tone(1046,.12,'triangle',.1); toastW(L('投稿しました','Posted')); }catch(e){ toastW(fbErr(e)); } },'pri'));
    comp.append(h('div','row',`<div class="avatar" style="background:${esc(FB.profile.color)};color:#222">${esc([...FB.profile.name][0])}</div><b>${esc(FB.profile.name)}</b>`),f,prev,r); f.style.margin='10px 0'; sc.appendChild(comp); drawPrev();
    const list=h('div',''); sc.appendChild(list);
    unsub=m.onSnapshot(m.query(m.collection(FB.db,'xr_posts'),m.orderBy('createdAt','desc'),m.limit(40)),s=>{ list.innerHTML=''; if(s.empty) list.appendChild(h('p','sub',L('まだ投稿がありません。最初の投稿をしてみよう！','No posts yet. Be the first!')));
      s.docs.forEach(d=>{ const x=d.data(); const p=h('div','card'); p.style.marginBottom='16px';
        p.appendChild(h('div','row',`<div class="avatar" style="background:${esc(x.color||'#888')};color:#222">${esc([...(x.name||'?')][0])}</div><div><b>${esc(x.name||'?')}</b><div class="sub">${timeAgo(x.createdAt)}</div></div>`));
        p.appendChild(h('p','',esc(x.text))).style.cssText='margin:12px 0;font-size:18px;line-height:1.6;white-space:pre-wrap';
        if(x.pic!=null){ const im=cv(660,330); scene(im.getContext('2d'),660,330,x.pic,x.pic%3===1?'night':''); im.style.cssText='width:100%;border-radius:16px;display:block'; p.appendChild(im); }
        const likes=x.likes||[], mine=likes.includes(FB.user.uid); const rr=h('div','row'); rr.style.marginTop='12px';
        const lb=btn(`${mine?'♥':'♡'} ${likes.length}`,async()=>{ try{ await m.updateDoc(m.doc(FB.db,'xr_posts',d.id),{likes:mine?m.arrayRemove(FB.user.uid):m.arrayUnion(FB.user.uid)}); if(!mine) AU.tone(1200,.1,'sine',.1,1.4); }catch(e){ toastW(fbErr(e)); } },mine?'pri':''); lb.setAttribute('aria-label',L(`いいね ${likes.length}`,`Like ${likes.length}`)); rr.appendChild(lb);
        if(x.uid===FB.user.uid) rr.appendChild(btn(L('消す','Delete'),async()=>{ try{ await m.deleteDoc(m.doc(FB.db,'xr_posts',d.id)); }catch(e){ toastW(fbErr(e)); } }));
        p.appendChild(rr); list.appendChild(p); }); },e=>{ list.innerHTML=`<p class="sub">${esc(fbErr(e))}</p>`; });
  };
  const off=fbOn(()=>render()); render();
};

/* ================= 端末のキーボード・貼り付け ================= */
const RK=(()=>{ const box=h('div',''); box.id='realKB'; box.hidden=true; box.style.cssText='position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translateX(-50%);z-index:30;width:min(720px,92vw);display:flex;gap:8px;background:rgba(24,24,28,.96);padding:10px;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.5)';
  const inp=document.createElement('input'); inp.type='text'; inp.autocomplete='off'; inp.setAttribute('autocapitalize','off'); inp.style.cssText='flex:1;min-width:0;font:inherit;font-size:18px;color:#fff;background:rgba(255,255,255,.1);border:2px solid var(--acc);border-radius:12px;padding:10px 12px;outline:none';
  const ok=document.createElement('button'); ok.className='btn pri'; ok.textContent=L('決定','Done'); const cl=document.createElement('button'); cl.className='btn'; cl.textContent='✕'; cl.setAttribute('aria-label',L('閉じる','Close'));
  box.append(inp,ok,cl); document.body.appendChild(box);
  const sync=()=>{ if(!KB.opts) return; KB.text=inp.value; KB.opts.onInput(inp.value); };
  inp.addEventListener('input',sync);
  const done=()=>{ sync(); const o=KB.opts; box.hidden=true; inp.blur(); if(o&&o.onEnter) o.onEnter(KB.text); };
  inp.addEventListener('keydown',e=>{ e.stopPropagation(); if(e.key==='Enter'){ e.preventDefault(); done(); } });
  inp.addEventListener('keyup',e=>e.stopPropagation());
  ok.onclick=done; cl.onclick=()=>{ box.hidden=true; inp.blur(); };
  return {box,inp,open(){ inp.value=KB.text||''; inp.placeholder=L('ここに入力・長押しで貼り付け','Type or long-press to paste'); box.hidden=false; inp.focus(); try{ inp.setSelectionRange(inp.value.length,inp.value.length); }catch(e){} }};
})();
async function readClip(){
  try{ if(navigator.clipboard&&navigator.clipboard.readText){ const t=await navigator.clipboard.readText(); if(t) return t.trim(); } }catch(e){}
  return null;
}
async function kbPaste(){
  const t=await readClip();
  if(t!=null){ KB.text+=t; KB.opts&&KB.opts.onInput(KB.text); toastW(L('貼り付けました','Pasted')); }
  else{ RK.open(); toastW(L('入力欄を長押しして「ペースト」してね','Long-press the box and choose Paste')); }
}
// 空間キーボードに「端末のキーボード」「貼り付け」を追加
const _drawKB2=drawKB;
drawKB=function(){ _drawKB2(); const row=h('div','kbr');
  const a=h('button','key xw','⌨️ '+L('端末のキーボードで入力','Use device keyboard')); a.onclick=()=>RK.open();
  const b=h('button','key w','📋 '+L('貼り付け','Paste')); b.onclick=kbPaste;
  row.append(a,b); KB.wo.el.insertBefore(row,KB.wo.el.firstChild); };
const _hideKB=hideKB;
hideKB=function(){ RK.box.hidden=true; _hideKB(); };
// 物理キーボード（Bluetoothなど）でもそのまま打てるように
addEventListener('keydown',e=>{
  if(!KB.wo||!KB.wo.shown||!KB.opts||!RK.box.hidden) return;
  if((e.metaKey||e.ctrlKey)&&e.key==='v'){ kbPaste(); e.preventDefault(); return; }
  if(e.key==='Backspace'){ KB.text=[...KB.text].slice(0,-1).join(''); KB.opts.onInput(KB.text); e.preventDefault(); e.stopImmediatePropagation(); }
  else if(e.key==='Enter'){ if(KB.opts.onEnter) KB.opts.onEnter(KB.text); e.preventDefault(); e.stopImmediatePropagation(); }
  else if(e.key.length===1&&!e.metaKey&&!e.ctrlKey){ kbType(e.key); e.preventDefault(); e.stopImmediatePropagation(); }
},true);
// YouTube・ブラウザに「貼り付けて開く」ボタン
function pasteInto(field,submit){ return async()=>{ const t=await readClip(); field.click(); if(t){ KB.text=t; KB.opts.onInput(t); if(submit) KB.opts.onEnter(t); } else { RK.open(); toastW(L('入力欄を長押しして「ペースト」してね','Long-press the box and choose Paste')); } }; }
const _yt=APPIMPL.youtube;
APPIMPL.youtube=(body,w)=>{ _yt(body,w); const f=body.querySelector('.field'); const b=btn('📋 '+L('貼り付けて再生','Paste & play'),pasteInto(f,true)); f.after(b); };
const _br=APPIMPL.browser;
APPIMPL.browser=(body,w)=>{ _br(body,w); const f=body.querySelector('.field'); const b=h('button','wbtn','📋'); b.setAttribute('aria-label',L('貼り付けて開く','Paste & go')); b.onclick=pasteInto(f,true); f.after(b); };

</script>
